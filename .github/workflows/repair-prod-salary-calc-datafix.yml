# 운영 급여 calc 1건 데이터 정정 (1회성, 20261005) — dry-run / apply / rollback
#
# 1회성 예외 승인: 사용자(재학)가 2026-10-05 01:18 KST 에 AGENTS.md §4 / 00-guardrails
#   「데이터 수동 보정 금지」의 1회성 예외로 이 정정(calc 1건, 특별지원금 제거, NEUTRALIZE)을 명시 승인했고
#   리더가 승인했다. 이 워크플로·SQL 은 그 1건 전용이며 다른 보정의 선례가 아니다. 정정 후 삭제 대상.
#
# SQL(체크아웃한 ref 의 커밋된 파일만 실행, 입력으로 SQL 을 받지 않음):
#   scripts/ops/salary_calc_datafix_20261005_{dry_run,apply,rollback}.sql
# 값(테넌트·calc·상담사·매핑·금액)은 저장소에 두지 않는다 → masked input `params`(key=value;…)
#   → scripts/ops/salary_calc_datafix_preamble.sh 가 검증 후 세션 변수 preamble 생성.
#   params 는 이벤트 페이로드 파일에서 직접 읽어 로그 헤더에 치환되지 않게 하고 ::add-mask:: 한다.
# 공개 저장소(로그 공개): SQL 은 금액·테넌트를 출력하지 않고 일치 여부(1/0)·차이만 출력한다.
# 안전 장치: apply/rollback 은 confirm=CONFIRM + KST 11:00–20:00 거부, mysql 은 --force 없이(첫 오류에서 중단),
#   dry-run 은 세션 READ ONLY. ref 는 release/dev · release/prod 만 허용.
# 트리거: workflow_dispatch 만. (기본 브랜치 main 에는 등록용으로 같은 파일만 있다. 실행은 --ref release/dev.)

name: 🔧 운영 급여 calc 데이터 정정 (1회성 20261005)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (조회만) | apply (정정) | rollback (복원)'
        required: true
        type: choice
        options: [dry-run, apply, rollback]
        default: dry-run
      confirm:
        description: 'apply/rollback 시 CONFIRM 입력'
        required: false
        default: ''
      params:
        description: 'key=value;… (tenant_id, calc_id, consultant_id, period, period_start, period_end, 금액·매핑). 로그에서 마스킹됨'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: prod-salary-calc-datafix-20261005
  cancel-in-progress: false

jobs:
  datafix:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Guard mode / confirm / ref / KST
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/release/dev|refs/heads/release/prod) ;;
            *) echo "::error::ref 는 release/dev 또는 release/prod 만 허용 (got $REF)"; exit 1 ;;
          esac
          case "$MODE" in dry-run|apply|rollback) ;; *) echo "::error::bad mode"; exit 1 ;; esac
          if [ "$MODE" != "dry-run" ]; then
            if [ "$CONFIRM" != "CONFIRM" ]; then
              echo "::error::$MODE 는 confirm=CONFIRM 필수"; exit 1
            fi
            H=$((10#$(TZ=Asia/Seoul date +%H)))
            if [ "$H" -ge 11 ] && [ "$H" -lt 20 ]; then
              echo "::error::운영 시간(11:00–20:00 KST)에는 $MODE 금지 (현재 KST ${H}시)"; exit 1
            fi
          fi
          echo "mode=$MODE ref=$REF KST=$(TZ=Asia/Seoul date '+%F %T')"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build preamble from masked params
        run: |
          set -euo pipefail
          jq -r '.inputs.params // ""' "$GITHUB_EVENT_PATH" \
            | bash scripts/ops/salary_calc_datafix_preamble.sh "$RUNNER_TEMP/preamble.sql"

      - name: Setup MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB secrets
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-${PRODUCTION_HOST:-}}"
          USER="${PRODUCTION_DB_USER:-mindgarden}"
          NAME="${PRODUCTION_DB_NAME:-}"
          PASS="${PRODUCTION_DB_PASSWORD:-}"
          if [ -z "$HOST" ] || [ -z "$PASS" ] || [ -z "$NAME" ]; then
            echo "::error::PRODUCTION_DB_HOST(또는 PRODUCTION_HOST), PRODUCTION_DB_PASSWORD, PRODUCTION_DB_NAME 필요"
            exit 1
          fi
          echo "::add-mask::$HOST"
          CNF="$RUNNER_TEMP/my.cnf"
          umask 077
          printf '[client]\nhost=%s\nuser=%s\npassword=%s\ndatabase=%s\ndefault-character-set=utf8mb4\n' \
            "$HOST" "$USER" "$PASS" "$NAME" > "$CNF"
          echo "MYSQL_CNF=$CNF" >> "$GITHUB_ENV"

      - name: Dry-run (READ ONLY session)
        if: github.event.inputs.mode == 'dry-run'
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/preamble.sql" scripts/ops/salary_calc_datafix_20261005_dry_run.sql \
            | mysql --defaults-extra-file="$MYSQL_CNF" --table \
                --init-command="SET SESSION TRANSACTION READ ONLY"
          echo "=== SHOW GRANTS (current user masked) ==="
          mysql --defaults-extra-file="$MYSQL_CNF" -N -e "SHOW GRANTS" \
            | sed -E "s/'[^']*'@'[^']*'/<current_user>/g; s/IDENTIFIED BY .*//"

      - name: Apply (no --force; any error aborts and rolls back)
        if: github.event.inputs.mode == 'apply'
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/preamble.sql" scripts/ops/salary_calc_datafix_20261005_apply.sql \
            | mysql --defaults-extra-file="$MYSQL_CNF" --table

      - name: Post-apply verify (dry-run SQL, READ ONLY)
        if: github.event.inputs.mode == 'apply'
        run: |
          set -euo pipefail
          echo "※ apply 후에는 금액이 새 값이라 guard_calc_pinned 등 old-값 가드가 0 인 것이 정상"
          cat "$RUNNER_TEMP/preamble.sql" scripts/ops/salary_calc_datafix_20261005_dry_run.sql \
            | mysql --defaults-extra-file="$MYSQL_CNF" --table \
                --init-command="SET SESSION TRANSACTION READ ONLY"

      - name: Rollback
        if: github.event.inputs.mode == 'rollback'
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/preamble.sql" scripts/ops/salary_calc_datafix_20261005_rollback.sql \
            | mysql --defaults-extra-file="$MYSQL_CNF" --table

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/my.cnf" "$RUNNER_TEMP/preamble.sql"
