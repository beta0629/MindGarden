# P0 INCIDENT — 센터 홈페이지 m-garden.co.kr(www) Cloudflare 502 원인 확인 (순수 읽기 전용)
# 트리거: workflow_dispatch 전용. 머지 후 수동 dispatch. push/PR 트리거 없음.
# SSH 시크릿 패턴: check-redis-env-presence(check-prod) / ops-health-snapshot 과 동일.
# 금지: 재시작·설정 변경·파일 쓰기·heal. 서버에 파일 업로드 없음(인라인 스크립트).
# 출력 규칙: nginx 설정은 m-garden 매칭 파일만, key/auth/password/token/secret 라인 값 마스킹.
#           프로세스는 comm(실행파일명)만 출력(cmdline/env 미출력). sudo 는 -n(비대화)·읽기 명령만.
# 추가(읽기 전용): /var/www/homepage 소스에서 DB/consultation 식별자 grep.
#           .env 는 키 이름만. 비밀번호·토큰·키·DATABASE_URL 값은 마스킹. node_modules/.next 제외.
# 추가(읽기 전용): 런타임 .env·PM2 env의 DB_NAME 존재/일치만 YES/NO. 값·HOST·USER·PASSWORD 미출력.

name: 🔎 Check prod homepage m-garden (read-only)

on:
  workflow_dispatch:

concurrency:
  group: check-prod-homepage-readonly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-prod-homepage:
    name: production host m-garden homepage (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only homepage diagnostics (production)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set +e
            mask() { awk '{ l=tolower($0); if (l ~ /(key|auth|password|passwd|token|secret|credential)/) { match($0,/^[[:space:]]*[^[:space:]]+/); print substr($0,RSTART,RLENGTH) " ***MASKED***;" } else print }'; }
            sec() { echo; echo "=================== $1"; }
            sec "date / uptime / boot"; date; uptime; who -b
            sec "df -h"; df -h
            sec "free -m"; free -m
            sec "nginx files matching m-garden"
            FILES=$(sudo -n grep -rlE 'm-garden' /etc/nginx 2>/dev/null | sort -u)
            echo "${FILES:-NONE}"
            for f in $FILES; do echo "----- $f"; sudo -n cat "$f" 2>/dev/null | grep -vE '^[[:space:]]*#' | grep -vE '^[[:space:]]*$' | mask; done
            sec "nginx -t"; sudo -n nginx -t 2>&1
            sec "systemctl status nginx"; systemctl --no-pager status nginx 2>&1 | head -25
            sec "upstreams from m-garden files"
            UP=$(for f in $FILES; do sudo -n grep -hoE '(proxy_pass|fastcgi_pass|uwsgi_pass)[[:space:]]+[^;]+|^[[:space:]]*server[[:space:]]+[0-9a-zA-Z_.\-]+:[0-9]+' "$f"; done | sort -u)
            echo "${UP:-NONE}"
            PORTS=$(echo "$UP" | grep -oE ':[0-9]+' | tr -d ':' | sort -u)
            sec "ss -ltnp"; sudo -n ss -ltnp 2>/dev/null || ss -ltn
            for p in $PORTS; do sec "curl 127.0.0.1:$p"; curl -sS -m 8 -o /dev/null -w "http_code=%{http_code} time=%{time_total}\n" "http://127.0.0.1:$p/" 2>&1; curl -sSI -m 8 "http://127.0.0.1:$p/" 2>&1 | head -12; done
            for h in m-garden.co.kr www.m-garden.co.kr; do
              sec "local curl https://$h (resolve 127.0.0.1)"; curl -skSI -m 10 --resolve "$h:443:127.0.0.1" "https://$h/" 2>&1 | head -12
              sec "local curl http://$h (resolve 127.0.0.1)"; curl -sSI -m 10 --resolve "$h:80:127.0.0.1" "http://$h/" 2>&1 | head -12
            done
            sec "systemd units (garden|home|php|wordpress|node|pm2|docker|apache|httpd)"
            systemctl list-units --all --no-pager --no-legend 2>/dev/null | grep -iE 'garden|home|php|wordpress|node|pm2|docker|apache|httpd'
            sec "failed units"; systemctl --failed --no-pager --no-legend 2>/dev/null
            sec "processes (comm only)"; ps -eo pid,user,etimes,pcpu,pmem,comm --sort=-pmem 2>/dev/null | grep -iE 'PID|node|php|pm2|nginx|docker|containerd|python|java|httpd|apache|mysql|maria' | head -40
            sec "docker ps -a"; if command -v docker >/dev/null 2>&1; then sudo -n docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1; else echo NO_DOCKER; fi
            sec "pm2 homes (no pm2 cli invoked)"; ls -d /root/.pm2 /home/*/.pm2 2>/dev/null; for d in $(sudo -n ls -d /root/.pm2 /home/*/.pm2 2>/dev/null); do sudo -n ls -la "$d/logs" 2>/dev/null | tail -10; sudo -n bash -c "tail -n 30 $d/pm2.log" 2>/dev/null | mask; done
            sec "nginx logs list"; sudo -n ls -la /var/log/nginx/ 2>/dev/null | head -40
            sec "nginx error.log: m-garden (last 60)"; sudo -n tail -n 5000 /var/log/nginx/error.log 2>/dev/null | grep -i 'm-garden' | tail -n 60
            sec "nginx error.log: last 80 lines"; sudo -n tail -n 80 /var/log/nginx/error.log 2>/dev/null
            for lf in $(sudo -n ls /var/log/nginx/ 2>/dev/null | grep -iE 'm-garden|garden|home' | grep -vE '\.gz$'); do sec "tail /var/log/nginx/$lf"; sudo -n tail -n 40 "/var/log/nginx/$lf" 2>/dev/null | cut -c1-300; done
            sec "journalctl nginx (since 10:30 today)"; sudo -n journalctl -u nginx --since "today 10:30" --no-pager 2>/dev/null | tail -n 60
            for u in $(systemctl list-units --all --no-pager --no-legend --plain 2>/dev/null | awk '{print $1}' | grep -iE 'garden|home|php|wordpress|node|pm2|apache|httpd' | grep -viE '^mindgarden'); do sec "journalctl $u (last 40)"; sudo -n journalctl -u "$u" --no-pager -n 40 2>/dev/null | mask | cut -c1-300; done
            sec "kernel OOM since yesterday"; sudo -n journalctl -k --since yesterday --no-pager 2>/dev/null | grep -iE 'oom|killed process' | tail -n 20
            sec "root/alias paths from m-garden files (ls -la, mtime)"
            for d in $(for f in $FILES; do sudo -n grep -hoE '^[[:space:]]*(root|alias)[[:space:]]+[^;]+' "$f"; done | awk '{print $2}' | sort -u); do echo "-- $d"; sudo -n ls -la --time-style=full-iso "$d" 2>&1 | head -30; done
            sec "listener pid -> cwd for upstream ports"
            for p in $PORTS; do for pid in $(sudo -n ss -ltnpH "sport = :$p" 2>/dev/null | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u); do echo "port=$p pid=$pid user=$(ps -o user= -p $pid) etime=$(ps -o etime= -p $pid | tr -d ' ') comm=$(ps -o comm= -p $pid) cwd=$(sudo -n readlink /proc/$pid/cwd)"; done; done
            sec "pm2 jlist (name/status/cwd/restarts/uptime only; only if daemon already running)"
            PJ='import sys,json,time
            try: d=json.load(sys.stdin)
            except Exception as e: print("PARSE_FAIL",e); sys.exit(0)
            for x in d:
              e=x.get("pm2_env",{}); u=e.get("pm_uptime")
              print(x.get("name"),e.get("status"),e.get("pm_cwd"),"restarts=%s"%e.get("restart_time"),"unstable=%s"%e.get("unstable_restarts"),"uptime_start=%s"%(time.strftime("%Y-%m-%d %H:%M:%S",time.localtime(u/1000)) if u else None),"pid=%s"%x.get("pid"))'
            ME=$(id -un)
            if pgrep -u "$ME" -f 'PM2 v' >/dev/null 2>&1; then echo "[user $ME]"; bash -lc 'pm2 jlist' 2>/dev/null | python3 -c "$PJ"; else echo "[user $ME] no pm2 daemon"; fi
            if sudo -n pgrep -u root -f 'PM2 v' >/dev/null 2>&1; then echo "[root]"; sudo -n bash -lc 'pm2 jlist' 2>/dev/null | python3 -c "$PJ"; else echo "[root] no pm2 daemon"; fi
            for pu in $(ps -eo user=,args= | grep 'PM2 v' | grep -v grep | awk '{print $1}' | sort -u); do echo "pm2 daemon owner: $pu"; done
            sec "ps next|node|garden|homepage (secrets masked)"
            ps -eo pid,user,etime,cmd 2>/dev/null | grep -iE 'next|node|garden|homepage' | grep -v grep | sed -E 's/((password|passwd|token|secret|key)[^=[:space:]]*[=[:space:]])[^[:space:]]+/\1***/Ig' | cut -c1-250 | head -30
            sec "find homepage / m-garden dirs (maxdepth 4)"
            sudo -n find / -maxdepth 4 \( -path /proc -o -path /sys -o -path /dev \) -prune -o \( -iname '*homepage*' -o -iname '*m-garden*' \) -print 2>/dev/null | head -40
            sec "certs from m-garden files"
            for c in $(for f in $FILES; do sudo -n grep -hoE '^[[:space:]]*ssl_certificate[[:space:]]+[^;]+' "$f"; done | awk '{print $2}' | sort -u); do echo "-- $c"; sudo -n openssl x509 -noout -subject -enddate -in "$c" 2>&1; done
            sec "homepage inquiry source grep (read-only; values never printed)"
            HP=/var/www/homepage
            maskvals() {
              sed -E \
                -e 's#(://[^:/@[:space:]]+):[^@/#[:space:]]+@#\1:***@#g' \
                -e 's/((password|passwd|pwd|token|secret|credential|api[_-]?key|private[_-]?key|DATABASE_URL|MYSQL_URL|MONGO_URL|REDIS_URL)[^=:[:space:]]*[:=][[:space:]]*["'"'"']?)[^[:space:]"'"'"']+/\1***/Ig'
            }
            echo "HP exists: $( [ -d "$HP" ] && echo YES || echo NO )"
            echo "---- $HP top"
            sudo -n ls -la --time-style=full-iso "$HP" 2>&1 | head -60
            echo "---- package.json name + db-related deps"
            if [ -f "$HP/package.json" ]; then
              sudo -n cat "$HP/package.json" 2>/dev/null | python3 -c '
            import json,sys
            try:
              p=json.load(sys.stdin)
            except Exception as e:
              print("PARSE_FAIL",e); raise SystemExit(0)
            deps={}
            keys=("mysql","prisma","sequelize","knex","drizzle","typeorm","postgres","mongo","redis","mariadb","planetscale","supabase")
            for k in ("dependencies","devDependencies"):
              for n,v in (p.get(k) or {}).items():
                nl=n.lower()
                if any(s in nl for s in keys) or nl in ("pg","mysql2","mysql"):
                  deps[k+"/"+n]=v
            print("name=", p.get("name"))
            print("deps=", deps or "NONE_DB_RELATED")
            '
            else echo "NO package.json"; fi
            echo "---- prisma/schema paths"
            sudo -n find "$HP" \( -path "*/node_modules/*" -o -path "*/.next/*" -o -path "*/.git/*" \) -prune -o \( -iname "schema.prisma" -o -path "*/prisma/*" \) -print 2>/dev/null | head -40
            echo "---- api/consultation and *consultation* paths"
            sudo -n find "$HP" \( -path "*/node_modules/*" -o -path "*/.next/*" -o -path "*/.git/*" \) -prune -o \( -ipath "*/api/consultation*" -o -ipath "*/app/api/*" -o -ipath "*/pages/api/*" -o -iname "*consultation*" \) -print 2>/dev/null | head -100
            echo "---- .env* key names only (values never printed)"
            envfiles=$(sudo -n find "$HP" -maxdepth 4 \( -path "*/node_modules/*" -o -path "*/.next/*" -o -path "*/.git/*" \) -prune -o \( -name ".env" -o -name ".env.*" \) -print 2>/dev/null)
            if [ -z "$envfiles" ]; then echo "NO_ENV_FILES"; fi
            for f in $envfiles; do
              echo "keys in $f:"
              sudo -n grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' "$f" 2>/dev/null || echo "(unreadable)"
            done
            echo "---- ecosystem name/script/cwd/port + env key names only"
            ECO="$HP/ecosystem.homepage.config.cjs"
            if [ -f "$ECO" ]; then
              sudo -n node -e '
                const c=require(process.argv[1]); const apps=(c&&c.apps)||[];
                for (const a of apps) {
                  const e=a.env||{}; const ep=a.env_production||{};
                  console.log("app name="+a.name+" script="+a.script+" cwd="+(a.cwd||"(unset)")+" port="+(e.PORT||ep.PORT||"(unset)"));
                  const keys=Object.keys(Object.assign({}, e, ep));
                  console.log("env_keys="+(keys.join(",")||"(none)"));
                }
              ' "$ECO" 2>&1
            else echo "NO_ECOSYSTEM"; fi
            echo "---- grep source DB/consultation (exclude node_modules/.next/.git/.env; values masked)"
            sudo -n grep -RIn --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude-dir=.pm2 \
              --exclude='.env' --exclude='.env.*' --exclude='*.map' --exclude='*.lock' \
              --include='*.js' --include='*.ts' --include='*.tsx' --include='*.jsx' --include='*.mjs' --include='*.cjs' --include='*.json' --include='*.prisma' --include='*.sql' \
              -E 'DB_HOST|DB_NAME|DB_USER|DB_DATABASE|DATABASE_URL|MYSQL_|maria|mysql2?|createPool|createConnection|PrismaClient|prisma\.|sequelize|consultation[_A-Za-z0-9]*|INSERT[[:space:]]+INTO|FROM[[:space:]]+[`'"'"'"]?[A-Za-z0-9_.]+|UPDATE[[:space:]]+[`'"'"'"]?[A-Za-z0-9_.]+' \
              "$HP" 2>/dev/null | maskvals | cut -c1-300 | head -200
            echo "---- /api/consultation file bodies (values masked, cap 200 lines)"
            for f in $(sudo -n find "$HP" \( -path "*/node_modules/*" -o -path "*/.next/*" -o -path "*/.git/*" \) -prune -o \( -ipath "*/api/consultation*" -o -ipath "*consultation*route*" \) -type f -print 2>/dev/null | head -20); do
              echo "===== FILE $f ====="
              sudo -n cat "$f" 2>/dev/null | maskvals | cut -c1-300 | head -200
            done
            echo "---- table/schema identifiers (unique, values masked)"
            sudo -n grep -Roh --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude='.env' --exclude='.env.*' \
              --include='*.js' --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.cjs' --include='*.prisma' --include='*.sql' \
              -E '(FROM|INTO|UPDATE|JOIN)[[:space:]]+[`'"'"'"]?[A-Za-z0-9_]+([.][A-Za-z0-9_]+)?|prisma\.[A-Za-z0-9_]+|consultation_[A-Za-z0-9_]+|[A-Za-z0-9_]*_homepage[A-Za-z0-9_]*' \
              "$HP" 2>/dev/null | sort -u | maskvals | head -80
            echo; echo "=== DONE (read-only)"
            exit 0

      - name: Mask prod schema name on runner
        env:
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        run: |
          set -euo pipefail
          if [ -n "${PRODUCTION_DB_NAME:-}" ]; then
            echo "::add-mask::$PRODUCTION_DB_NAME"
            echo "prod schema secret present: YES"
          else
            echo "prod schema secret present: NO"
          fi

      - name: Compare runtime DB_NAME (YES/NO only)
        uses: appleboy/ssh-action@master
        env:
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 2m
          envs: PRODUCTION_DB_NAME
          script: |
            set +ex
            echo "=================== runtime DB_NAME compare (values never printed)"
            report() {
              src="$1"
              val="$2"
              if [ -z "$val" ]; then
                echo "$src: present=NO match_mindgarden_homepage=NO"
                return
              fi
              if [ "$val" = "mindgarden_homepage" ]; then
                echo "$src: present=YES match_mindgarden_homepage=YES"
                return
              fi
              if [ -n "${PRODUCTION_DB_NAME:-}" ] && [ "$val" = "$PRODUCTION_DB_NAME" ]; then
                echo "$src: present=YES match_mindgarden_homepage=NO match_prod_schema=YES"
              else
                echo "$src: present=YES match_mindgarden_homepage=NO match_prod_schema=NO"
              fi
            }
            extract_dbname() {
              sudo -n awk -F= '
                $1 ~ /^[ \t]*(export[ \t]+)?DB_NAME[ \t]*$/ {
                  v=$0
                  sub(/^[^=]*=/, "", v)
                  gsub(/^[ \t\x27"]+|[ \t\x27"]+$/, "", v)
                  print v
                  exit
                }
              ' "$1" 2>/dev/null
            }
            HP=/var/www/homepage
            for f in .env .env.production .env.local .env.production.local .env.local.production; do
              path="$HP/$f"
              if sudo -n test -f "$path"; then
                val=$(extract_dbname "$path")
                report "$path" "$val"
              else
                echo "$path: FILE_ABSENT"
              fi
            done
            echo "---- pm2 process env DB_NAME (homepage only; values never printed)"
            PJ="import json,sys,os
            prod=os.environ.get('PRODUCTION_DB_NAME') or ''
            target='mindgarden_homepage'
            def report(src, val):
                if not val:
                    print('%s: present=NO match_mindgarden_homepage=NO' % src)
                    return
                if val==target:
                    print('%s: present=YES match_mindgarden_homepage=YES' % src)
                    return
                if prod and val==prod:
                    print('%s: present=YES match_mindgarden_homepage=NO match_prod_schema=YES' % src)
                else:
                    print('%s: present=YES match_mindgarden_homepage=NO match_prod_schema=NO' % src)
            try:
                d=json.load(sys.stdin)
            except Exception:
                print('pm2 jlist: PARSE_FAIL'); raise SystemExit(0)
            found=False
            for x in (d if isinstance(d,list) else []):
                if x.get('name')!='homepage':
                    continue
                found=True
                env=x.get('pm2_env') or {}
                val=env.get('DB_NAME')
                if val is None and isinstance(env.get('env'), dict):
                    val=env['env'].get('DB_NAME')
                report('pm2 process env name=homepage', val if val is not None else '')
            if not found:
                print('pm2 process env name=homepage: PROCESS_ABSENT')
            "
            GOT=0
            if sudo -n pgrep -u root -f 'PM2 v' >/dev/null 2>&1; then
              sudo -n bash -lc 'pm2 jlist' 2>/dev/null | python3 -c "$PJ" && GOT=1
            fi
            if [ "$GOT" != 1 ] && command -v pm2 >/dev/null 2>&1 && pgrep -u "$(id -un)" -f 'PM2 v' >/dev/null 2>&1; then
              bash -lc 'pm2 jlist' 2>/dev/null | python3 -c "$PJ" && GOT=1
            fi
            if [ "$GOT" != 1 ]; then
              echo "pm2 process env name=homepage: PROCESS_ABSENT_OR_UNREADABLE"
            fi
            echo "=== DONE (dbname compare, read-only)"
            exit 0
