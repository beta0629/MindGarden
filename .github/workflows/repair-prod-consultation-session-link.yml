# 운영 상담일지↔일정(consultation_id/session_number) 링크 정합
# dry-run: SELECT만 / apply: 백업 후 구조적 케이스만 consultation_id + session_number=session_sequence
# 금지: rem/used, leftover fix-mismatches, 본문(TEXT) overwrite·남편/본인 추정
# Secrets: PRODUCTION_DB_* (#990 leftover 보정과 동일). environment: production

name: 🔧 운영 상담일지 세션 링크 보정

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (조회만) | apply (구조적 링크만)'
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirm:
        description: 'apply 시 CONFIRM 입력 (그 외 모드 무시)'
        required: false
        default: ''
      client_id:
        description: 'users.id PK (권장). name은 PII 암호문이라 LIKE 불가 — 비우면 client_name 시도'
        required: false
        default: ''
      client_name:
        description: '내담자 표시명 (평문 DB에만 LIKE 유효; PII 암호문이면 client_id 사용)'
        required: true
        default: '정설아'
      session_date:
        description: '대상 상담일 (YYYY-MM-DD)'
        required: true
        default: '2026-09-10'
      slot_a_time:
        description: 'Slot A start_time (기본 11:00 = 남편 회기)'
        required: true
        default: '11:00:00'
      slot_b_time:
        description: 'Slot B start_time (기본 12:00 = 본인 회기)'
        required: true
        default: '12:00:00'

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard apply confirm
        if: github.event.inputs.mode == 'apply'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CONFIRM" ]; then
            echo "::error::apply 모드는 confirm=CONFIRM 필수"
            exit 1
          fi

      - name: Setup MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB secrets
        id: db
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-}"
          if [ -z "$HOST" ]; then
            HOST="${PRODUCTION_HOST:-}"
          fi
          USER="${PRODUCTION_DB_USER:-mindgarden}"
          NAME="${PRODUCTION_DB_NAME:-}"
          PASS="${PRODUCTION_DB_PASSWORD:-}"
          if [ -z "$HOST" ] || [ -z "$PASS" ] || [ -z "$NAME" ]; then
            echo "::error::PRODUCTION_DB_HOST(또는 PRODUCTION_HOST), PRODUCTION_DB_PASSWORD, PRODUCTION_DB_NAME 필요"
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$PASS"
          echo "password=$PASS" >> "$GITHUB_OUTPUT"
          echo "Using host=$HOST user=$USER db=$NAME (password masked)"

      - name: Build SQL preamble (inputs → session vars)
        id: preamble
        env:
          CLIENT_ID: ${{ github.event.inputs.client_id }}
          CLIENT_NAME: ${{ github.event.inputs.client_name }}
          SESSION_DATE: ${{ github.event.inputs.session_date }}
          SLOT_A: ${{ github.event.inputs.slot_a_time }}
          SLOT_B: ${{ github.event.inputs.slot_b_time }}
        run: |
          set -euo pipefail
          # SQL 문자열 리터럴용 단일따옴표 이스케이프 (하드코딩 금지 — input 만 사용)
          esc() { printf '%s' "$1" | sed "s/'/''/g"; }
          CLIENT_ESC="$(esc "$CLIENT_NAME")"
          DATE_ESC="$(esc "$SESSION_DATE")"
          SLOT_A_ESC="$(esc "$SLOT_A")"
          SLOT_B_ESC="$(esc "$SLOT_B")"
          CLIENT_ID_TRIM="$(printf '%s' "${CLIENT_ID:-}" | tr -d '[:space:]')"
          if [ -n "$CLIENT_ID_TRIM" ] && ! printf '%s' "$CLIENT_ID_TRIM" | grep -Eq '^[0-9]+$'; then
            echo "::error::client_id must be empty or a positive integer (users.id)"
            exit 1
          fi
          if [ -z "$CLIENT_ID_TRIM" ]; then
            CLIENT_ID_SQL=0
          else
            CLIENT_ID_SQL="$CLIENT_ID_TRIM"
          fi
          if ! printf '%s' "$SESSION_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::session_date must be YYYY-MM-DD"
            exit 1
          fi
          if ! printf '%s' "$SLOT_A" | grep -Eq '^[0-9]{2}:[0-9]{2}:[0-9]{2}$'; then
            echo "::error::slot_a_time must be HH:MM:SS"
            exit 1
          fi
          if ! printf '%s' "$SLOT_B" | grep -Eq '^[0-9]{2}:[0-9]{2}:[0-9]{2}$'; then
            echo "::error::slot_b_time must be HH:MM:SS"
            exit 1
          fi
          {
            echo "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci;"
            echo "SET character_set_connection = utf8mb4;"
            echo "SET collation_connection = utf8mb4_unicode_ci;"
            # @client_name 을 users.name(utf8mb4_unicode_ci) 과 동일 collation 으로 고정 (ERROR 1267 방지)
            echo "SET @client_name = CONVERT('${CLIENT_ESC}' USING utf8mb4) COLLATE utf8mb4_unicode_ci;"
            echo "SET @client_id = ${CLIENT_ID_SQL};"
            echo "SET @session_date = '${DATE_ESC}';"
            echo "SET @slot_a_time = '${SLOT_A_ESC}';"
            echo "SET @slot_b_time = '${SLOT_B_ESC}';"
          } > /tmp/consultation_session_link_preamble.sql
          echo "Preamble ready (client masked in log)"
          echo "client_id=$CLIENT_ID_SQL session_date=$SESSION_DATE slot_a=$SLOT_A slot_b=$SLOT_B"

      - name: Dry-run SELECT
        if: github.event.inputs.mode == 'dry-run'
        env:
          MYSQL_PWD: ${{ steps.db.outputs.password }}
        run: |
          set -euo pipefail
          cat /tmp/consultation_session_link_preamble.sql \
            scripts/ops/consultation_session_link_repair_dry_run.sql \
            | mysql -h "${{ steps.db.outputs.host }}" -u "${{ steps.db.outputs.user }}" \
              "${{ steps.db.outputs.name }}" --table --default-character-set=utf8mb4 \
              --init-command="SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci; SET collation_connection = utf8mb4_unicode_ci;"

      - name: Apply structural link repair
        if: github.event.inputs.mode == 'apply'
        env:
          MYSQL_PWD: ${{ steps.db.outputs.password }}
        run: |
          set -euo pipefail
          cat /tmp/consultation_session_link_preamble.sql \
            scripts/ops/consultation_session_link_repair_apply.sql \
            | mysql -h "${{ steps.db.outputs.host }}" -u "${{ steps.db.outputs.user }}" \
              "${{ steps.db.outputs.name }}" --table --default-character-set=utf8mb4 \
              --init-command="SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci; SET collation_connection = utf8mb4_unicode_ci;"

      - name: Post-apply verify SELECT
        if: github.event.inputs.mode == 'apply'
        env:
          MYSQL_PWD: ${{ steps.db.outputs.password }}
        run: |
          set -euo pipefail
          cat /tmp/consultation_session_link_preamble.sql \
            scripts/ops/consultation_session_link_repair_dry_run.sql \
            | mysql -h "${{ steps.db.outputs.host }}" -u "${{ steps.db.outputs.user }}" \
              "${{ steps.db.outputs.name }}" --table --default-character-set=utf8mb4 \
              --init-command="SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci; SET collation_connection = utf8mb4_unicode_ci;"
