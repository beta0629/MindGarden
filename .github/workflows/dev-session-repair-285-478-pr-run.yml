# DEV 검증 전용. 이 파일만 바꾸는 release/dev pull_request 에서만 돈다.
# 285,478 한 건. 프로브가 운영 목록 전값과 같으면 COMMIT 1건, 다르면 dry-run 후 ROLLBACK.
# 운영 시크릿·운영 environment 는 없다. 머지하지 않는다. 끝나면 이 PR 을 닫는다.

name: DEV 285→36 회기 보정 검증

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [release/dev]
    paths:
      - '.github/workflows/dev-session-repair-285-478-pr-run.yml'

permissions:
  contents: read

concurrency:
  group: dev-session-repair-285-478-pr-run-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dev-repair-one:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Probe then repair one DEV row
        env:
          JUMP_HOST: ${{ secrets.DEV_SERVER_HOST }}
          JUMP_USER: ${{ secrets.DEV_SERVER_USER }}
          JUMP_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DB_USER: ${{ secrets.DEV_DB_USER }}
          DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for name in JUMP_HOST JUMP_USER JUMP_KEY DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required DEV secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          case "$DB_NAME" in
            mind_garden|mind_garden_legacy_*)
              echo "::error::DEV job refuses the legacy schema name"
              exit 1
              ;;
          esac
          case "$JUMP_HOST" in
            *[!A-Za-z0-9._:-]*) echo "::error::jump host has unsupported characters"; exit 1 ;;
          esac
          case "$JUMP_USER" in
            *[!A-Za-z0-9._-]*) echo "::error::jump user has unsupported characters"; exit 1 ;;
          esac
          case "$DB_HOST" in
            *[!A-Za-z0-9._:%-]*) echo "::error::DB host has unsupported characters"; exit 1 ;;
          esac
          KEY_FILE="$(mktemp)"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$JUMP_KEY" > "$KEY_FILE"
          SOCK="$(mktemp -u)"
          LOCAL_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          cleanup() {
            ssh -i "$KEY_FILE" -S "$SOCK" -O exit "${JUMP_USER}@${JUMP_HOST}" >/dev/null 2>&1 || true
            rm -f "$KEY_FILE"
          }
          trap cleanup EXIT
          mkdir -p ~/.ssh
          ssh-keyscan -H "$JUMP_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i "$KEY_FILE" -o BatchMode=yes -o ExitOnForwardFailure=yes \
            -M -S "$SOCK" -f -N \
            -L "127.0.0.1:${LOCAL_PORT}:${DB_HOST}:3306" \
            "${JUMP_USER}@${JUMP_HOST}"
          export DB_HOST=127.0.0.1
          export DB_PORT="$LOCAL_PORT"
          unset REPAIR_CONFIRM
          chmod +x scripts/ops/additional_package_merged_session_runner.sh
          PROBE=repair-backup-285-478/probe.tsv
          mkdir -p repair-backup-285-478
          scripts/ops/additional_package_merged_session_runner.sh query \
            scripts/ops/sql/additional_package_repair_285_478_probe.sql | tee "$PROBE"
          python3 - "$PROBE" <<'PY'
          import sys
          lines = [line.rstrip("\n") for line in open(sys.argv[1], encoding="utf-8", errors="replace") if line.strip()]
          data = [line for line in lines if not line.startswith("target_mapping_id\t")]
          print("probe_data_rows=" + str(len(data)))
          ok = False
          if len(data) == 1:
              cols = data[0].split("\t")
              if len(cols) == 15:
                  (target_id, status, total, used, remaining, version,
                   schedule_id, schedule_status, sequence, schedule_mapping, schedule_version,
                   schedule_date, start_time, additional_id, additional_status) = cols
                  ok = (
                      target_id == "36" and status == "ACTIVE" and total == "40"
                      and used == "21" and remaining == "19" and version == "25"
                      and schedule_id == "478" and schedule_status == "COMPLETED"
                      and sequence == "1" and schedule_mapping == "285" and schedule_version == "2"
                      and schedule_date == "2026-09-22" and start_time.startswith("18:00:00")
                      and additional_id == "285" and additional_status == "TERMINATED"
                  )
              print("probe_row=" + data[0])
          print("DEV_SNAPSHOT_MATCH=" + ("yes" if ok else "no"))
          open("repair-backup-285-478/match.txt", "w", encoding="utf-8").write("yes\n" if ok else "no\n")
          PY
          MATCH="$(cat repair-backup-285-478/match.txt)"
          if [ "$MATCH" = "yes" ]; then
            echo "DEV snapshot matches the production list. Applying the one repair."
            export REPAIR_CONFIRM=CONFIRM
            scripts/ops/additional_package_merged_session_runner.sh repair \
              --allowlist scripts/ops/additional-package-merged-session-repair-allowlist-prod.txt \
              --expect-before scripts/ops/additional-package-merged-session-repair-expect-285-478.txt \
              --mode apply \
              --backup-dir repair-backup-285-478
          else
            echo "DEV snapshot differs. Dry-run only. ROLLBACK. No production repair will be run from this result."
            unset REPAIR_CONFIRM
            scripts/ops/additional_package_merged_session_runner.sh repair \
              --allowlist scripts/ops/additional-package-merged-session-repair-allowlist-prod.txt \
              --mode dry-run \
              --backup-dir repair-backup-285-478
          fi

      - name: Upload row backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-backup-285-478
          path: repair-backup-285-478
          if-no-files-found: warn
