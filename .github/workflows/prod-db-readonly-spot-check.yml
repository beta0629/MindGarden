# Read-only prod DB spot check — dev-doc password parity + schedule/record counts.
# Push trigger (workflow_dispatch 403 대안). Secrets: PRODUCTION_DB_* (environment: production).
name: Prod DB read-only spot check

on:
  push:
    branches: [ 'release/prod' ]
    paths:
      - 'scripts/ops/triggers/prod_db_spot_check_run.env'
  workflow_dispatch:

jobs:
  spot-check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB host
        id: db
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-}"
          if [ -z "$HOST" ]; then HOST="${PRODUCTION_HOST:-}"; fi
          USER="${PRODUCTION_DB_USER:-mindgarden}"
          NAME="${PRODUCTION_DB_NAME:-core_solution}"
          if [ -z "$HOST" ]; then
            echo "::error::PRODUCTION_DB_HOST or PRODUCTION_HOST required"
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using host=$HOST user=$USER db=$NAME"

      - name: Dev-doc password parity + read-only counts
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_USER: ${{ steps.db.outputs.user }}
          DB_NAME: ${{ steps.db.outputs.name }}
          DEV_DOC_DB_PASSWORD: MindGardenDev2025!@#
        run: |
          set -euo pipefail
          echo "=== SELECT 1 (dev-doc password on prod host) ==="
          if MYSQL_PWD="$DEV_DOC_DB_PASSWORD" mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B -e "SELECT 1;" >/dev/null 2>&1; then
            echo "CONNECT: OK"
            DB_PASS="$DEV_DOC_DB_PASSWORD"
          else
            echo "CONNECT: FAIL"
            exit 0
          fi

          runq() {
            MYSQL_PWD="$DB_PASS" mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B -e "$1"
          }

          echo "=== schedules 390/391 (client_id=47, date=2026-09-10) ==="
          runq "SELECT CONCAT('schedule_', id, '_exists=', COUNT(*)) FROM schedules WHERE id IN (390,391) AND client_id=47 AND date='2026-09-10' GROUP BY id ORDER BY id;"

          echo "=== consultation_records schedule 391 by is_deleted ==="
          runq "SELECT CONCAT('391_is_deleted_', IFNULL(is_deleted, 'NULL'), '_count=', COUNT(*)) FROM consultation_records WHERE consultation_id=391 AND client_id=47 AND session_date='2026-09-10' GROUP BY is_deleted ORDER BY is_deleted;"

          echo "=== consultation_records schedule 390 by is_deleted ==="
          runq "SELECT CONCAT('390_is_deleted_', IFNULL(is_deleted, 'NULL'), '_count=', COUNT(*)) FROM consultation_records WHERE consultation_id=390 AND client_id=47 AND session_date='2026-09-10' GROUP BY is_deleted ORDER BY is_deleted;"

          echo "=== record id=370 link (no TEXT) ==="
          runq "SELECT CONCAT('record_370: consultation_id=', IFNULL(consultation_id,'NULL'), ', client_id=', IFNULL(client_id,'NULL'), ', session_date=', IFNULL(session_date,'NULL'), ', is_deleted=', IFNULL(is_deleted,'NULL')) FROM consultation_records WHERE id=370 LIMIT 1;"
