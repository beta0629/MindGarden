<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bake hero RoomEnvironment → equirect EXR</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c" width="810" height="470"></canvas>
    <script type="module">
      /**
       * Offline bake of RoomEnvironment for mountHero3D:
       * CubeCamera capture (same near/far/clear as PMREMGenerator.fromScene)
       * → equirect Float EXR, gain-calibrated on this renderer so
       * fromEquirectangular ≈ fromScene(RoomEnvironment, 0.04) subject luma.
       */
      import * as THREE from 'three';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { EXRExporter } from 'three/addons/exporters/EXRExporter.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

      window.__bakeReady = false;
      window.__bakeError = null;
      window.__bakeMeta = null;
      window.__bakeExrB64 = null;

      try {
        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: true,
          preserveDrawingBuffer: true,
          powerPreference: 'high-performance',
        });
        renderer.setPixelRatio(1);
        renderer.setSize(405, 235, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.NeutralToneMapping;
        renderer.toneMappingExposure = 0.95;

        const CUBE_SIZE = 256;
        const EQUIRECT_W = 512;
        const EQUIRECT_H = 256;
        const SIGMA = 0.04;
        const ENV_INTENSITY = 0.9;

        // --- Shared subject for calibration (same renderer / PMREM) ---
        const subjectScene = new THREE.Scene();
        subjectScene.background = null;
        subjectScene.add(new THREE.HemisphereLight(0xfff7ee, 0xd9cfbd, 0.6));
        const key = new THREE.DirectionalLight(0xfff3e6, 1.6);
        key.position.set(-1.2, 3.4, 0.6);
        subjectScene.add(key);
        const cam = new THREE.PerspectiveCamera(30, 405 / 235, 0.1, 50);
        cam.position.set(0.12, 1.5, 1.95);
        cam.lookAt(0, 0.15, 0.06);

        const draco = new DRACOLoader().setDecoderPath(
          '/public/vendor/draco/gltf/',
        );
        const gltf = await new GLTFLoader()
          .setDRACOLoader(draco)
          .loadAsync('/public/assets/hero/hero-butterfly.glb');
        gltf.scene.traverse((obj) => {
          if (!obj.isMesh) return;
          for (const mat of [].concat(obj.material)) {
            if (typeof mat.roughness === 'number') {
              mat.roughness = Math.min(mat.roughness, 0.65);
            }
          }
        });
        subjectScene.add(gltf.scene);
        const mixer = new THREE.AnimationMixer(gltf.scene);
        const clip = THREE.AnimationClip.findByName(gltf.animations, 'WingFold');
        if (clip) {
          mixer.clipAction(clip).play();
          mixer.setTime(0);
        }

        const measureSubject = async () => {
          renderer.setClearColor(0x000000, 0);
          if (renderer.compileAsync) {
            await renderer.compileAsync(subjectScene, cam);
          }
          renderer.render(subjectScene, cam);
          renderer.render(subjectScene, cam);
          const w = canvas.width;
          const h = canvas.height;
          const c2 = document.createElement('canvas');
          c2.width = w;
          c2.height = h;
          c2.getContext('2d').drawImage(canvas, 0, 0);
          const d = c2.getContext('2d').getImageData(0, 0, w, h).data;
          let sum = 0;
          let n = 0;
          for (let i = 0; i < d.length; i += 4) {
            if (d[i + 3] < 32) continue;
            sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
            n += 1;
          }
          return n ? sum / n : 0;
        };

        // Reference: runtime-identical fromScene
        const pmremRef = new THREE.PMREMGenerator(renderer);
        const sceneEnv = pmremRef.fromScene(new RoomEnvironment(), SIGMA);
        subjectScene.environment = sceneEnv.texture;
        subjectScene.environmentIntensity = ENV_INTENSITY;
        const meanScene = await measureSubject();

        // Cube capture matching fromScene near/far/clear
        const prevTM = renderer.toneMapping;
        const prevCS = renderer.outputColorSpace;
        renderer.toneMapping = THREE.NoToneMapping;
        renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

        const room = new RoomEnvironment();
        const cubeRT = new THREE.WebGLCubeRenderTarget(CUBE_SIZE, {
          type: THREE.FloatType,
          format: THREE.RGBAFormat,
          colorSpace: THREE.LinearSRGBColorSpace,
          generateMipmaps: false,
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
        });
        const clearColor = new THREE.Color();
        renderer.getClearColor(clearColor);
        const prevBg = room.background;
        room.background = clearColor;
        const autoClear = renderer.autoClear;
        const autoClearColor = renderer.autoClearColor;
        renderer.autoClear = true;
        renderer.autoClearColor = true;
        const cubeCam = new THREE.CubeCamera(0.1, 100, cubeRT);
        cubeCam.update(renderer, room);
        renderer.autoClear = autoClear;
        renderer.autoClearColor = autoClearColor;
        room.background = prevBg;

        const equirectRT = new THREE.WebGLRenderTarget(EQUIRECT_W, EQUIRECT_H, {
          type: THREE.FloatType,
          format: THREE.RGBAFormat,
          colorSpace: THREE.LinearSRGBColorSpace,
          depthBuffer: false,
          stencilBuffer: false,
        });
        const blitScene = new THREE.Scene();
        const blitCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const blitMat = new THREE.ShaderMaterial({
          uniforms: {
            envMap: { value: cubeRT.texture },
            gain: { value: 1.0 },
          },
          vertexShader: /* glsl */ `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = vec4(position.xy, 0.0, 1.0);
            }
          `,
          fragmentShader: /* glsl */ `
            precision highp float;
            precision highp samplerCube;
            uniform samplerCube envMap;
            uniform float gain;
            varying vec2 vUv;
            const float PI = 3.141592653589793;
            void main() {
              float theta = vUv.x * PI * 2.0 - PI;
              float phi = vUv.y * PI;
              float sinPhi = sin(phi);
              vec3 dir = normalize(vec3(
                sinPhi * sin(theta),
                cos(phi),
                sinPhi * cos(theta)
              ));
              gl_FragColor = vec4(textureCube(envMap, dir).rgb * gain, 1.0);
            }
          `,
          depthTest: false,
          depthWrite: false,
        });
        blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));

        const bakeAndMeasure = async (gain) => {
          blitMat.uniforms.gain.value = gain;
          renderer.setRenderTarget(equirectRT);
          renderer.render(blitScene, blitCam);
          renderer.setRenderTarget(null);
          const pixels = new Float32Array(EQUIRECT_W * EQUIRECT_H * 4);
          renderer.readRenderTargetPixels(
            equirectRT,
            0,
            0,
            EQUIRECT_W,
            EQUIRECT_H,
            pixels,
          );
          const dataTex = new THREE.DataTexture(
            pixels,
            EQUIRECT_W,
            EQUIRECT_H,
            THREE.RGBAFormat,
            THREE.FloatType,
          );
          dataTex.mapping = THREE.EquirectangularReflectionMapping;
          dataTex.colorSpace = THREE.LinearSRGBColorSpace;
          dataTex.needsUpdate = true;
          const pm = new THREE.PMREMGenerator(renderer);
          const rt = pm.fromEquirectangular(dataTex);
          subjectScene.environment = rt.texture;
          subjectScene.environmentIntensity = ENV_INTENSITY;
          renderer.toneMapping = prevTM;
          renderer.outputColorSpace = prevCS;
          const mean = await measureSubject();
          renderer.toneMapping = THREE.NoToneMapping;
          renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
          rt.dispose();
          pm.dispose();
          dataTex.dispose();
          return mean;
        };

        const mean1 = await bakeAndMeasure(1.0);
        // Tone-mapped subject luma is nonlinear — iterate gain to match fromScene.
        let gain = 1.0;
        let meanG = mean1;
        for (let i = 0; i < 5; i += 1) {
          const step = meanScene / Math.max(meanG, 1e-3);
          gain = Math.min(4, Math.max(0.5, gain * step));
          meanG = await bakeAndMeasure(gain);
          if (Math.abs(meanG - meanScene) / meanScene < 0.02) break;
        }

        // Final export with calibrated gain
        blitMat.uniforms.gain.value = gain;
        renderer.setRenderTarget(equirectRT);
        renderer.render(blitScene, blitCam);
        renderer.setRenderTarget(null);

        const exporter = new EXRExporter();
        const exr = await exporter.parse(renderer, equirectRT, {
          type: THREE.FloatType,
        });
        const bytes = exr instanceof Uint8Array ? exr : new Uint8Array(exr);
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(
            null,
            bytes.subarray(i, Math.min(i + chunk, bytes.length)),
          );
        }
        window.__bakeExrB64 = btoa(binary);
        window.__bakeMeta = {
          format: 'exr',
          type: 'FloatType',
          method: 'cube+gain-calibrated',
          cubeSize: CUBE_SIZE,
          equirect: [EQUIRECT_W, EQUIRECT_H],
          byteLength: bytes.length,
          meanScene,
          mean1,
          gain,
          meanG,
          sigma: SIGMA,
        };
        window.__bakeReady = true;

        blitMat.dispose();
        equirectRT.dispose();
        cubeRT.dispose();
        sceneEnv.dispose();
        pmremRef.dispose();
        if (typeof room.dispose === 'function') room.dispose();
        draco.dispose();
        renderer.dispose();
      } catch (err) {
        window.__bakeError = String(err && err.stack ? err.stack : err);
      }
    </script>
  </body>
</html>
