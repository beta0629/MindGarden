# Core JVM proxy params — CF520(Host Error) 재발 방지용 공통 프록시 지시어.
# 운영 실경로: /etc/nginx/snippets/mindgarden-core-proxy-params.conf
# vhost(core-solution-prod.conf) 는 include /etc/nginx/snippets/mindgarden-core-proxy-params.conf;
# Cloudflare 프록시 타임아웃(~100s)보다 짧은 nginx read/send(60s)·connect(10s)로
# origin hang 시 blank CF520 대신 nginx 502/504 를 반환한다.
# keepalive: upstream 의 keepalive 와 함께 Connection "" (빈 문자열) 필수.
# 문서: docs/runbooks/CF520_ORIGIN_HOST_ERROR_PREVENTION.md
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $server_name;
proxy_set_header Connection "";
proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
