# 상담일지 본문 암호화 전환 현황 — 읽기 전용 COUNT 집계
#
# 목적: consultation_records 본문 19개 컬럼과 consultation_record_drafts.payload_json 이
#       평문 / v1(고정 IV) / v2(랜덤 IV) 중 어느 형식인지 "건수만" 집계한다.
#
# 안전 장치 (설계 의도):
#   - SELECT COUNT(*) 만 실행한다. SQL 은 이 파일에 고정되어 있고 입력으로 바꿀 수 없다.
#   - 본문 값·암호문·복호화 결과를 출력하지 않는다. 출력은 테이블·컬럼명과 정수 건수뿐이다.
#   - mysql 세션을 read only 로 고정하고(--init-command), 가능하면 읽기 전용 DB 계정을 쓴다.
#   - UPDATE/DELETE/백필은 이 워크플로의 범위가 아니다 (별도 PR·사용자 승인 후).
#
# 운영 대상 실행은 사람이 명시적으로 dispatch 해야 한다 (자동 트리거 없음).
name: 상담일지 본문 암호화 COUNT (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      target:
        description: '집계 대상 DB'
        type: choice
        options:
          - dev
          - production
        default: dev

jobs:
  count:
    runs-on: ubuntu-latest
    # environment 를 동적으로 비울 수 없어(빈 문자열 검증 실패) 지정하지 않는다.
    # 운영 집계는 자동 트리거가 없고 사람이 target=production 으로 직접 dispatch 해야 한다.
    steps:
      - name: MySQL 클라이언트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: 접속 정보 해석 (값 출력 금지)
        id: db
        env:
          TARGET: ${{ inputs.target }}
          DEV_DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DEV_DB_USER: ${{ secrets.DEV_DB_USER }}
          DEV_DB_NAME: ${{ secrets.DEV_DB_NAME }}
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            HOST="${PRODUCTION_DB_HOST:-}"; USER="${PRODUCTION_DB_USER:-}"; NAME="${PRODUCTION_DB_NAME:-}"
          else
            HOST="${DEV_DB_HOST:-}"; USER="${DEV_DB_USER:-}"; NAME="${DEV_DB_NAME:-}"
          fi
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$NAME" ]; then
            echo "::error title=DB 접속 정보 누락::${TARGET} 대상 DB_HOST/DB_USER/DB_NAME secret 을 확인하세요."
            exit 1
          fi
          # 값은 출력하지 않고 설정됨 여부만 남긴다.
          echo "host_set=yes db_set=yes user_set=yes target=$TARGET"
          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"

      - name: 형식별 건수 집계 (SELECT COUNT 전용)
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_USER: ${{ steps.db.outputs.user }}
          DB_NAME: ${{ steps.db.outputs.name }}
          DB_PASSWORD: ${{ inputs.target == 'production' && secrets.PRODUCTION_DB_PASSWORD || secrets.DEV_DB_PASSWORD }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          # 본문 암호화 대상 컬럼 (ConsultationRecord 의 @Convert(ConsultationBodyAttributeConverter) 19건)
          COLUMNS="client_condition main_issues intervention_methods client_response next_session_plan \
            homework_assigned risk_factors emergency_response_plan progress_evaluation \
            goal_achievement_details consultant_observations consultant_assessment \
            special_considerations medical_information medication_info family_relationships \
            social_support environmental_factors follow_up_actions"

          # 형식 판별 (값은 쓰지 않고 접두 패턴만 본다)
          #   v2  : '{keyId}:v2::{base64}'  → ':v2::' 포함
          #   v1  : '{keyId}::{base64}'     → '::' 포함, v2 아님
          #   평문: 위 어느 마커도 없음
          V2_PRED="col REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::'"
          V1_PRED="col REGEXP '^[A-Za-z0-9_.-]{1,32}::' AND NOT (col REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::')"

          SQL_FILE=$(mktemp)
          {
            echo "SELECT 'table' AS scope, 'column' AS col_name, 'plain' AS fmt, 0 AS cnt WHERE 1=0;"
            for c in $COLUMNS; do
              printf "SELECT 'consultation_records' AS scope, '%s' AS col_name, 'v2' AS fmt, COUNT(*) AS cnt FROM consultation_records WHERE %s IS NOT NULL AND %s <> '' AND %s;\n" \
                "$c" "$c" "$c" "$(echo "$V2_PRED" | sed "s/col/$c/g")"
              printf "SELECT 'consultation_records' AS scope, '%s' AS col_name, 'v1' AS fmt, COUNT(*) AS cnt FROM consultation_records WHERE %s IS NOT NULL AND %s <> '' AND (%s);\n" \
                "$c" "$c" "$c" "$(echo "$V1_PRED" | sed "s/col/$c/g")"
              printf "SELECT 'consultation_records' AS scope, '%s' AS col_name, 'plain' AS fmt, COUNT(*) AS cnt FROM consultation_records WHERE %s IS NOT NULL AND %s <> '' AND NOT (%s) AND NOT (%s);\n" \
                "$c" "$c" "$c" "$(echo "$V2_PRED" | sed "s/col/$c/g")" "$(echo "$V1_PRED" | sed "s/col/$c/g")"
            done
            printf "SELECT 'consultation_record_drafts' AS scope, 'payload_json' AS col_name, 'v2' AS fmt, COUNT(*) AS cnt FROM consultation_record_drafts WHERE payload_json IS NOT NULL AND payload_json <> '' AND %s;\n" \
              "$(echo "$V2_PRED" | sed 's/col/payload_json/g')"
            printf "SELECT 'consultation_record_drafts' AS scope, 'payload_json' AS col_name, 'v1' AS fmt, COUNT(*) AS cnt FROM consultation_record_drafts WHERE payload_json IS NOT NULL AND payload_json <> '' AND (%s);\n" \
              "$(echo "$V1_PRED" | sed 's/col/payload_json/g')"
            printf "SELECT 'consultation_record_drafts' AS scope, 'payload_json' AS col_name, 'plain' AS fmt, COUNT(*) AS cnt FROM consultation_record_drafts WHERE payload_json IS NOT NULL AND payload_json <> '' AND NOT (%s) AND NOT (%s);\n" \
              "$(echo "$V2_PRED" | sed 's/col/payload_json/g')" "$(echo "$V1_PRED" | sed 's/col/payload_json/g')"
          } > "$SQL_FILE"

          # 고정 SQL 가드 — SELECT 외 구문이 섞이면 실행하지 않는다.
          if grep -qiE '^[[:space:]]*(insert|update|delete|drop|alter|truncate|create|replace|grant|set)[[:space:]]' "$SQL_FILE"; then
            echo "::error title=SELECT 전용 위반::생성된 SQL 에 쓰기 구문이 있어 중단합니다."
            exit 1
          fi

          echo "=== ${TARGET} 상담일지 본문 형식별 건수 (값 미출력) ==="
          MYSQL_PWD="$DB_PASSWORD" mysql \
            --init-command="SET SESSION TRANSACTION READ ONLY" \
            -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
            --batch --raw < "$SQL_FILE" | awk 'NF && $4 != 0'

          rm -f "$SQL_FILE"
          echo "=== 끝 — 건수만 출력, 본문·암호문 미출력 ==="
