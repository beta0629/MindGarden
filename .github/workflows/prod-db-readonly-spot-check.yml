# Read-only prod DB spot check — schedule/record counts.
# Push trigger (workflow_dispatch 403 대안).
# Secrets: PRODUCTION_DB_HOST(또는 PRODUCTION_HOST), PRODUCTION_DB_USER, PRODUCTION_DB_NAME, PRODUCTION_DB_PASSWORD.
# 자격증명은 GitHub Secret 만 사용 — 워크플로·스크립트에 비밀번호/호스트 기본값 하드코딩 금지.
#
# SSOT 2026-09-22: Asia/Seoul 11:00–20:00 예방성 prod DB spot check 금지.
#   KST 11–19 inclusive → exit 0 skip (push/dispatch). force_incident=true 만 명시 장애 시 우회.
name: Prod DB read-only spot check

on:
  push:
    branches: [ 'release/prod' ]
    paths:
      - 'scripts/ops/triggers/prod_db_spot_check_run.env'
  workflow_dispatch:
    inputs:
      force_incident:
        description: 'KST 11–19 주간 스킵 가드 우회 (명시적 장애 대응만)'
        type: boolean
        default: false

jobs:
  spot-check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # SSOT 2026-09-22: KST 11–19 inclusive → exit 0 skip unless force_incident=true
      - name: KST 주간 예방점검 가드 (11–19 skip)
        id: kst_guard
        env:
          FORCE_INCIDENT: ${{ inputs.force_incident || false }}
        run: |
          set -euo pipefail
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul hour=${HOUR} force_incident=${FORCE_INCIDENT}"
          if [ "${FORCE_INCIDENT}" = "true" ]; then
            echo "force_incident=true — daytime preventive skip bypassed (explicit outage)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST ${HOUR}:00 is in 11–19 (preventive ops forbidden until 20:00 KST). Skipping (exit 0)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Outside KST 11–19 forbidden window — continuing"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.kst_guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup MySQL client
        if: steps.kst_guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB host
        if: steps.kst_guard.outputs.skip != 'true'
        id: db
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-}"
          if [ -z "$HOST" ]; then HOST="${PRODUCTION_HOST:-}"; fi
          USER="${PRODUCTION_DB_USER:-}"
          NAME="${PRODUCTION_DB_NAME:-}"
          MISSING=""
          [ -n "$HOST" ] || MISSING="$MISSING PRODUCTION_DB_HOST|PRODUCTION_HOST"
          [ -n "$USER" ] || MISSING="$MISSING PRODUCTION_DB_USER"
          [ -n "$NAME" ] || MISSING="$MISSING PRODUCTION_DB_NAME"
          if [ -n "$MISSING" ]; then
            echo "::error::Required secrets missing:$MISSING"
            exit 1
          fi
          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"
          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "DB target resolved (host/user masked) db=$NAME"

      - name: Read-only counts
        if: steps.kst_guard.outputs.skip != 'true'
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_USER: ${{ steps.db.outputs.user }}
          DB_NAME: ${{ steps.db.outputs.name }}
          MYSQL_PWD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MYSQL_PWD:-}" ]; then
            echo "::error::secrets.PRODUCTION_DB_PASSWORD is not set"
            exit 1
          fi
          echo "=== SELECT 1 ==="
          if mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B -e "SELECT 1;" >/dev/null 2>&1; then
            echo "CONNECT: OK"
          else
            echo "::error::CONNECT: FAIL"
            exit 1
          fi

          runq() {
            mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B -e "$1"
          }

          echo "=== schedules 390/391 (client_id=47, date=2026-09-10) ==="
          runq "SELECT CONCAT('schedule_', id, '_exists=', COUNT(*)) FROM schedules WHERE id IN (390,391) AND client_id=47 AND date='2026-09-10' GROUP BY id ORDER BY id;"

          echo "=== consultation_records schedule 391 by is_deleted ==="
          runq "SELECT CONCAT('391_is_deleted_', IFNULL(is_deleted, 'NULL'), '_count=', COUNT(*)) FROM consultation_records WHERE consultation_id=391 AND client_id=47 AND session_date='2026-09-10' GROUP BY is_deleted ORDER BY is_deleted;"

          echo "=== consultation_records schedule 390 by is_deleted ==="
          runq "SELECT CONCAT('390_is_deleted_', IFNULL(is_deleted, 'NULL'), '_count=', COUNT(*)) FROM consultation_records WHERE consultation_id=390 AND client_id=47 AND session_date='2026-09-10' GROUP BY is_deleted ORDER BY is_deleted;"

          echo "=== record id=370 link (no TEXT) ==="
          runq "SELECT CONCAT('record_370: consultation_id=', IFNULL(consultation_id,'NULL'), ', client_id=', IFNULL(client_id,'NULL'), ', session_date=', IFNULL(session_date,'NULL'), ', is_deleted=', IFNULL(is_deleted,'NULL')) FROM consultation_records WHERE id=370 LIMIT 1;"
