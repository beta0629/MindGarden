# 추가 패키지 병합 회기 보정.
# 대상 쌍은 커밋된 allowlist 파일만 사용한다. workflow_dispatch 입력으로 id 를 받지 않는다.
# 파일이 비어 있으면 DB 에 접속하지 않는다.
# dry-run 이 기본이다. COMMIT 은 트리거 파일 MODE=apply 와 CONFIRM=CONFIRM 일 때만.
# 운영 잡은 KST 11–19 에 스킵한다. financial_transactions 는 수정하지 않는다.
#
# pull_request 트리거는 두지 않는다. 이 draft PR 을 열 때 보정이 돌면 안 된다.
# main 과 release/prod 는 이 PR 에서 갱신하지 않는다.
# 나중에 운영에서 돌리려면 release/prod 에 트리거 파일 또는 허용 목록을 푸시하거나,
# 워크플로 파일이 기본 브랜치에 있는 뒤 workflow_dispatch 한다.

name: 추가 패키지 병합 회기 보정 (dry-run 기본)

on:
  push:
    branches: ['release/prod']
    paths:
      - 'scripts/ops/triggers/additional_package_merged_session_repair.env'
      - 'scripts/ops/additional-package-merged-session-repair-allowlist-prod.txt'
  workflow_dispatch:
    inputs:
      force_incident:
        description: 'KST 11–19 주간 스킵 가드 우회 (명시적 장애 대응만)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: additional-package-merged-session-repair
  cancel-in-progress: false

jobs:
  prod-repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: KST 주간 예방점검 가드 (11–19 skip)
        id: kst_guard
        env:
          FORCE_INCIDENT: ${{ inputs.force_incident || false }}
        run: |
          set -euo pipefail
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul hour=${HOUR} force_incident=${FORCE_INCIDENT}"
          if [ "${FORCE_INCIDENT}" = "true" ]; then
            echo "force_incident=true — daytime preventive skip bypassed (explicit outage)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST ${HOUR}:00 is in 11–19 (preventive ops forbidden until 20:00 KST). Skipping (exit 0)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Outside KST 11–19 forbidden window — continuing"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.kst_guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Load prod trigger and allowlist
        id: gate
        if: steps.kst_guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          F=scripts/ops/triggers/additional_package_merged_session_repair.env
          A=scripts/ops/additional-package-merged-session-repair-allowlist-prod.txt
          test -f "$F"
          test -f "$A"
          get_kv() {
            local key="$1"
            local line
            line="$(grep -E "^${key}=" "$F" | tail -n 1 || true)"
            printf '%s' "${line#*=}" | sed -e "s/^['\"]//" -e "s/['\"]$//"
          }
          MODE="$(get_kv MODE)"
          CONFIRM="$(get_kv CONFIRM)"
          MODE="${MODE:-dry-run}"
          if [ "$MODE" != "dry-run" ] && [ "$MODE" != "apply" ]; then
            echo "::error::MODE must be dry-run or apply"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "CONFIRM" ]; then
            echo "::error::apply requires CONFIRM=CONFIRM in the trigger file"
            exit 1
          fi
          DATA="$(grep -E '^[0-9]+,[0-9]+[[:space:]]*$' "$A" || true)"
          if [ -z "$DATA" ]; then
            echo "허용 목록이 비어 있어 보정은 수행하지 않습니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$CONFIRM" = "CONFIRM" ]; then
            echo "confirm=CONFIRM" >> "$GITHUB_OUTPUT"
          else
            echo "confirm=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup MySQL client
        if: steps.kst_guard.outputs.skip != 'true' && steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Repair transaction
        id: repair
        if: steps.kst_guard.outputs.skip != 'true' && steps.gate.outputs.skip != 'true'
        env:
          DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          DB_HOST_FALLBACK: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          REPAIR_CONFIRM: ${{ steps.gate.outputs.confirm }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST:-}" ]; then DB_HOST="${DB_HOST_FALLBACK:-}"; fi
          for name in DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production DB secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          export DB_HOST DB_USER DB_NAME DB_PASSWORD REPAIR_CONFIRM
          chmod +x scripts/ops/additional_package_merged_session_runner.sh
          scripts/ops/additional_package_merged_session_runner.sh repair \
            --allowlist scripts/ops/additional-package-merged-session-repair-allowlist-prod.txt \
            --mode "${{ steps.gate.outputs.mode }}" \
            --backup-dir "${RUNNER_TEMP}/additional-package-session-backup"

      - name: Upload backup artifact
        if: steps.kst_guard.outputs.skip != 'true' && steps.gate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: additional-package-session-backup-prod-${{ github.run_id }}
          path: ${{ runner.temp }}/additional-package-session-backup
          if-no-files-found: ignore

  dev-repair:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load DEV trigger
        id: gate
        run: |
          set -euo pipefail
          F=scripts/ops/triggers/additional_package_merged_session_repair_dev.env
          test -f "$F"
          get_kv() {
            local key="$1"
            local line
            line="$(grep -E "^${key}=" "$F" | tail -n 1 || true)"
            printf '%s' "${line#*=}" | sed -e "s/^['\"]//" -e "s/['\"]$//"
          }
          MODE="$(get_kv MODE)"
          CONFIRM="$(get_kv CONFIRM)"
          MODE="${MODE:-dry-run}"
          if [ "$MODE" != "dry-run" ] && [ "$MODE" != "apply" ]; then
            echo "::error::MODE must be dry-run or apply"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "CONFIRM" ]; then
            echo "::error::apply requires CONFIRM=CONFIRM in the DEV trigger file"
            exit 1
          fi
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          if [ "$MODE" = "apply" ] && [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST ${HOUR}:00 is in 11–19. DEV apply is skipped until 20:00 KST."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$CONFIRM" = "CONFIRM" ]; then
            echo "confirm=CONFIRM" >> "$GITHUB_OUTPUT"
          else
            echo "confirm=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup MySQL client
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Repair transaction on DEV
        if: steps.gate.outputs.skip != 'true'
        env:
          JUMP_HOST: ${{ secrets.DEV_SERVER_HOST }}
          JUMP_USER: ${{ secrets.DEV_SERVER_USER }}
          JUMP_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DB_USER: ${{ secrets.DEV_DB_USER }}
          DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          REPAIR_CONFIRM: ${{ steps.gate.outputs.confirm }}
        run: |
          set -euo pipefail
          for name in JUMP_HOST JUMP_USER JUMP_KEY DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required DEV secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          case "$DB_NAME" in
            mind_garden|mind_garden_legacy_*)
              echo "::error::DEV job refuses the legacy schema name"
              exit 1
              ;;
          esac
          case "$JUMP_HOST" in
            *[!A-Za-z0-9._:-]*) echo "::error::jump host has unsupported characters"; exit 1 ;;
          esac
          case "$JUMP_USER" in
            *[!A-Za-z0-9._-]*) echo "::error::jump user has unsupported characters"; exit 1 ;;
          esac
          case "$DB_HOST" in
            *[!A-Za-z0-9._:%-]*) echo "::error::DB host has unsupported characters"; exit 1 ;;
          esac
          KEY_FILE="$(mktemp)"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$JUMP_KEY" > "$KEY_FILE"
          SOCK="$(mktemp -u)"
          LOCAL_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          cleanup() {
            ssh -i "$KEY_FILE" -S "$SOCK" -O exit "${JUMP_USER}@${JUMP_HOST}" >/dev/null 2>&1 || true
            rm -f "$KEY_FILE"
          }
          trap cleanup EXIT
          mkdir -p ~/.ssh
          ssh-keyscan -H "$JUMP_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i "$KEY_FILE" -o BatchMode=yes -o ExitOnForwardFailure=yes \
            -M -S "$SOCK" -f -N \
            -L "127.0.0.1:${LOCAL_PORT}:${DB_HOST}:3306" \
            "${JUMP_USER}@${JUMP_HOST}"
          export DB_HOST=127.0.0.1
          export DB_PORT="$LOCAL_PORT"
          export REPAIR_CONFIRM
          chmod +x scripts/ops/additional_package_merged_session_runner.sh
          scripts/ops/additional_package_merged_session_runner.sh repair \
            --allowlist scripts/ops/additional-package-merged-session-repair-allowlist-dev.txt \
            --mode "${{ steps.gate.outputs.mode }}" \
            --backup-dir "${RUNNER_TEMP}/additional-package-session-backup"

      - name: Upload backup artifact
        if: steps.gate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: additional-package-session-backup-dev-${{ github.run_id }}
          path: ${{ runner.temp }}/additional-package-session-backup
          if-no-files-found: ignore
