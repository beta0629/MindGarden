# Prod DB read-only PROCESSLIST — SHOW FULL PROCESSLIST + bounded information_schema.
# workflow_dispatch only. No KILL / DDL / DML. Separated from deploy-production.yml.
# Secrets: PRODUCTION_DB_* (environment: production). Prefer PRODUCTION_DB_PASSWORD (no hardcoded passwords).
name: Prod DB read-only PROCESSLIST

on:
  workflow_dispatch:

jobs:
  processlist:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB host
        id: db
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-}"
          if [ -z "$HOST" ]; then HOST="${PRODUCTION_HOST:-}"; fi
          USER="${PRODUCTION_DB_USER:-mindgarden}"
          NAME="${PRODUCTION_DB_NAME:-core_solution}"
          if [ -z "$HOST" ]; then
            echo "::error::PRODUCTION_DB_HOST or PRODUCTION_HOST required"
            exit 1
          fi
          if [ -z "${PRODUCTION_DB_PASSWORD:-}" ]; then
            echo "::error::PRODUCTION_DB_PASSWORD required (no hardcoded fallback)"
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using host=$HOST user=$USER db=$NAME"

      - name: Capture PROCESSLIST (read-only)
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_USER: ${{ steps.db.outputs.user }}
          DB_NAME: ${{ steps.db.outputs.name }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PROCESSLIST_LIMIT: "200"
        run: |
          set -euo pipefail
          chmod +x scripts/ops/prod-show-full-processlist.sh
          bash scripts/ops/prod-show-full-processlist.sh
