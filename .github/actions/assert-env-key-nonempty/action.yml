name: 'Assert env key non-empty'
description: '서버 env 파일의 지정 키 값이 비어 있으면 ::error 후 배포 실패 (재시작 전 가드, 값 미노출·길이만 출력)'

# ============================================================================
# 서비스 재시작 전에 호출한다. sync step 이 secret 누락으로 skip 되더라도
# env 파일에 값이 없으면(키 없음·빈 값·공백만) 여기서 배포를 멈춰
# 빈 값으로 재시작되는 서버가 없도록 한다.
# 출력은 길이만 — 값 echo·set -x 금지.
# ============================================================================

inputs:
  step_name:
    description: '로그용 step 이름'
    required: true
  key:
    description: '검사할 env 키 (단일)'
    required: true
  env_path:
    description: '서버 env 파일 경로'
    required: true
  ssh_host:
    description: 'SSH host'
    required: true
  ssh_user:
    description: 'SSH user'
    required: true
  ssh_key:
    description: 'SSH private key'
    required: true

runs:
  using: composite
  steps:
    - name: 🛑 env 키 빈 값 가드
      uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master 2026-08-16 (v1.2.5+10) 고정
      env:
        GUARD_STEP_NAME: ${{ inputs.step_name }}
        GUARD_KEY: ${{ inputs.key }}
        GUARD_ENV_FILE: ${{ inputs.env_path }}
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_user }}
        key: ${{ inputs.ssh_key }}
        port: 22
        timeout: 60s
        command_timeout: 5m
        envs: GUARD_STEP_NAME,GUARD_KEY,GUARD_ENV_FILE
        script: |
          _line=$(sudo grep -E "^[[:space:]]*${GUARD_KEY}=" "$GUARD_ENV_FILE" 2>/dev/null | tail -n1 || true)
          _val=$(printf '%s' "$_line" | sed -n 's/^[^=]*=//p' | sed -E 's/^"(.*)"$/\1/' | sed -E "s/^'(.*)'$/\1/" | tr -d '\r')
          _len=${#_val}
          _trimmed=$(printf '%s' "$_val" | tr -d '[:space:]')
          unset _line _val
          echo "🔎 ${GUARD_STEP_NAME}: ${GUARD_KEY} in ${GUARD_ENV_FILE} — length=${_len}"
          if [ -z "$_trimmed" ]; then
            echo "::error title=${GUARD_KEY} 빈 값::${GUARD_ENV_FILE} 의 ${GUARD_KEY} 가 없거나 비어 있습니다 (length=${_len}). 빈 값으로 재시작하지 않도록 배포를 중단합니다. GitHub Secret ${GUARD_KEY} 등록 후 재실행하세요."
            exit 1
          fi
          echo "✅ ${GUARD_KEY} 값 존재 — 재시작 진행"
