# SCT online draft/submit status — production (순수 읽기 전용)
# 트리거: workflow_dispatch 전용. push/PR/schedule 트리거 없음. 배포 워크플로 호출 없음. SSH 없음.
# DB: scripts/ops/readonly/prod_sct_draft_status.sql 를 READ ONLY 세션으로 실행 (SELECT 만).
#     tenant_id / target_date 는 검증 후 __TENANT_ID__ / __TARGET_DATE__ 치환.
#     쓰기·heal·재시작·설정 변경·DDL·프로시저 호출 금지.
# PII 금지: 답변 본문(answer_text_enc)·이름·전화·이메일·생년월일·토큰 해시·respondent_meta_json 미선택.
#     초대 id·상태·draft 존재·저장 문항 수·저장/제출 시각만.
# confirm_readonly=true 필수 (SELECT-only 명시 확인). force_incident=true 만 KST 11–19 스킵 우회.
# Secrets: PRODUCTION_DB_HOST|PRODUCTION_HOST, PRODUCTION_DB_USER, PRODUCTION_DB_NAME, PRODUCTION_DB_PASSWORD.
# SSOT 2026-09-22: KST 11–19 예방성 prod DB 점검 금지 → force_incident=true(명시 장애) 일 때만 주간 실행.
# 패턴: #1949 check-prod-mapping-erp-readonly.yml 과 동일 (READ ONLY 세션·키워드 가드·tenant 검증).
name: 🔎 Check prod SCT draft status (read-only)

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: '테넌트 id (안전한 charset만). 기본 tenant-incheon-counseling-001'
        required: false
        type: string
        default: 'tenant-incheon-counseling-001'
      target_date:
        description: '조회일 yyyy-MM-dd (KST). 비우면 오늘(Asia/Seoul)'
        required: false
        type: string
        default: ''
      confirm_readonly:
        description: 'SELECT only — 읽기 전용 확인 (반드시 true)'
        type: boolean
        default: false
      force_incident:
        description: 'KST 11–19 주간 스킵 가드 우회 (명시적 장애 대응만)'
        type: boolean
        default: false

concurrency:
  group: check-prod-sct-draft-readonly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  db-readonly:
    name: prod DB read-only SCT draft status
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Validate inputs + KST guard
        id: guard
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          TARGET_DATE: ${{ inputs.target_date }}
          CONFIRM_READONLY: ${{ inputs.confirm_readonly }}
          FORCE_INCIDENT: ${{ inputs.force_incident }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM_READONLY}" != "true" ]; then
            echo "::error::confirm_readonly must be true (explicit SELECT-only acknowledgement)"
            exit 1
          fi
          TENANT_ID="$(echo -n "${TENANT_ID:-}" | tr -d '[:space:]')"
          TARGET_DATE="$(echo -n "${TARGET_DATE:-}" | tr -d '[:space:]')"
          if [ -z "$TENANT_ID" ]; then
            echo "::error::tenant_id is required (empty rejected)"
            exit 1
          fi
          # Safe charset only — single quotes rejected so SQL string literal substitution is safe.
          [[ "$TENANT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "::error::invalid tenant_id (allowed: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$)"
            exit 1
          }
          if [ -z "$TARGET_DATE" ]; then TARGET_DATE="$(TZ=Asia/Seoul date +%F)"; fi
          [[ "$TARGET_DATE" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]] || {
            echo "::error::invalid target_date (yyyy-MM-dd required)"
            exit 1
          }
          date -d "$TARGET_DATE" +%F >/dev/null 2>&1 || {
            echo "::error::target_date is not a valid calendar date"
            exit 1
          }
          HOUR=$((10#$(TZ=Asia/Seoul date +%H)))
          echo "Asia/Seoul hour=${HOUR} force_incident=${FORCE_INCIDENT} tenant_id=${TENANT_ID} target_date=${TARGET_DATE}"
          if [ "${FORCE_INCIDENT}" != "true" ] && [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST 11–19 preventive window — skip (exit 0)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "tenant_id=$TENANT_ID"
            echo "target_date=$TARGET_DATE"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Guard SQL is read-only
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          F=scripts/ops/readonly/prod_sct_draft_status.sql
          if grep -v '^[[:space:]]*--' "$F" | grep -wiE 'INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE|GRANT|REVOKE|RENAME|LOAD|CALL|HANDLER|LOCK|SET'; then
            echo "::error::write/DDL keyword found in read-only SQL"
            exit 1
          fi
          echo "read-only keyword guard: PASS"

      - name: Setup MySQL client
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB host
        if: steps.guard.outputs.skip != 'true'
        id: db
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-}"
          if [ -z "$HOST" ]; then HOST="${PRODUCTION_HOST:-}"; fi
          USER="${PRODUCTION_DB_USER:-}"
          NAME="${PRODUCTION_DB_NAME:-}"
          MISSING=""
          [ -n "$HOST" ] || MISSING="$MISSING PRODUCTION_DB_HOST|PRODUCTION_HOST"
          [ -n "$USER" ] || MISSING="$MISSING PRODUCTION_DB_USER"
          [ -n "$NAME" ] || MISSING="$MISSING PRODUCTION_DB_NAME"
          if [ -n "$MISSING" ]; then
            echo "::error::Required secrets missing:$MISSING"
            exit 1
          fi
          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"
          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "DB target resolved (host/user masked) db=$NAME"

      - name: Run read-only SCT draft status
        if: steps.guard.outputs.skip != 'true'
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_USER: ${{ steps.db.outputs.user }}
          DB_NAME: ${{ steps.db.outputs.name }}
          MYSQL_PWD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          TENANT_ID: ${{ steps.guard.outputs.tenant_id }}
          TARGET_DATE: ${{ steps.guard.outputs.target_date }}
        run: |
          set -euo pipefail
          TENANT_ID="$(echo -n "${TENANT_ID:-}" | tr -d '[:space:]')"
          TARGET_DATE="$(echo -n "${TARGET_DATE:-}" | tr -d '[:space:]')"
          if [ -z "$TENANT_ID" ]; then
            echo "::error::tenant_id is required (empty rejected)"
            exit 1
          fi
          [[ "$TENANT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "::error::invalid tenant_id (allowed: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$)"
            exit 1
          }
          [[ "$TARGET_DATE" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]] || {
            echo "::error::invalid target_date (yyyy-MM-dd required)"
            exit 1
          }
          date -d "$TARGET_DATE" +%F >/dev/null 2>&1 || {
            echo "::error::target_date is not a valid calendar date"
            exit 1
          }
          if [ -z "${MYSQL_PWD:-}" ]; then
            echo "::error::secrets.PRODUCTION_DB_PASSWORD is not set"
            exit 1
          fi
          echo "::add-mask::$DB_HOST"
          echo "::add-mask::$DB_USER"
          echo "=== SELECT 1 ==="
          if mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
            --init-command="SET SESSION TRANSACTION READ ONLY" \
            --default-character-set=utf8mb4 -N -B -e "SELECT 1;" >/dev/null 2>&1; then
            echo "CONNECT: OK"
          else
            echo "::error::CONNECT: FAIL"
            exit 1
          fi
          # READ ONLY 는 세션 init-command. SQL 파일에는 SET 키워드 없음(가드 통과).
          sed -e "s/__TENANT_ID__/${TENANT_ID}/g" \
              -e "s/__TARGET_DATE__/${TARGET_DATE}/g" \
              scripts/ops/readonly/prod_sct_draft_status.sql > /tmp/sct_draft_status.sql
          if grep -Fqo '__TENANT_ID__' /tmp/sct_draft_status.sql \
             || grep -Fqo '__TARGET_DATE__' /tmp/sct_draft_status.sql; then
            echo "::error::placeholder substitution failed"
            exit 1
          fi
          OUT=/tmp/sct_draft_status.out
          mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
            --init-command="SET SESSION TRANSACTION READ ONLY" \
            --default-character-set=utf8mb4 -t \
            < /tmp/sct_draft_status.sql \
            > "$OUT" 2>&1 || {
              echo "::error::read-only query failed"
              sed -E -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g' "$OUT" | head -20
              exit 1
            }
          if [ ! -s "$OUT" ]; then
            echo "::error::query output empty"
            exit 1
          fi
          if ! grep -qE '==[[:space:]]*[0-9]' "$OUT"; then
            echo "::error::query output missing section labels"
            exit 1
          fi
          sed -E \
            -e 's/(01[016789])[- ]?[0-9]{3,4}[- ]?([0-9]{4})/\1-****-\2/g' \
            -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g' \
            "$OUT" | tee /tmp/sct_draft_status.masked
          {
            echo "## SCT draft status (read-only) tenant_id=${TENANT_ID} target_date=${TARGET_DATE}"
            echo
            echo '```'
            cat /tmp/sct_draft_status.masked
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
