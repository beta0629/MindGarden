name: 🛡️ Guardrails (PR)

# 반복 실수 유형을 PR 단계에서 자동 FAIL 시킨다. 기존 위반은 래칫 베이스라인(줄어들기만)으로 통과시키고 신규만 막는다.
#   1) 관리자 API 역할 가드 누락     — AdminApiGuardCoverageTest (+ 대표 403 매트릭스 AdminApiRoleMatrixGuardrailMvcTest)
#   2) 프로시저 호출 ↔ 표준 배포 SQL — ProcedureSignatureGuardrailTest
#   3) 비밀값 커밋                   — gitleaks(PR 새 커밋만) + ApplicationYmlSecretDefaultsTest
#   4) FE 관리자 목록 전체 조회·page/size 누락 — scripts/verification/check-fe-admin-list-paging.js
#   4a) FE 상담사 상태 칩 현재 페이지 집계/필터 — scripts/verification/check-fe-consultant-status-chip-paging.js
#   4b) FE 표시용 시각을 판정 입력으로 사용(래칫)·다국어 JSON ${ 잔존(하드 실패, 허용 목록 없음) — scripts/verification/check-fe-display-string-logic.js
#   4c) FE 401 공용 처리 우회 로그인 직접 이동 — scripts/verification/check-login-redirect-bypass.js
#   4d) 발송 수신자 상한 숫자 리터럴(DTO @Size·FE MAX_RECIPIENTS·문구 최대 N명) — scripts/verification/check-recipient-limit-literals.js
#   4e) BE 결제·회기·ERP·일정 테스트 묶음 — mvn test -Pci-be-critical (대상: src/test/resources/ci/backend-critical-tests.txt)
#   4f) FE 기관연계 배지·주/일 칩 fit(34.8 half-width) — scripts/verification/check-engagement-badge-chip-layout.mjs
#   4g) FE 상담사 slate border(일지 달력·MGPagination·카드) stone 계산값 금지 — scripts/verification/check-consultant-slate-border-tokens.mjs
#   4h) FE build:ci (release/dev PR 포함 항상) — npm ci + npm run build:ci (prod-gate-fe-build 와 별개)
#   5) 운영 머지 게이트              — base=release/prod 이면 BE/FE 빌드도 같은 워크플로에서 실행
#   6) 운영 배포 워크플로 실패 삼킴·옛 DB — scripts/verification/check-prod-deploy-workflows.js (|| true · continue-on-error · non-fatal · mind_garden)
# 베이스라인·허용 목록: src/test/resources/guardrails/*.txt, 저장소 루트 .gitleaksignore
# required check 지정(브랜치 보호)은 이 파일에서 바꾸지 않는다. 체크 이름은 각 job 의 name 이다.

on:
  pull_request:
    branches: [ 'release/dev', 'release/prod' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GUARDRAIL_TESTS: AdminApiGuardCoverageTest,ProcedureSignatureGuardrailTest,ApplicationYmlSecretDefaultsTest,AdminApiRoleMatrixGuardrailMvcTest
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  guardrail-be:
    name: Guardrail BE (admin guard · procedure · yml secret)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run guardrail tests only
        run: |
          mvn -B -ntp test -Dtest="$GUARDRAIL_TESTS" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload current violation lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-current-lists
          path: target/guardrails/*.txt
          if-no-files-found: ignore
          retention-days: 7

  guardrail-be-critical-tests:
    name: Guardrail BE tests (payment · session · ERP · schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run critical backend test bundle
        run: mvn -B -ntp test -Pci-be-critical

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be-critical-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  guardrail-secrets:
    name: Guardrail secrets (gitleaks PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (history without blobs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install gitleaks (pinned + sha256)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan PR commits only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "pull_request 이벤트가 아니어서 건너뜀"
            exit 0
          fi
          bash scripts/ci/guardrail-gitleaks-diff.sh "$BASE_SHA" "$HEAD_SHA"

  guardrail-fe-admin-list-paging:
    name: Guardrail FE (admin list paging)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checker self-test
        run: node scripts/verification/check-fe-admin-list-paging.test.js

      - name: Check fetch-all / missing page·size (ratchet baseline)
        run: node scripts/verification/check-fe-admin-list-paging.js

  guardrail-fe-consultant-status-chip-paging:
    name: Guardrail FE (consultant status chip paging)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check consultant status chips use server statusCounts (no page aggregation)
        run: node scripts/verification/check-fe-consultant-status-chip-paging.js

  guardrail-fe-display-string-logic:
    name: Guardrail FE (display string as logic input)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checker self-test
        run: node scripts/verification/check-fe-display-string-logic.test.js

      - name: Check display time → logic (ratchet) / raw ${ in i18n JSON (strict, no allowlist)
        run: node scripts/verification/check-fe-display-string-logic.js

  guardrail-fe-login-redirect-bypass:
    name: Guardrail FE (login redirect bypassing shared 401 handling)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checker self-test
        run: node scripts/verification/check-login-redirect-bypass.test.js

      - name: Check direct /login navigation outside sessionRedirect (ratchet baseline)
        run: node scripts/verification/check-login-redirect-bypass.js

  guardrail-recipient-limit-literals:
    name: Guardrail recipient limit literals (single server limit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checker self-test
        run: node scripts/verification/check-recipient-limit-literals.test.js

      - name: Check numeric recipient limits outside notification.manual.max-recipients (allowlist ratchet)
        run: node scripts/verification/check-recipient-limit-literals.js

  guardrail-fe-engagement-badge-chip-layout:
    name: Guardrail FE (engagement badge chip layout)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # harness loadPuppeteer: ROOT / frontend /tmp/node_modules/puppeteer-core
      - name: Install puppeteer-core
        run: |
          mkdir -p /tmp
          cd /tmp
          npm i --no-save puppeteer-core
          test -d /tmp/node_modules/puppeteer-core

      # Prefer google-chrome-stable (apt) over snap chromium — snap cannot read /tmp
      # and blocks file:// CSS outside confinement. Harness also inlines CSS under repo ROOT.
      - name: Install Chrome/Chromium
        run: |
          set -euo pipefail
          chrome=""
          if command -v google-chrome-stable >/dev/null 2>&1; then
            chrome="$(command -v google-chrome-stable)"
          elif command -v google-chrome >/dev/null 2>&1; then
            chrome="$(command -v google-chrome)"
          else
            sudo apt-get update
            if wget -q -O /tmp/google-chrome-key.pub https://dl.google.com/linux/linux_signing_key.pub \
              && sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/google-chrome-key.pub \
              && echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
                | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null \
              && sudo apt-get update \
              && sudo apt-get install -y --no-install-recommends google-chrome-stable; then
              chrome="$(command -v google-chrome-stable || command -v google-chrome || true)"
            else
              echo "google-chrome-stable install failed; falling back to chromium"
              sudo apt-get install -y --no-install-recommends chromium-browser \
                || sudo apt-get install -y --no-install-recommends chromium \
                || sudo snap install chromium
            fi
          fi
          if [ -z "${chrome:-}" ]; then
            for cand in \
              "$(command -v google-chrome-stable || true)" \
              "$(command -v google-chrome || true)" \
              /usr/bin/google-chrome-stable \
              /usr/bin/google-chrome \
              "$(command -v chromium-browser || true)" \
              "$(command -v chromium || true)" \
              /usr/bin/chromium-browser \
              /usr/bin/chromium \
              /snap/bin/chromium \
              /usr/lib/chromium-browser/chromium-browser
            do
              if [ -n "$cand" ] && [ -x "$cand" ]; then
                chrome="$cand"
                break
              fi
            done
          fi
          if [ -z "${chrome:-}" ]; then
            echo "Chrome/Chromium binary not found after install"
            exit 1
          fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          echo "Resolved CHROME_PATH=$chrome"

      - name: Check engagement badge · week-day chip fit (34.8 half-width)
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: node scripts/verification/check-engagement-badge-chip-layout.mjs

      - name: Check consultant slate border tokens (no stone computed colors)
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: node scripts/verification/check-consultant-slate-border-tokens.mjs

  guardrail-prod-deploy-workflows:
    name: Guardrail deploy workflows (prod static)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checker self-test
        run: node scripts/verification/check-prod-deploy-workflows.test.js

      - name: Check || true · continue-on-error · non-fatal · mind_garden (allowlist ratchet)
        run: node scripts/verification/check-prod-deploy-workflows.js

      - name: Deploy check scripts self-test (public health · clock skew)
        run: bash scripts/deployment/deploy-checks.test.sh

  prod-gate-be-build:
    name: Prod gate · BE build
    if: github.base_ref == 'release/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Backend package (same as deploy)
        run: mvn -B -ntp clean package -DskipTests

  guardrail-fe-build-ci:
    name: Guardrail FE (build:ci)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend build:ci
        run: npm run build:ci

  prod-gate-fe-build:
    name: Prod gate · FE build
    if: github.base_ref == 'release/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend build (same script as deploy)
        run: npm run build:ci
