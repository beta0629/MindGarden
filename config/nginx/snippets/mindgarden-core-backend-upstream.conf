# Core JVM 단일 upstream (블루그린 시 listen 포트만 바뀜).
# 운영 서버 실경로: /etc/nginx/snippets/mindgarden-core-backend-upstream.conf
# GitHub Actions(deploy-production)가 헬스 통과 후 tee/cp 로 갱신 — 저장소 기본값은 blue(8080).
#
# CF520 재발 방지:
# - 라이브 upstream 은 **단일 active server** + keepalive 32 (Actions cutover 동일).
# - location 쪽 proxy_http_version 1.1 + Connection "" 없으면 keepalive 가 무력화됨
#   → mindgarden-core-proxy-params.conf 를 Core location 에서 include.
# - 듀얼 서버 + proxy_next_upstream 는 POST 이중 실행 위험으로 라이브 BG 에 사용하지 않음.
# - max_conns / queue 는 open-source nginx·Plus 확인 후 선택(런북 참고). Core read/send 는 60s 유지(120s 금지).
#
# 문서: docs/deployment/ZERO_DOWNTIME_GAP_AND_ROADMAP.md 부록,
#       docs/deployment/PRODUCTION_BLUE_GREEN_BACKEND_CUTOVER.md,
#       docs/runbooks/CF520_ORIGIN_HOST_ERROR_PREVENTION.md
upstream mindgarden_core_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}
