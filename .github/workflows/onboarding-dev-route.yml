# =============================================================================
# onboarding-dev nginx route (ops, workflow_dispatch only)
# =============================================================================
#
# Purpose:
#   Production nginx currently matches host onboarding-dev.core-solution.co.kr via
#   the prod wildcard server_name regex and proxies API/actuator to prod Core BE
#   (known commit ba96cb3 / release/prod). This workflow adds/replaces a dedicated
#   exact server_name block so API/actuator/oauth2/legal proxy to the .dev BE
#   while SPA static remains the prod frontend root.
#   Jaehak approved 10:50 KST.
#
# Upstream:
#   Public HTTPS https://api.dev.core-solution.co.kr (port 443) — avoids opening
#   :8080 through the firewall. No DEV_SERVER_HOST / direct IP:8080 upstream.
#   apply#39736614094: nginx→CF(api.dev) returned Cloudflare HTTP 502 while direct
#   curl to api.dev was 200. Mitigations in proxy_block: proxy_ssl_name + HTTP/1.1
#   Connection "" + strip CDN-Loop/CF-* + X-Forwarded-For $remote_addr.
#
# Bans:
#   - NEVER edit /etc/nginx/sites-available/core-solution or other prod domain blocks
#   - systemctl reload nginx ONLY — NEVER restart nginx; no app restart, no DB, no JAR deploy
#   - Do NOT SSH to the .dev server; PRODUCTION_* appleboy only
#   - Never print SSH keys (upstream host, HTTP codes, actuator JSON are OK)
#   - Do NOT auto-run; workflow_dispatch only (operator must choose mode)
#   - No bash heredocs in remote scripts (indented EOF/PY closers never match)
#
# SSOT connection (no new SSH secrets):
#   Same approved PRODUCTION_* appleboy path as:
#     - .github/workflows/server-time-sync.yml (#1726)
#     - .github/workflows/deploy-production.yml
#   Pin: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327
#   Secrets: PRODUCTION_HOST, PRODUCTION_USER, PRODUCTION_SSH_KEY (port 22)
#   Inline SSH script (prefer prod-core-be-rolling-restart.yml style; no SCP of scripts)
#
# Prod domain blocks: IMMUTABLE — only the dedicated onboarding-dev conf is touched.
# =============================================================================

name: onboarding-dev nginx route

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose (read-only) | apply | rollback'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - apply
          - rollback

permissions:
  contents: read

concurrency:
  group: onboarding-dev-nginx-route
  cancel-in-progress: false

jobs:
  require-main:
    name: Guard main for apply/rollback
    if: inputs.mode == 'apply' || inputs.mode == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Require refs/heads/main
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::mode=${{ inputs.mode }} requires github.ref == refs/heads/main (got ${{ github.ref }})"
            exit 1
          fi
          echo "✅ main guard passed"

  diagnose:
    name: Diagnose onboarding-dev route
    if: inputs.mode == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secret guard (PRODUCTION_*)
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${PRODUCTION_HOST}" ]; then
            echo "::error::PRODUCTION_HOST 시크릿이 비어 있습니다."
            missing=1
          fi
          if [ -z "${PRODUCTION_USER}" ]; then
            echo "::error::PRODUCTION_USER 시크릿이 비어 있습니다."
            missing=1
          fi
          if [ -z "${PRODUCTION_SSH_KEY}" ]; then
            echo "::error::PRODUCTION_SSH_KEY 시크릿이 비어 있습니다."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::필수 운영 SSH 시크릿이 없어 diagnose 를 중단합니다."
            exit 1
          fi
          echo "✅ 시크릿 가드 통과 (SSH 키는 출력하지 않음)"

      - name: Remote diagnose (read-only)
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master 2026-08-16 (v1.2.5+10) 고정 — server-time-sync.yml 과 동일
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script: |
            set -euo pipefail

            TARGET_HOST=onboarding-dev.core-solution.co.kr
            CONF=/etc/nginx/sites-available/onboarding-dev.core-solution.co.kr.conf
            ENABLED=/etc/nginx/sites-enabled/onboarding-dev.core-solution.co.kr.conf
            BACKUP_ROOT=/var/backups/nginx-onboarding-dev
            SSL_FULLCHAIN=/etc/letsencrypt/live/core-solution.co.kr/fullchain.pem
            SSL_PRIVKEY=/etc/letsencrypt/live/core-solution.co.kr/privkey.pem
            KNOWN_PROD_COMMIT=ba96cb3
            UPSTREAM_URL=https://api.dev.core-solution.co.kr
            UPSTREAM_HOST=api.dev.core-solution.co.kr

            resolve_proxy_ssl_ca() {
              if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
                printf '%s' /etc/ssl/certs/ca-certificates.crt
                return 0
              fi
              if [ -f /etc/pki/tls/certs/ca-bundle.crt ]; then
                printf '%s' /etc/pki/tls/certs/ca-bundle.crt
                return 0
              fi
              echo "::error::No system CA bundle found (tried /etc/ssl/certs/ca-certificates.crt and /etc/pki/tls/certs/ca-bundle.crt)" >&2
              return 1
            }
            write_desired_conf() {
              # $1 = output path
              # Fixed HTTPS upstream — no :8080. No bash heredoc (indented EOF never matches).
              # apply#39736614094 CF 502: proxy_ssl_name + HTTP/1.1 Connection "" + strip CDN-Loop/CF-* + XFF=$remote_addr
              local out="$1"
              local ca_bundle
              ca_bundle="$(resolve_proxy_ssl_ca)"
              OD_OUT="$out" OD_UPSTREAM="$UPSTREAM_URL" OD_UPSTREAM_HOST="$UPSTREAM_HOST" \
              OD_HOST="$TARGET_HOST" OD_FC="$SSL_FULLCHAIN" OD_PK="$SSL_PRIVKEY" OD_CA="$ca_bundle" \
              python3 -c '
            import os
            out = os.environ["OD_OUT"]
            upstream = os.environ["OD_UPSTREAM"]
            upstream_host = os.environ["OD_UPSTREAM_HOST"]
            host = os.environ["OD_HOST"]
            fc = os.environ["OD_FC"]
            pk = os.environ["OD_PK"]
            ca = os.environ["OD_CA"]

            def proxy_block(path, upstream, upstream_host, ca):
                # Literal proxy_pass (no variable host / no resolver). Uniform for all API paths.
                lines = [
                    "    location %s {" % path,
                    "        proxy_pass %s;" % upstream,
                    "        proxy_http_version 1.1;",
                    "        proxy_set_header Connection \"\";",
                    "        proxy_ssl_server_name on;",
                    "        proxy_ssl_name %s;" % upstream_host,
                    "        proxy_ssl_protocols TLSv1.2 TLSv1.3;",
                    "        proxy_ssl_verify on;",
                    "        proxy_ssl_verify_depth 3;",
                    "        proxy_ssl_trusted_certificate %s;" % ca,
                    "        # tenant Host=$host; SNI stays api.dev via proxy_ssl_name",
                    "        proxy_set_header Host $host;",
                    "        proxy_set_header X-Real-IP $remote_addr;",
                    "        # Avoid CF->CF loop / forged CF headers when client already came via Cloudflare:",
                    "        proxy_set_header X-Forwarded-For $remote_addr;",
                    "        proxy_set_header X-Forwarded-Proto $scheme;",
                    "        proxy_set_header X-Forwarded-Host $host;",
                    "        proxy_set_header CF-Connecting-IP \"\";",
                    "        proxy_set_header CF-Ray \"\";",
                    "        proxy_set_header CF-Visitor \"\";",
                    "        proxy_set_header CF-IPCountry \"\";",
                    "        proxy_set_header CDN-Loop \"\";",
                    "        proxy_set_header True-Client-IP \"\";",
                    "        proxy_connect_timeout 60s;",
                    "        proxy_send_timeout 60s;",
                    "        proxy_read_timeout 60s;",
                    "    }",
                ]
                return "\n".join(lines)

            parts = []
            parts.append("# Dedicated exact server_name for %s" % host)
            parts.append("# Managed by .github/workflows/onboarding-dev-route.yml — do not hand-edit prod core-solution blocks.")
            parts.append("# Upstream (.dev BE public HTTPS): %s" % upstream)
            parts.append("# apply#39736614094 CF 502; mitigations = proxy_ssl_name + HTTP/1.1 Connection \"\" + strip CDN-Loop/CF-* + XFF=$remote_addr")
            parts.append("")
            parts.append("server {")
            parts.append("    listen 80;")
            parts.append("    listen [::]:80;")
            parts.append("    server_name %s;" % host)
            parts.append("")
            parts.append("    location /.well-known/acme-challenge/ {")
            parts.append("        default_type text/plain;")
            parts.append("        root /var/www/html;")
            parts.append("    }")
            parts.append("")
            parts.append("    location / {")
            parts.append("        return 301 https://$host$request_uri;")
            parts.append("    }")
            parts.append("}")
            parts.append("")
            parts.append("server {")
            parts.append("    listen 443 ssl http2;")
            parts.append("    listen [::]:443 ssl http2;")
            parts.append("    server_name %s;" % host)
            parts.append("")
            parts.append("    ssl_certificate %s;" % fc)
            parts.append("    ssl_certificate_key %s;" % pk)
            parts.append("")
            parts.append("    ssl_protocols TLSv1.2 TLSv1.3;")
            parts.append("    ssl_ciphers HIGH:!aNULL:!MD5;")
            parts.append("    ssl_prefer_server_ciphers on;")
            parts.append("    ssl_session_cache shared:SSL:10m;")
            parts.append("    ssl_session_timeout 10m;")
            parts.append("")
            parts.append("    add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;")
            parts.append("    add_header X-Frame-Options \"SAMEORIGIN\" always;")
            parts.append("    add_header X-Content-Type-Options \"nosniff\" always;")
            parts.append("    add_header X-XSS-Protection \"1; mode=block\" always;")
            parts.append("")
            parts.append(proxy_block("/api/", upstream, upstream_host, ca))
            parts.append("")
            parts.append(proxy_block("/actuator/", upstream, upstream_host, ca))
            parts.append("")
            parts.append(proxy_block("/oauth2/", upstream, upstream_host, ca))
            parts.append("")
            parts.append(proxy_block("/login/oauth2/", upstream, upstream_host, ca))
            parts.append("")
            parts.append(proxy_block("^~ /legal/", upstream, upstream_host, ca))
            parts.append("")
            parts.append("    location ^~ /static/ {")
            parts.append("        root /var/www/mindgarden/frontend;")
            parts.append("        expires 1y;")
            parts.append("        add_header Cache-Control \"public, immutable\" always;")
            parts.append("        access_log off;")
            parts.append("    }")
            parts.append("")
            parts.append("    location / {")
            parts.append("        root /var/www/mindgarden/frontend;")
            parts.append("        try_files $uri $uri/ /index.html;")
            parts.append("        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;")
            parts.append("        add_header Pragma \"no-cache\" always;")
            parts.append("        add_header Expires \"0\" always;")
            parts.append("    }")
            parts.append("")
            parts.append("    access_log /var/log/nginx/%s.access.log;" % host)
            parts.append("    error_log /var/log/nginx/%s.error.log;" % host)
            parts.append("}")
            parts.append("")
            open(out, "w").write("\n".join(parts))
              '
            }

            echo "========== (1) nginx -T: which server matches ${TARGET_HOST} =========="
            NGINX_T="$(mktemp)"
            set +e
            sudo nginx -T >"$NGINX_T" 2>/tmp/nginx-T.err
            NT_RC=$?
            set -e
            if [ "$NT_RC" -ne 0 ]; then
              echo "::warning::nginx -T exit=${NT_RC}; stderr follows"
              head -50 /tmp/nginx-T.err || true
            fi

            if grep -qE "server_name[[:space:]]+${TARGET_HOST}[[:space:]]*;" "$NGINX_T"; then
              echo "✅ Exact server_name ${TARGET_HOST} present in nginx -T"
              echo "--- matching server block(s) (server_name + proxy_pass / root) ---"
              python3 -c '
            import re, sys
            path, host = sys.argv[1], sys.argv[2]
            text = open(path, encoding="utf-8", errors="replace").read()
            parts = re.split(r"(?=server\s*\{)", text)
            shown = 0
            for p in parts:
                if not p.strip().startswith("server"):
                    continue
                if re.search(r"server_name\s+" + re.escape(host) + r"\s*;", p):
                    lines = []
                    for line in p.splitlines():
                        if re.search(r"server_name|proxy_pass|proxy_ssl_|^\s*root\s|listen|location |try_files|ssl_certificate", line):
                            lines.append(line)
                    print("\n".join(lines[:80]))
                    print("---")
                    shown += 1
            if shown == 0:
                print("(no exact block parsed)")
              ' "$NGINX_T" "$TARGET_HOST" || true
              grep -nE "server_name[[:space:]]+${TARGET_HOST}|proxy_pass" "$NGINX_T" | head -80 || true
            else
              echo "⚠️ No exact server_name ${TARGET_HOST} — likely matched by wildcard regex"
              echo "--- wildcard server_name / proxy_pass context ---"
              grep -nE 'server_name[[:space:]]+~\\^\[\^\.\]\+\\.core-solution\\.co\\.kr\$|proxy_pass|mindgarden_core_backend' "$NGINX_T" | head -60 || true
              python3 -c '
            import re, sys
            text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
            parts = re.split(r"(?=server\s*\{)", text)
            for p in parts:
                if not p.strip().startswith("server"):
                    continue
                if re.search(r"server_name\s+~\^\[\^\.\]\+\\.core-solution\\.co\\.kr\$\s*;", p):
                    lines = []
                    for line in p.splitlines():
                        if re.search(r"server_name|proxy_pass|^\s*root\s|listen|location |try_files|ssl_certificate|include", line):
                            lines.append(line)
                    print("WILDCARD BLOCK SUMMARY:")
                    print("\n".join(lines[:100]))
                    print("---")
              ' "$NGINX_T" || true
            fi
            echo "Dedicated conf path exists: $([ -f "$CONF" ] && echo yes || echo no) ($CONF)"
            echo "Enabled symlink: $(readlink -f "$ENABLED" 2>/dev/null || echo '(absent)')"
            rm -f "$NGINX_T"

            echo ""
            echo "========== (2) DNS getent/dig for ${TARGET_HOST} =========="
            getent ahosts "${TARGET_HOST}" 2>/dev/null || true
            getent hosts "${TARGET_HOST}" 2>/dev/null || true
            dig +short A "${TARGET_HOST}" 2>/dev/null || true
            dig +short AAAA "${TARGET_HOST}" 2>/dev/null || true

            echo ""
            echo "========== (3) current https://${TARGET_HOST}/actuator/info =========="
            set +e
            INFO_CODE="$(curl -sS -o /tmp/onb-dev-info.json -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              "https://${TARGET_HOST}/actuator/info" 2>/tmp/onb-dev-info.err)"
            INFO_CURL_RC=$?
            set -e
            echo "HTTP ${INFO_CODE:-000} (curl_rc=${INFO_CURL_RC})"
            if [ -s /tmp/onb-dev-info.json ]; then
              head -c 4000 /tmp/onb-dev-info.json; echo
              if command -v python3 >/dev/null 2>&1; then
                python3 -c '
            import json
            try:
                d = json.load(open("/tmp/onb-dev-info.json"))
                commit = (d.get("git") or {}).get("commit") or {}
                cid = commit.get("id") or commit.get("id.abbrev") or ""
                print("parsed git.commit.id=%s" % cid)
            except Exception as e:
                print("(json parse skip: %s)" % e)
                ' || true
              fi
            else
              echo "(empty body)"
              head -20 /tmp/onb-dev-info.err || true
            fi
            echo "informational: known prod commit prefix=${KNOWN_PROD_COMMIT}"

            echo ""
            echo "========== (4) .dev BE public HTTPS reachability =========="
            echo "Upstream=${UPSTREAM_URL} (Host=${UPSTREAM_HOST})"
            set +e
            DEV_CODE="$(curl -sS -o /tmp/dev-be-info.json -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              "${UPSTREAM_URL}/actuator/info" 2>/tmp/dev-be-info.err)"
            set -e
            echo ".dev BE ${UPSTREAM_URL}/actuator/info HTTP ${DEV_CODE:-000}"
            if [ -s /tmp/dev-be-info.json ]; then
              head -c 4000 /tmp/dev-be-info.json; echo
            else
              echo "(empty body)"
              head -20 /tmp/dev-be-info.err || true
            fi

            echo ""
            echo "========== (5) proposed conf diff =========="
            DESIRED="$(mktemp)"
            write_desired_conf "$DESIRED"
            if [ -f "$CONF" ]; then
              echo "Existing $CONF — diff vs desired:"
              diff -u "$CONF" "$DESIRED" || true
            else
              echo "No existing dedicated conf — full desired conf:"
              cat "$DESIRED"
            fi
            rm -f "$DESIRED"

            echo ""
            echo "========== (6) nginx error.log tails (onboarding-dev|api.dev) =========="
            OD_ERR_LOG="/var/log/nginx/onboarding-dev.core-solution.co.kr.error.log"
            if [ -f "$OD_ERR_LOG" ]; then
              echo "--- ${OD_ERR_LOG} (last 200, filtered) ---"
              OD_FILT="$(sudo tail -n 200 "$OD_ERR_LOG" 2>/dev/null | grep -E 'onboarding-dev|api\.dev' || true)"
              if [ -n "$OD_FILT" ]; then
                printf '%s\n' "$OD_FILT"
              else
                echo "(filter empty — last 30 unfiltered)"
                sudo tail -n 30 "$OD_ERR_LOG" 2>/dev/null || true
              fi
            else
              echo "(absent: ${OD_ERR_LOG})"
            fi
            echo "--- /var/log/nginx/error.log (last 200, filtered; skip error.log.1) ---"
            if [ -f /var/log/nginx/error.log ]; then
              NG_FILT="$(sudo tail -n 200 /var/log/nginx/error.log 2>/dev/null | grep -E 'onboarding-dev|api\.dev' || true)"
              if [ -n "$NG_FILT" ]; then
                printf '%s\n' "$NG_FILT"
              else
                echo "(filter empty — last 30 unfiltered)"
                sudo tail -n 30 /var/log/nginx/error.log 2>/dev/null || true
              fi
            else
              echo "(absent: /var/log/nginx/error.log)"
            fi

            echo ""
            echo "========== (7) TLS handshake summary to api.dev (no --resolve) =========="
            set +e
            curl -v --connect-timeout 10 --max-time 30 -o /dev/null \
              "https://${UPSTREAM_HOST}/actuator/info" >/tmp/od-tls-v.out 2>/tmp/od-tls-v.err
            set -e
            grep -iE 'SSL|TLS|subject|issuer|expire|Connected|HTTP/|server:|cf-|cloudflare' /tmp/od-tls-v.err 2>/dev/null | head -80 || true

            echo ""
            echo "========== (8) Is api.dev Cloudflare-proxied? =========="
            echo "--- dig +short A ${UPSTREAM_HOST} ---"
            A_IPS="$(dig +short A "${UPSTREAM_HOST}" 2>/dev/null || true)"
            printf '%s\n' "${A_IPS:-"(empty)"}"
            echo "--- dig +short AAAA ${UPSTREAM_HOST} ---"
            AAAA_IPS="$(dig +short AAAA "${UPSTREAM_HOST}" 2>/dev/null || true)"
            printf '%s\n' "${AAAA_IPS:-"(empty)"}"
            CF_DNS=no
            for ip in $A_IPS $AAAA_IPS; do
              case "$ip" in
                104.16.*|104.17.*|104.18.*|104.19.*|104.21.*|104.22.*|172.64.*|172.67.*|162.158.*)
                  CF_DNS=yes
                  ;;
              esac
            done
            if [ "$CF_DNS" = "yes" ]; then
              echo "DNS note: A/AAAA look like Cloudflare ranges"
            else
              echo "DNS note: A/AAAA raw (not matching common CF ranges above) or empty"
            fi
            echo "--- response headers https://${UPSTREAM_HOST}/actuator/health ---"
            set +e
            curl -sI --connect-timeout 10 --max-time 30 \
              "https://${UPSTREAM_HOST}/actuator/health" >/tmp/od-cf-hdr.out 2>/tmp/od-cf-hdr.err
            set -e
            grep -iE '^(HTTP/|server:|cf-ray:|cf-cache-status:)' /tmp/od-cf-hdr.out 2>/dev/null || true
            if grep -qiE '^(cf-ray:|cf-cache-status:)' /tmp/od-cf-hdr.out 2>/dev/null \
              || grep -qiE '^server:[[:space:]]*cloudflare' /tmp/od-cf-hdr.out 2>/dev/null; then
              echo "conclusion: Cloudflare-proxied=yes"
            elif [ "$CF_DNS" = "yes" ]; then
              echo "conclusion: Cloudflare-proxied=likely (CF-range DNS; headers inconclusive)"
            else
              echo "conclusion: Cloudflare-proxied=no (or inconclusive)"
            fi

            echo ""
            echo "========== (9) Backup vs live nginx tree diff =========="
            BACKUP_USED=""
            BACKUP_TS=""
            if [ -f "${BACKUP_ROOT}/LATEST" ]; then
              BACKUP_TS="$(sudo cat "${BACKUP_ROOT}/LATEST" 2>/dev/null | tr -d '\r\n' || true)"
              if [ -n "$BACKUP_TS" ] && [ -d "${BACKUP_ROOT}/${BACKUP_TS}" ]; then
                BACKUP_USED="${BACKUP_ROOT}/${BACKUP_TS}"
                echo "backup source: LATEST -> ${BACKUP_USED}"
              fi
            fi
            if [ -z "$BACKUP_USED" ]; then
              FALLBACK_TS=20261022-172230
              if [ -d "${BACKUP_ROOT}/${FALLBACK_TS}" ]; then
                BACKUP_TS="$FALLBACK_TS"
                BACKUP_USED="${BACKUP_ROOT}/${FALLBACK_TS}"
                echo "backup source: hardcoded fallback ${FALLBACK_TS} (LATEST missing or invalid)"
              else
                echo "backup source: none (LATEST missing/invalid and fallback ${FALLBACK_TS} absent under ${BACKUP_ROOT})"
              fi
            fi
            if [ -n "$BACKUP_USED" ]; then
              echo "--- backup NOTE / had_conf / file list ---"
              if [ -f "${BACKUP_USED}/NOTE.txt" ]; then
                sudo cat "${BACKUP_USED}/NOTE.txt" || true
              else
                echo "(no NOTE.txt)"
              fi
              if [ -f "${BACKUP_USED}/had_conf" ]; then
                printf 'had_conf='
                sudo cat "${BACKUP_USED}/had_conf" || true
                printf '\n'
              fi
              echo "--- backup dir listing ---"
              sudo ls -la "${BACKUP_USED}" || true
              HAS_TREE=0
              for sub in sites-available sites-enabled conf.d; do
                if [ -d "${BACKUP_USED}/${sub}" ] || [ -d "${BACKUP_USED}/etc/nginx/${sub}" ]; then
                  HAS_TREE=1
                fi
              done
              if [ "$HAS_TREE" -eq 1 ]; then
                for sub in sites-available sites-enabled conf.d; do
                  for cand in "${BACKUP_USED}/${sub}" "${BACKUP_USED}/etc/nginx/${sub}"; do
                    if [ -d "$cand" ]; then
                      echo "--- diff -qr ${cand} vs /etc/nginx/${sub} ---"
                      sudo diff -qr "$cand" "/etc/nginx/${sub}" || true
                    fi
                  done
                done
              else
                echo "backup shape: dedicated conf + NOTE only (no full tree snapshots; do not invent writes)"
                BAK_CONF="${BACKUP_USED}/onboarding-dev.core-solution.co.kr.conf"
                if [ -f "$BAK_CONF" ] && [ -f "$CONF" ]; then
                  echo "--- diff -u backup dedicated conf vs live CONF ---"
                  sudo diff -u "$BAK_CONF" "$CONF" || true
                elif [ -f "$BAK_CONF" ]; then
                  echo "backup dedicated conf present; live CONF absent"
                elif [ -f "$CONF" ]; then
                  echo "live CONF present; backup dedicated conf absent"
                else
                  echo "neither backup nor live dedicated conf present"
                fi
              fi
            fi
            echo "--- live /etc/nginx/sites-available ---"
            sudo ls -la /etc/nginx/sites-available 2>/dev/null || true
            echo "--- live /etc/nginx/sites-enabled ---"
            sudo ls -la /etc/nginx/sites-enabled 2>/dev/null || true
            echo "--- live /etc/nginx/conf.d ---"
            sudo ls -la /etc/nginx/conf.d 2>/dev/null || true
            echo "dedicated conf present: $([ -f "$CONF" ] && echo yes || echo no) ($CONF)"
            echo "dedicated enabled present: $([ -e "$ENABLED" ] && echo yes || echo no) ($ENABLED)"

            echo ""
            echo "========== (10) m-garden conflicting server name — pre-existing? =========="
            echo "(read-only; never modify live nginx config)"
            echo "--- current: sudo nginx -T conflicting server name ---"
            sudo nginx -T 2>&1 | grep -i 'conflicting server name' || true
            echo "--- files declaring m-garden.co.kr / www.m-garden.co.kr server_name ---"
            MG_FILES="$(sudo grep -rlE 'server_name[[:space:]].*(www\.)?m-garden\.co\.kr' \
              /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true)"
            if [ -z "$MG_FILES" ]; then
              echo "(no matching files under sites-available/sites-enabled/conf.d)"
            else
              for f in $MG_FILES; do
                echo "path=$f"
                sudo ls -la "$f" || true
                sudo stat "$f" || true
              done
            fi
            echo "--- mtime vs backup timestamp (Asia/Seoul; UTC fallback) ---"
            BAK_EPOCH=""
            if [ -n "${BACKUP_TS:-}" ]; then
              BAK_DATE="${BACKUP_TS:0:4}-${BACKUP_TS:4:2}-${BACKUP_TS:6:2} ${BACKUP_TS:9:2}:${BACKUP_TS:11:2}:${BACKUP_TS:13:2}"
              BAK_EPOCH="$(TZ=Asia/Seoul date -d "$BAK_DATE" +%s 2>/dev/null || true)"
              if [ -n "$BAK_EPOCH" ]; then
                echo "backup_ts=${BACKUP_TS} parsed_as=Asia/Seoul epoch=${BAK_EPOCH} human=$(TZ=Asia/Seoul date -d "@${BAK_EPOCH}" 2>/dev/null || true)"
              else
                BAK_EPOCH="$(TZ=UTC date -d "$BAK_DATE" +%s 2>/dev/null || true)"
                echo "backup_ts=${BACKUP_TS} parsed_as=UTC epoch=${BAK_EPOCH:-unparsed} human=$(TZ=UTC date -d "@${BAK_EPOCH}" 2>/dev/null || true)"
              fi
            else
              echo "no backup_ts available — skip mtime comparison"
            fi
            MG_ALL_OLDER=yes
            MG_ANY=no
            if [ -n "$MG_FILES" ] && [ -n "${BAK_EPOCH:-}" ]; then
              for f in $MG_FILES; do
                MG_ANY=yes
                MT="$(sudo stat -c %Y "$f" 2>/dev/null || echo 0)"
                echo "file=$f mtime_epoch=$MT backup_epoch=$BAK_EPOCH"
                if [ "$MT" -ge "$BAK_EPOCH" ]; then
                  MG_ALL_OLDER=no
                  echo "  note: mtime >= backup ts"
                else
                  echo "  note: mtime older than backup ts"
                fi
              done
            fi
            echo "--- verdict ---"
            echo "dedicated onboarding-dev conf does not declare m-garden server_name; it cannot introduce those conflicts."
            if [ "$MG_ANY" = "yes" ] && [ "$MG_ALL_OLDER" = "yes" ] && [ -n "${BAK_EPOCH:-}" ]; then
              echo "verdict: m-garden conf file mtimes older than backup ts — conflicting server name warnings likely pre-existed before onboarding-dev dedicated conf."
            elif [ "$MG_ANY" = "yes" ] && [ "$MG_ALL_OLDER" = "no" ]; then
              echo "verdict: at least one m-garden conf mtime >= backup ts — cannot conclude pre-existing from mtime alone; still unlikely from dedicated onboarding-dev conf."
            elif [ "$MG_ANY" = "no" ]; then
              echo "verdict: no m-garden server_name files found in scanned dirs."
            else
              echo "verdict: inconclusive (missing backup_ts or parse)."
            fi
            echo "skip temp nginx -t -c: rewriting include paths under a temp root is fragile and risks false negatives; prefer mtime+grep above (read-only)."

            echo ""
            echo "========== (11) Tenant Host header matrix (from prod, read-only) =========="
            echo "Upstream=${UPSTREAM_URL} ; SNI/connect-to ${UPSTREAM_HOST}:443"
            LOGIN_JSON='{"email":"nosuch-onboarding-probe@example.invalid","password":"x"}'
            od_matrix_get() {
              local label="$1"
              shift
              local out=/tmp/od-host-matrix-body.out
              local code
              set +e
              code="$(curl -sS -o "$out" -w '%{http_code}' --connect-timeout 10 --max-time 30 \
                --connect-to "${UPSTREAM_HOST}:443:${UPSTREAM_HOST}:443" \
                "$@" "${UPSTREAM_URL}/actuator/info" 2>/tmp/od-host-matrix.err)"
              set -e
              echo "--- GET /actuator/info :: ${label} ---"
              echo "HTTP ${code:-000}"
              echo -n "body_snippet: "
              head -c 300 "$out" 2>/dev/null; echo
            }
            od_matrix_login() {
              local label="$1"
              shift
              local out=/tmp/od-host-matrix-login.out
              local code
              set +e
              code="$(curl -sS -o "$out" -w '%{http_code}' --connect-timeout 10 --max-time 30 \
                --connect-to "${UPSTREAM_HOST}:443:${UPSTREAM_HOST}:443" \
                -H 'Content-Type: application/json' \
                -d "$LOGIN_JSON" \
                "$@" "${UPSTREAM_URL}/api/v1/auth/login" 2>/tmp/od-host-matrix-login.err)"
              set -e
              echo "--- POST /api/v1/auth/login :: ${label} ---"
              echo "HTTP ${code:-000}"
              echo -n "body_snippet: "
              head -c 300 "$out" 2>/dev/null; echo
              printf '%s\t%s\n' "$label" "${code:-000}" >> /tmp/od-host-matrix-login-codes.tsv
            }
            : > /tmp/od-host-matrix-login-codes.tsv
            od_matrix_get "1 default Host (URL=${UPSTREAM_HOST})"
            od_matrix_get "2 Host=onboarding-dev.core-solution.co.kr" \
              -H "Host: onboarding-dev.core-solution.co.kr"
            od_matrix_get "3 Host=api.dev + X-Forwarded-Host=onboarding-dev" \
              -H "Host: ${UPSTREAM_HOST}" \
              -H "X-Forwarded-Host: onboarding-dev.core-solution.co.kr"
            echo "--- login probe (fake credentials; no real secrets) ---"
            od_matrix_login "L1 Host=api.dev only" \
              -H "Host: ${UPSTREAM_HOST}"
            od_matrix_login "L2 Host=onboarding-dev" \
              -H "Host: onboarding-dev.core-solution.co.kr"
            od_matrix_login "L3 Host=api.dev + X-Forwarded-Host=onboarding-dev" \
              -H "Host: ${UPSTREAM_HOST}" \
              -H "X-Forwarded-Host: onboarding-dev.core-solution.co.kr"
            od_matrix_login "L4 Host=api.dev + X-Tenant-Subdomain=onboarding-dev" \
              -H "Host: ${UPSTREAM_HOST}" \
              -H "X-Tenant-Subdomain: onboarding-dev"
            od_matrix_login "L5 Host=api.dev + X-Tenant-Subdomain=mindgarden" \
              -H "Host: ${UPSTREAM_HOST}" \
              -H "X-Tenant-Subdomain: mindgarden"
            echo "--- login status summary (label which combo changes error shape) ---"
            if [ -s /tmp/od-host-matrix-login-codes.tsv ]; then
              cat /tmp/od-host-matrix-login-codes.tsv
              BASE_CODE="$(awk -F'\t' 'NR==1 {print $2; exit}' /tmp/od-host-matrix-login-codes.tsv)"
              echo "baseline status (L1 Host=api.dev only)=${BASE_CODE}"
              while IFS="$(printf '\t')" read -r lab code; do
                if [ "$code" != "$BASE_CODE" ]; then
                  echo "DIFFERS from baseline: ${lab} -> HTTP ${code} (tenant-sensitive shape change candidate)"
                else
                  echo "same as baseline: ${lab} -> HTTP ${code}"
                fi
              done < /tmp/od-host-matrix-login-codes.tsv
            else
              echo "(no login probe results)"
            fi

            echo ""
            echo "✅ diagnose complete (no changes). exit 0"
            exit 0

  apply:
    name: Apply onboarding-dev dedicated nginx route
    needs: [require-main]
    if: inputs.mode == 'apply' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secret guard (PRODUCTION_*)
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${PRODUCTION_HOST}" ]; then
            echo "::error::PRODUCTION_HOST 시크릿이 비어 있습니다."
            missing=1
          fi
          if [ -z "${PRODUCTION_USER}" ]; then
            echo "::error::PRODUCTION_USER 시크릿이 비어 있습니다."
            missing=1
          fi
          if [ -z "${PRODUCTION_SSH_KEY}" ]; then
            echo "::error::PRODUCTION_SSH_KEY 시크릿이 비어 있습니다."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::필수 운영 SSH 시크릿이 없어 apply 를 중단합니다."
            exit 1
          fi
          echo "✅ 시크릿 가드 통과 (SSH 키는 출력하지 않음)"

      - name: Remote apply (backup → conf → reload → verify → auto-rollback)
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master 2026-08-16 (v1.2.5+10) 고정 — server-time-sync.yml 과 동일
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            set -euo pipefail

            TARGET_HOST=onboarding-dev.core-solution.co.kr
            CONF=/etc/nginx/sites-available/onboarding-dev.core-solution.co.kr.conf
            ENABLED=/etc/nginx/sites-enabled/onboarding-dev.core-solution.co.kr.conf
            BACKUP_ROOT=/var/backups/nginx-onboarding-dev
            SSL_FULLCHAIN=/etc/letsencrypt/live/core-solution.co.kr/fullchain.pem
            SSL_PRIVKEY=/etc/letsencrypt/live/core-solution.co.kr/privkey.pem
            KNOWN_PROD_COMMIT=ba96cb3
            UPSTREAM_URL=https://api.dev.core-solution.co.kr
            UPSTREAM_HOST=api.dev.core-solution.co.kr

            resolve_proxy_ssl_ca() {
              if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
                printf '%s' /etc/ssl/certs/ca-certificates.crt
                return 0
              fi
              if [ -f /etc/pki/tls/certs/ca-bundle.crt ]; then
                printf '%s' /etc/pki/tls/certs/ca-bundle.crt
                return 0
              fi
              echo "::error::No system CA bundle found (tried /etc/ssl/certs/ca-certificates.crt and /etc/pki/tls/certs/ca-bundle.crt) — abort apply" >&2
              return 1
            }
            write_desired_conf() {
              # $1 = output path
              # Fixed HTTPS upstream — no :8080. No bash heredoc (indented EOF never matches).
              # apply#39736614094 CF 502: proxy_ssl_name + HTTP/1.1 Connection "" + strip CDN-Loop/CF-* + XFF=$remote_addr
              local out="$1"
              local ca_bundle
              ca_bundle="$(resolve_proxy_ssl_ca)"
              OD_OUT="$out" OD_UPSTREAM="$UPSTREAM_URL" OD_UPSTREAM_HOST="$UPSTREAM_HOST" \
              OD_HOST="$TARGET_HOST" OD_FC="$SSL_FULLCHAIN" OD_PK="$SSL_PRIVKEY" OD_CA="$ca_bundle" \
              python3 -c '
            import os
            out = os.environ["OD_OUT"]
            upstream = os.environ["OD_UPSTREAM"]
            upstream_host = os.environ["OD_UPSTREAM_HOST"]
            host = os.environ["OD_HOST"]
            fc = os.environ["OD_FC"]
            pk = os.environ["OD_PK"]
            ca = os.environ["OD_CA"]

            def proxy_block(path, upstream, upstream_host, ca):
                # Literal proxy_pass (no variable host / no resolver). Uniform for all API paths.
                lines = [
                    "    location %s {" % path,
                    "        proxy_pass %s;" % upstream,
                    "        proxy_http_version 1.1;",
                    "        proxy_set_header Connection \"\";",
                    "        proxy_ssl_server_name on;",
                    "        proxy_ssl_name %s;" % upstream_host,
                    "        proxy_ssl_protocols TLSv1.2 TLSv1.3;",
                    "        proxy_ssl_verify on;",
                    "        proxy_ssl_verify_depth 3;",
                    "        proxy_ssl_trusted_certificate %s;" % ca,
                    "        # tenant Host=$host; SNI stays api.dev via proxy_ssl_name",
                    "        proxy_set_header Host $host;",
                    "        proxy_set_header X-Real-IP $remote_addr;",
                    "        # Avoid CF->CF loop / forged CF headers when client already came via Cloudflare:",
                    "        proxy_set_header X-Forwarded-For $remote_addr;",
                    "        proxy_set_header X-Forwarded-Proto $scheme;",
                    "        proxy_set_header X-Forwarded-Host $host;",
                    "        proxy_set_header CF-Connecting-IP \"\";",
                    "        proxy_set_header CF-Ray \"\";",
                    "        proxy_set_header CF-Visitor \"\";",
                    "        proxy_set_header CF-IPCountry \"\";",
                    "        proxy_set_header CDN-Loop \"\";",
                    "        proxy_set_header True-Client-IP \"\";",
                    "        proxy_connect_timeout 60s;",
                    "        proxy_send_timeout 60s;",
                    "        proxy_read_timeout 60s;",
                    "    }",
                ]
                return "\n".join(lines)

            parts = []
            parts.append("# Dedicated exact server_name for %s" % host)
            parts.append("# Managed by .github/workflows/onboarding-dev-route.yml — do not hand-edit prod core-solution blocks.")
            parts.append("# Upstream (.dev BE public HTTPS): %s" % upstream)
            parts.append("# apply#39736614094 CF 502; mitigations = proxy_ssl_name + HTTP/1.1 Connection \"\" + strip CDN-Loop/CF-* + XFF=$remote_addr")
            parts.append("")
            parts.append("server {")
            parts.append("    listen 80;")
            parts.append("    listen [::]:80;")
            parts.append("    server_name %s;" % host)
            parts.append("")
            parts.append("    location /.well-known/acme-challenge/ {")
            parts.append("        default_type text/plain;")
            parts.append("        root /var/www/html;")
            parts.append("    }")
            parts.append("")
            parts.append("    location / {")
            parts.append("        return 301 https://$host$request_uri;")
            parts.append("    }")
            parts.append("}")
            parts.append("")
            parts.append("server {")
            parts.append("    listen 443 ssl http2;")
            parts.append("    listen [::]:443 ssl http2;")
            parts.append("    server_name %s;" % host)
            parts.append("")
            parts.append("    ssl_certificate %s;" % fc)
            parts.append("    ssl_certificate_key %s;" % pk)
            parts.append("")
            parts.append("    ssl_protocols TLSv1.2 TLSv1.3;")
            parts.append("    ssl_ciphers HIGH:!aNULL:!MD5;")
            parts.append("    ssl_prefer_server_ciphers on;")
            parts.append("    ssl_session_cache shared:SSL:10m;")
            parts.append("    ssl_session_timeout 10m;")
            parts.append("")
            parts.append("    add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;")
            parts.append("    add_header X-Frame-Options \"SAMEORIGIN\" always;")
            parts.append("    add_header X-Content-Type-Options \"nosniff\" always;")
            parts.append("    add_header X-XSS-Protection \"1; mode=block\" always;")
            parts.append("")
            parts.append(proxy_block("/api/", upstream, upstream_host, ca))
            parts.append("")
            parts.append(proxy_block("/actuator/", upstream, upstream_host, ca))
            parts.append("")
            parts.append(proxy_block("/oauth2/", upstream, upstream_host, ca))
            parts.append("")
            parts.append(proxy_block("/login/oauth2/", upstream, upstream_host, ca))
            parts.append("")
            parts.append(proxy_block("^~ /legal/", upstream, upstream_host, ca))
            parts.append("")
            parts.append("    location ^~ /static/ {")
            parts.append("        root /var/www/mindgarden/frontend;")
            parts.append("        expires 1y;")
            parts.append("        add_header Cache-Control \"public, immutable\" always;")
            parts.append("        access_log off;")
            parts.append("    }")
            parts.append("")
            parts.append("    location / {")
            parts.append("        root /var/www/mindgarden/frontend;")
            parts.append("        try_files $uri $uri/ /index.html;")
            parts.append("        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;")
            parts.append("        add_header Pragma \"no-cache\" always;")
            parts.append("        add_header Expires \"0\" always;")
            parts.append("    }")
            parts.append("")
            parts.append("    access_log /var/log/nginx/%s.access.log;" % host)
            parts.append("    error_log /var/log/nginx/%s.error.log;" % host)
            parts.append("}")
            parts.append("")
            open(out, "w").write("\n".join(parts))
              '
            }

            restore_from_latest() {
              local latest tsdir
              latest="$(sudo cat "${BACKUP_ROOT}/LATEST" 2>/dev/null | tr -d '\r\n' || true)"
              if [ -z "$latest" ]; then
                echo "::error::LATEST pointer missing — cannot restore"
                return 1
              fi
              tsdir="${BACKUP_ROOT}/${latest}"
              if [ ! -d "$tsdir" ]; then
                echo "::error::Backup dir missing: $tsdir"
                return 1
              fi
              echo "♻️ Restoring from $tsdir"
              if [ -f "${tsdir}/had_conf" ] && grep -qx '1' "${tsdir}/had_conf" 2>/dev/null; then
                sudo cp -a "${tsdir}/onboarding-dev.core-solution.co.kr.conf" "$CONF"
                if [ -f "${tsdir}/enabled_symlink_target" ]; then
                  tgt="$(tr -d '\r\n' < "${tsdir}/enabled_symlink_target")"
                  if [ -n "$tgt" ]; then
                    sudo ln -sfn "$tgt" "$ENABLED"
                  fi
                else
                  sudo ln -sfn "$CONF" "$ENABLED"
                fi
              else
                echo "Backup had no dedicated conf — removing dedicated conf+symlink"
                sudo rm -f "$CONF" "$ENABLED"
              fi
              if ! sudo nginx -t 2>&1; then
                echo "::error::nginx -t failed after restore"
                return 1
              fi
              sudo systemctl reload nginx
              echo "✅ reload after restore"
              return 0
            }

            http_code() {
              curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$1" 2>/dev/null || echo "000"
            }

            echo "🔐 Using fixed public HTTPS upstream (abort if system CA bundle missing)"
            CA_BUNDLE="$(resolve_proxy_ssl_ca)"
            echo "Upstream=${UPSTREAM_URL} Host=${UPSTREAM_HOST} CA=${CA_BUNDLE}"

            TS="$(date +%Y%m%d-%H%M%S)"
            TS_DIR="${BACKUP_ROOT}/${TS}"
            sudo mkdir -p "$TS_DIR"
            {
              echo "ts=${TS}"
              echo "target=${TARGET_HOST}"
              echo "upstream=${UPSTREAM_URL}"
              echo "note=onboarding-dev-route apply backup before dedicated conf write"
              echo "had_conf=$([ -f "$CONF" ] && echo 1 || echo 0)"
              echo "enabled_present=$([ -e "$ENABLED" ] && echo 1 || echo 0)"
              echo "enabled_link=$(readlink "$ENABLED" 2>/dev/null || echo '')"
            } | sudo tee "${TS_DIR}/NOTE.txt" > /dev/null

            if [ -f "$CONF" ]; then
              echo 1 | sudo tee "${TS_DIR}/had_conf" > /dev/null
              sudo cp -a "$CONF" "${TS_DIR}/onboarding-dev.core-solution.co.kr.conf"
            else
              echo 0 | sudo tee "${TS_DIR}/had_conf" > /dev/null
            fi
            if [ -L "$ENABLED" ] || [ -e "$ENABLED" ]; then
              readlink "$ENABLED" 2>/dev/null | sudo tee "${TS_DIR}/enabled_symlink_target" > /dev/null || true
              ls -la "$ENABLED" 2>/dev/null | sudo tee "${TS_DIR}/enabled_ls.txt" > /dev/null || true
            fi
            echo "$TS" | sudo tee "${BACKUP_ROOT}/LATEST" > /dev/null
            echo "✅ Backup ${TS_DIR} ; LATEST=${TS}"

            DESIRED="$(mktemp)"
            write_desired_conf "$DESIRED"
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            sudo cp "$DESIRED" "${CONF}.new"
            sudo mv -f "${CONF}.new" "$CONF"
            sudo ln -sfn "$CONF" "$ENABLED"
            rm -f "$DESIRED"
            echo "✅ Wrote $CONF and enabled symlink → $CONF"

            set +e
            TEST_OUT="$(sudo nginx -t 2>&1)"
            TEST_RC=$?
            set -e
            echo "$TEST_OUT"
            if [ "$TEST_RC" -ne 0 ]; then
              echo "::error::nginx -t failed — restoring backup then reload"
              restore_from_latest || true
              set +e
              sudo systemctl reload nginx
              set -e
              exit 1
            fi

            sudo systemctl reload nginx
            echo "✅ systemctl reload nginx"

            sleep 2
            set +e
            curl -sS -o /tmp/onb-after-info.json -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              "https://${TARGET_HOST}/actuator/info" > /tmp/onb-after-code.txt 2>/tmp/onb-after.err
            ONB_CODE="$(cat /tmp/onb-after-code.txt 2>/dev/null || echo 000)"
            set -e
            echo "--- onboarding-dev /actuator/info HTTP ${ONB_CODE} ---"
            if [ -s /tmp/onb-after-info.json ]; then
              head -c 4000 /tmp/onb-after-info.json; echo
            else
              echo "(empty body)"; head -20 /tmp/onb-after.err || true
            fi

            APP_CODE="$(http_code "https://app.core-solution.co.kr/actuator/health")"
            MG_CODE="$(http_code "https://mindgarden.core-solution.co.kr/actuator/health")"
            echo "app.core-solution.co.kr /actuator/health HTTP ${APP_CODE}"
            echo "mindgarden.core-solution.co.kr /actuator/health HTTP ${MG_CODE}"

            ONB_COMMIT=""
            DEV_COMMIT=""
            if command -v python3 >/dev/null 2>&1 && [ -s /tmp/onb-after-info.json ]; then
              ONB_COMMIT="$(python3 -c 'import json;d=json.load(open("/tmp/onb-after-info.json"));c=(d.get("git")or{}).get("commit")or{};print(c.get("id")or c.get("id.abbrev")or"")' 2>/dev/null || true)"
            fi
            set +e
            curl -sS -o /tmp/dev-after-info.json --connect-timeout 10 --max-time 30 \
              "${UPSTREAM_URL}/actuator/info" >/dev/null 2>&1
            set -e
            if command -v python3 >/dev/null 2>&1 && [ -s /tmp/dev-after-info.json ]; then
              DEV_COMMIT="$(python3 -c 'import json;d=json.load(open("/tmp/dev-after-info.json"));c=(d.get("git")or{}).get("commit")or{};print(c.get("id")or c.get("id.abbrev")or"")' 2>/dev/null || true)"
            fi
            echo "ℹ️ git.commit.id onboarding-dev=${ONB_COMMIT:-?} known_prod=${KNOWN_PROD_COMMIT} .dev=${DEV_COMMIT:-?}"
            echo "ℹ️ (informational only — HTTP status is the hard rollback trigger)"

            onb_ok=0
            case "$ONB_CODE" in
              2??) onb_ok=1 ;;
            esac
            app_ok=0
            case "$APP_CODE" in
              2??) app_ok=1 ;;
            esac
            mg_ok=0
            case "$MG_CODE" in
              2??) mg_ok=1 ;;
            esac

            if [ "$onb_ok" -ne 1 ] || [ "$app_ok" -ne 1 ] || [ "$mg_ok" -ne 1 ]; then
              echo "::error::Post-apply verify failed (onboarding-dev=${ONB_CODE} app=${APP_CODE} mindgarden=${MG_CODE}) — auto rollback from LATEST"
              restore_from_latest
              echo "--- post-rollback status ---"
              echo "onboarding-dev info HTTP $(http_code "https://${TARGET_HOST}/actuator/info")"
              echo "app health HTTP $(http_code "https://app.core-solution.co.kr/actuator/health")"
              echo "mindgarden health HTTP $(http_code "https://mindgarden.core-solution.co.kr/actuator/health")"
              exit 1
            fi

            echo "✅ apply succeeded — dedicated route active; prod app/mindgarden health still 2xx"

  rollback:
    name: Rollback onboarding-dev dedicated nginx route
    needs: [require-main]
    if: inputs.mode == 'rollback' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secret guard (PRODUCTION_*)
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${PRODUCTION_HOST}" ]; then
            echo "::error::PRODUCTION_HOST 시크릿이 비어 있습니다."
            missing=1
          fi
          if [ -z "${PRODUCTION_USER}" ]; then
            echo "::error::PRODUCTION_USER 시크릿이 비어 있습니다."
            missing=1
          fi
          if [ -z "${PRODUCTION_SSH_KEY}" ]; then
            echo "::error::PRODUCTION_SSH_KEY 시크릿이 비어 있습니다."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::필수 운영 SSH 시크릿이 없어 rollback 을 중단합니다."
            exit 1
          fi
          echo "✅ 시크릿 가드 통과 (SSH 키는 출력하지 않음)"

      - name: Remote rollback from LATEST
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master 2026-08-16 (v1.2.5+10) 고정 — server-time-sync.yml 과 동일
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script: |
            set -euo pipefail

            TARGET_HOST=onboarding-dev.core-solution.co.kr
            CONF=/etc/nginx/sites-available/onboarding-dev.core-solution.co.kr.conf
            ENABLED=/etc/nginx/sites-enabled/onboarding-dev.core-solution.co.kr.conf
            BACKUP_ROOT=/var/backups/nginx-onboarding-dev

            http_code() {
              curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$1" 2>/dev/null || echo "000"
            }

            latest="$(sudo cat "${BACKUP_ROOT}/LATEST" 2>/dev/null | tr -d '\r\n' || true)"
            if [ -z "$latest" ]; then
              echo "::error::${BACKUP_ROOT}/LATEST missing — nothing to restore"
              exit 1
            fi
            tsdir="${BACKUP_ROOT}/${latest}"
            if [ ! -d "$tsdir" ]; then
              echo "::error::Backup dir missing: $tsdir"
              exit 1
            fi

            echo "♻️ Rollback from LATEST=${latest} ($tsdir)"
            if [ -f "${tsdir}/had_conf" ] && grep -qx '1' "${tsdir}/had_conf" 2>/dev/null; then
              sudo cp -a "${tsdir}/onboarding-dev.core-solution.co.kr.conf" "$CONF"
              if [ -f "${tsdir}/enabled_symlink_target" ]; then
                tgt="$(tr -d '\r\n' < "${tsdir}/enabled_symlink_target")"
                if [ -n "$tgt" ]; then
                  sudo ln -sfn "$tgt" "$ENABLED"
                else
                  sudo ln -sfn "$CONF" "$ENABLED"
                fi
              else
                sudo ln -sfn "$CONF" "$ENABLED"
              fi
              echo "Restored previous dedicated conf"
            else
              echo "Backup had no dedicated conf — removing dedicated conf+symlink"
              sudo rm -f "$CONF" "$ENABLED"
            fi

            if ! sudo nginx -t 2>&1; then
              echo "::error::nginx -t failed after rollback restore"
              exit 1
            fi
            sudo systemctl reload nginx
            echo "✅ systemctl reload nginx (never restart)"

            echo "--- post-restore status ---"
            set +e
            curl -sS -o /tmp/onb-rb-info.json -w '%{http_code}'               --connect-timeout 10 --max-time 30               "https://${TARGET_HOST}/actuator/info" > /tmp/onb-rb-code.txt 2>/dev/null
            set -e
            echo "onboarding-dev /actuator/info HTTP $(cat /tmp/onb-rb-code.txt 2>/dev/null || echo 000)"
            if [ -s /tmp/onb-rb-info.json ]; then
              head -c 2000 /tmp/onb-rb-info.json; echo
            fi
            echo "app.core-solution.co.kr /actuator/health HTTP $(http_code "https://app.core-solution.co.kr/actuator/health")"
            echo "mindgarden.core-solution.co.kr /actuator/health HTTP $(http_code "https://mindgarden.core-solution.co.kr/actuator/health")"
            echo "✅ rollback complete"
