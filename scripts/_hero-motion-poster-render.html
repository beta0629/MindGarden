<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hero motion poster render</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="hero-canvas"></canvas>
    <script type="module">
      /**
       * Mirrors components/home/mountHero3D.ts first-frame pose:
       * POSTER_CAM / POSTER_LOOK_AT / FOV 30 / WingFold t=0 / AABB dolly-fit /
       * mobile top-pack (≤1023) / baked RoomEnvironment EXR / transparent.
       *
       * Query: ?vw=390&vh=844&panelW=390&panelH=226&mobile=1&dpr=2
       */
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
      import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';

      const SPHERE_FIT_MARGIN = 1.04;
      const HERO_FOV_DEG = 30;
      const POSTER_LOOK_AT = { x: 0, y: 0.15, z: 0.06 };
      const POSTER_CAM = { x: 0.12, y: 1.5, z: 1.95 };
      const YAW_SWAY_DEG = 0;
      const MOBILE_TOP_NDC = 0.9;
      const HERO_ENV_URL = '/public/assets/hero/hero-env-room.exr';
      const HERO_ENV_INTENSITY = 0.9;

      const params = new URLSearchParams(window.location.search);
      const panelW = Math.max(
        2,
        Number(params.get('panelW')) || window.innerWidth || 810,
      );
      const panelH = Math.max(
        2,
        Number(params.get('panelH')) || window.innerHeight || 470,
      );
      const dpr = Math.max(1, Math.min(2, Number(params.get('dpr')) || 2));
      const applyMobileFit =
        params.get('mobile') === '1' ||
        Number(params.get('vw') || panelW) <= 1023;

      window.__heroPosterReady = false;
      window.__heroPosterError = null;

      try {
        const canvas = document.getElementById('hero-canvas');
        const w = panelW;
        const h = panelH;

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: true,
          preserveDrawingBuffer: true,
          powerPreference: 'high-performance',
        });
        renderer.setPixelRatio(dpr);
        renderer.setSize(w, h, false);
        renderer.setClearColor(0x000000, 0);
        renderer.setClearAlpha(0);
        renderer.toneMapping = THREE.NeutralToneMapping;
        renderer.toneMappingExposure = 0.95;
        renderer.shadowMap.enabled = false;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = null;
        scene.add(new THREE.HemisphereLight(0xfff7ee, 0xd9cfbd, 0.6));
        const key = new THREE.DirectionalLight(0xfff3e6, 1.6);
        key.position.set(-1.2, 3.4, 0.6);
        scene.add(key);

        const cam = new THREE.PerspectiveCamera(HERO_FOV_DEG, w / h, 0.1, 50);
        const lookAt = new THREE.Vector3(
          POSTER_LOOK_AT.x,
          POSTER_LOOK_AT.y,
          POSTER_LOOK_AT.z,
        );
        const posterOffset = new THREE.Vector3(
          POSTER_CAM.x - POSTER_LOOK_AT.x,
          POSTER_CAM.y - POSTER_LOOK_AT.y,
          POSTER_CAM.z - POSTER_LOOK_AT.z,
        );
        let camDist = posterOffset.length();
        const posterDir = posterOffset.clone().normalize();

        const placePosterCam = (dist, yawRad = 0) => {
          const offset = posterDir.clone().multiplyScalar(dist);
          if (yawRad !== 0) {
            offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yawRad);
          }
          cam.position.copy(lookAt).add(offset);
          cam.lookAt(lookAt);
          cam.updateMatrixWorld(true);
        };
        placePosterCam(camDist);

        const draco = new DRACOLoader().setDecoderPath(
          '/public/vendor/draco/gltf/',
        );
        const loader = new GLTFLoader().setDRACOLoader(draco);
        const exrLoader = new EXRLoader();
        const [gltf, equirect] = await Promise.all([
          loader.loadAsync('/public/assets/hero/hero-butterfly.glb'),
          exrLoader.loadAsync(HERO_ENV_URL),
        ]);
        equirect.mapping = THREE.EquirectangularReflectionMapping;
        const pmrem = new THREE.PMREMGenerator(renderer);
        const envRT = pmrem.fromEquirectangular(equirect);
        scene.environment = envRT.texture;
        scene.environmentIntensity = HERO_ENV_INTENSITY;
        equirect.dispose();

        gltf.scene.traverse((obj) => {
          if (!obj.isMesh) return;
          obj.castShadow = false;
          obj.receiveShadow = false;
          const mats = Array.isArray(obj.material)
            ? obj.material
            : [obj.material];
          for (const mat of mats) {
            if (typeof mat.roughness === 'number') {
              mat.roughness = Math.min(mat.roughness, 0.65);
            }
          }
        });

        const tilt = new THREE.Group();
        tilt.add(gltf.scene);
        scene.add(tilt);

        const mixer = new THREE.AnimationMixer(gltf.scene);
        const clip = THREE.AnimationClip.findByName(gltf.animations, 'WingFold');
        const wingAction = clip ? mixer.clipAction(clip) : null;
        if (wingAction) wingAction.play();
        if (clip && wingAction) mixer.setTime(0);

        const _skipBoundsName = /antenna/i;
        const subjectBox = new THREE.Box3();
        const meshBox = new THREE.Box3();
        const corner = new THREE.Vector3();

        const refreshSubjectBounds = () => {
          tilt.updateMatrixWorld(true);
          subjectBox.makeEmpty();
          tilt.traverse((obj) => {
            if (_skipBoundsName.test(obj.name || '')) return;
            if (!obj.isMesh || !obj.geometry) return;
            if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
            meshBox
              .copy(obj.geometry.boundingBox)
              .applyMatrix4(obj.matrixWorld);
            subjectBox.union(meshBox);
          });
          if (subjectBox.isEmpty()) {
            subjectBox.set(
              new THREE.Vector3(-0.5, -0.5, -0.5),
              new THREE.Vector3(0.5, 0.5, 0.5),
            );
          }
        };

        const measureNdcBox = () => {
          refreshSubjectBounds();
          const { min, max } = subjectBox;
          const into = {
            halfX: 0,
            halfY: 0,
            minY: 1,
            maxY: -1,
            any: false,
          };
          for (let ix = 0; ix < 2; ix += 1) {
            for (let iy = 0; iy < 2; iy += 1) {
              for (let iz = 0; iz < 2; iz += 1) {
                corner.set(
                  ix ? max.x : min.x,
                  iy ? max.y : min.y,
                  iz ? max.z : min.z,
                );
                corner.project(cam);
                if (
                  !Number.isFinite(corner.x) ||
                  !Number.isFinite(corner.y) ||
                  !Number.isFinite(corner.z)
                ) {
                  continue;
                }
                if (corner.z < -1.05 || corner.z > 1.05) continue;
                if (Math.abs(corner.x) > 4 || Math.abs(corner.y) > 4) continue;
                into.halfX = Math.max(into.halfX, Math.abs(corner.x));
                into.halfY = Math.max(into.halfY, Math.abs(corner.y));
                into.minY = Math.min(into.minY, corner.y);
                into.maxY = Math.max(into.maxY, corner.y);
                into.any = true;
              }
            }
          }
          if (!into.any) {
            return { halfX: 0.5, halfY: 0.5, minY: -0.5, maxY: 0.5 };
          }
          return {
            halfX: into.halfX,
            halfY: into.halfY,
            minY: into.minY,
            maxY: into.maxY,
          };
        };

        {
          const fitTarget = 1 / SPHERE_FIT_MARGIN;
          const animSteps = clip ? 8 : 0;
          const duration = clip ? Math.max(clip.duration, 0.001) : 1;
          const yawMax = THREE.MathUtils.degToRad(YAW_SWAY_DEG);

          const measureFitHalf = () => {
            let half = 0;
            for (const yaw of [0, -yawMax, yawMax]) {
              placePosterCam(camDist, yaw);
              for (let s = 0; s <= animSteps; s += 1) {
                if (clip && wingAction) {
                  mixer.setTime((duration * s) / Math.max(animSteps, 1));
                }
                const ext = measureNdcBox();
                half = Math.max(half, ext.halfX, ext.halfY);
              }
            }
            if (clip && wingAction) mixer.setTime(0);
            return Math.max(half, 0.05);
          };

          placePosterCam(camDist);
          for (let i = 0; i < 4; i += 1) {
            const half = measureFitHalf();
            camDist = Math.max(0.4, camDist * (half / fitTarget));
          }
          placePosterCam(camDist);
          if (clip && wingAction) mixer.setTime(0);

          if (applyMobileFit) {
            const worldPerNdcY = () => {
              const dist = Math.max(cam.position.distanceTo(lookAt), 0.01);
              return dist * Math.tan(THREE.MathUtils.degToRad(cam.fov * 0.5));
            };
            const before = measureNdcBox();
            const shift = (MOBILE_TOP_NDC - before.maxY) * worldPerNdcY();
            lookAt.y -= Math.max(
              -camDist * 0.12,
              Math.min(camDist * 0.22, shift),
            );
            placePosterCam(camDist);
            const after = measureNdcBox();
            const half = Math.max(after.halfX, after.halfY, 0.05);
            if (half > fitTarget) {
              camDist = Math.max(0.4, camDist * (half / fitTarget));
              placePosterCam(camDist);
            }
            if (clip && wingAction) mixer.setTime(0);
          }
        }

        if (clip && wingAction) mixer.setTime(0);
        placePosterCam(camDist, 0);
        tilt.rotation.set(0, 0, 0);

        if (typeof renderer.compileAsync === 'function') {
          await renderer.compileAsync(scene, cam);
        }
        renderer.render(scene, cam);
        renderer.render(scene, cam);

        window.__heroPosterReady = true;
        window.__heroPosterMeta = {
          camDist,
          cssW: w,
          cssH: h,
          backingW: canvas.width,
          backingH: canvas.height,
          dpr,
          mobile: applyMobileFit,
          lookAtY: lookAt.y,
          env: HERO_ENV_URL,
        };

        envRT.dispose();
        pmrem.dispose();
      } catch (err) {
        window.__heroPosterError = String(err && err.stack ? err.stack : err);
      }
    </script>
  </body>
</html>
