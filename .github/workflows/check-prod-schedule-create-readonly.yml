# P0 INCIDENT RCA (2026-11-11 재학 제보) — 신규 내담자 일정 생성 500 (순수 읽기 전용)
# 트리거: workflow_dispatch 전용. push/PR/schedule 트리거 없음. 배포 워크플로 호출 없음.
# DB: scripts/ops/readonly/prod_schedule_create_rca.sql 를 READ ONLY 세션으로 실행 (SELECT 만, 쓰기 키워드 가드).
# 로그: appleboy/ssh-action + PRODUCTION_* 시크릿, grep/tail 만. 재시작·설정 변경·파일 쓰기·heal 금지.
# 출력: 전화번호·이메일 마스킹, 이름·본문·토큰 미출력.
# SSOT 2026-09-22: KST 11–19 예방성 prod DB 점검 금지 → force_incident=true(명시 장애) 일 때만 주간 실행.
name: 🔎 Check prod schedule create (read-only)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '조회일 (KST, yyyy-MM-dd)'
        required: true
        default: '2026-11-11'
      force_incident:
        description: 'KST 11–19 주간 스킵 가드 우회 (명시적 장애 대응만)'
        type: boolean
        default: false

concurrency:
  group: check-prod-schedule-create-readonly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  db-readonly:
    name: prod DB read-only SELECT
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Validate inputs + KST guard
        id: guard
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          FORCE_INCIDENT: ${{ inputs.force_incident }}
        run: |
          set -euo pipefail
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid date input"; exit 1; }
          HOUR=$((10#$(TZ=Asia/Seoul date +%H)))
          echo "Asia/Seoul hour=${HOUR} force_incident=${FORCE_INCIDENT}"
          if [ "$FORCE_INCIDENT" != "true" ] && [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST 11–19 preventive window — skip (exit 0)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Guard SQL is read-only
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          F=scripts/ops/readonly/prod_schedule_create_rca.sql
          if grep -v '^[[:space:]]*--' "$F" | grep -wiE 'INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE|GRANT|REVOKE|RENAME|LOAD|CALL|HANDLER|LOCK|SET'; then
            echo "::error::write/DDL keyword found in read-only SQL"; exit 1
          fi
          echo "read-only keyword guard: PASS"

      - name: Setup MySQL client
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Run read-only SELECT
        if: steps.guard.outputs.skip != 'true'
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          MYSQL_PWD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          DB_HOST="${PRODUCTION_DB_HOST:-${PRODUCTION_HOST:-}}"
          [ -n "$DB_HOST" ] && [ -n "${DB_USER:-}" ] && [ -n "${DB_NAME:-}" ] && [ -n "${MYSQL_PWD:-}" ] || { echo "::error::DB secrets missing"; exit 1; }
          echo "::add-mask::$DB_HOST"; echo "::add-mask::$DB_USER"
          sed -e "s/__TARGET_DATE__/${TARGET_DATE}/g" scripts/ops/readonly/prod_schedule_create_rca.sql > /tmp/rca.sql
          mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
            --init-command="SET SESSION TRANSACTION READ ONLY" \
            --default-character-set=utf8mb4 --force -t < /tmp/rca.sql 2>&1 \
            | sed -E 's/(01[016789])[- ]?[0-9]{3,4}[- ]?([0-9]{4})/\1-****-\2/g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g'

  logs-readonly:
    name: prod app log grep (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate input
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid date"; exit 1; }
      - name: Grep schedule-create logs (production)
        uses: appleboy/ssh-action@master
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 4m
          script_stop: false
          envs: TARGET_DATE
          script: |
            set +e
            mask() { sed -E 's/(01[016789])[- ]?[0-9]{3,4}[- ]?([0-9]{4})/\1-****-\2/g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g; s/(Duplicate entry )'"'"'[^'"'"']*'"'"'/\1'"'"'***'"'"'/g' | cut -c1-500; }
            sec() { echo; echo "=================== $1"; }
            PAT='스케줄 생성|스케줄 엔티티 생성|스케줄 저장 완료|회기 사용 처리|유효한 매칭|가예약|회기 수 검증|schedules/consultant|RUNTIME_ERROR|INTERNAL_SERVER_ERROR|UNEXPECTED_ERROR|DATA_INTEGRITY|SCHEDULE_'
            # 20:00–20:59 KST 또는 11:00–11:59 UTC 모두 포함 (로그 TZ 미확정)
            TW="${TARGET_DATE}[ T](20|11):[0-5][0-9]"
            sec "log files"; sudo -n ls -la --time-style=full-iso /var/log/mindgarden/ 2>/dev/null | grep -E 'core-' | head -20
            sec "server date"; date; date -u
            for c in blue green; do
              for f in /var/log/mindgarden/core-$c.log /var/log/mindgarden/core-$c-error.log; do
                sec "$f (window, pattern)"
                sudo -n grep -aE "$TW" "$f" 2>/dev/null | grep -aE "$PAT" | mask | tail -n 150
                sec "$f (window, ERROR + stack frames)"
                sudo -n grep -aE -A 60 "$TW.*(ERROR|RUNTIME_ERROR|INTERNAL_SERVER_ERROR)" "$f" 2>/dev/null \
                  | grep -aE "$TW|Caused by|Exception|at com\.coresolution" | grep -avE 'at com\.coresolution\.[a-z.]*\$\$|CGLIB' | mask | tail -n 200
              done
            done
            for u in mindgarden-core-blue.service mindgarden-core-green.service; do
              sec "journalctl $u (11:00–20:59 local, pattern + stack)"
              sudo -n journalctl -u "$u" --since "$TARGET_DATE 11:00" --until "$TARGET_DATE 20:59:59" --no-pager 2>/dev/null \
                | grep -aE "$PAT|Caused by|Exception|at com\.coresolution" | mask | tail -n 250
            done
