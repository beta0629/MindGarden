# 운영 헬스·디스크·로그 디렉터리 스냅샷 (읽기 전용)
# deploy-production.yml 과 트리거·책임 분리 — 배포 파이프라인에서 호출하지 않음.
# 스케줄·기본 dispatch 는 스냅샷만 실행. 로그 실삭제(cleanup)는 이 워크플로에서 호출하지 않음.
# 권장: 동일 스크립트를 서버 cron/systemd timer 로 배치해 Runner 장애와 무관하게 점검.
#
# Optional: workflow_dispatch input diagnose_consultation_session=true → 상담일지/세션 불일치
# 로그·DB 읽기 전용 프로브 (정설아 등 사건 조사). 스케줄 cron 에는 영향 없음.

name: 🩺 운영 코어·OPS 헬스 스냅샷

on:
  workflow_dispatch:
    inputs:
      diagnose_consultation_session:
        description: 'true 이면 상담일지 sessionNumber 불일치 로그·DB 읽기 전용 진단만 실행'
        required: false
        default: 'false'
      since:
        description: 'journalctl --since (diagnose 모드)'
        required: false
        default: '2026-09-10 00:00:00'
      until:
        description: 'journalctl --until (diagnose 모드)'
        required: false
        default: '2026-09-11 23:59:59'
      client_name:
        description: '내담자 표시명 (diagnose 모드, PII 주의)'
        required: false
        default: '정설아'
  schedule:
    # 5분 간격 헬스 폴링 (운영 헬스 DOWN 알람용). 외부 uptime monitor (UptimeRobot/BetterStack) 가
    # 등록되어 있으면 본 cron 빈도를 다시 줄여(예: 0 0,12 * * *) GitHub Actions 무료 한도와 충돌하지
    # 않게 한다. 자세한 권고: docs/운영반영/UPTIME_MONITOR_RECOMMENDATION.md
    - cron: '*/5 * * * *'

concurrency:
  group: ops-health-snapshot-${{ github.event.inputs.diagnose_consultation_session || 'snapshot' }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: 원격 스냅샷
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.diagnose_consultation_session != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # /tmp 직접 덮어쓰기 시 root 소유 파일 등으로 untar 실패할 수 있어, run_id 별 전용 디렉터리 사용.
      # scp-action: strip_components: 2 → target 아래 prod-health-snapshot.sh 로 평탄화.
      - name: 스냅샷 업로드용 원격 디렉터리 준비
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            RUN_DIR="/tmp/mg-health-snapshot/${{ github.run_id }}"
            mkdir -p "$RUN_DIR"
            chmod 700 "$RUN_DIR"
            rm -f /tmp/prod-health-snapshot.sh || true

      - name: 스냅샷 스크립트 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          source: scripts/ops/prod-health-snapshot.sh
          target: /tmp/mg-health-snapshot/${{ github.run_id }}/
          strip_components: 2
          overwrite: true

      - name: 원격에서 스냅샷 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -euo pipefail
            SNAPSHOT_SH="/tmp/mg-health-snapshot/${{ github.run_id }}/prod-health-snapshot.sh"
            if [ ! -f "$SNAPSHOT_SH" ]; then
              SNAPSHOT_SH="/tmp/prod-health-snapshot.sh"
            fi
            if [ ! -f "$SNAPSHOT_SH" ]; then
              SNAPSHOT_SH="/tmp/scripts/ops/prod-health-snapshot.sh"
            fi
            if [ ! -f "$SNAPSHOT_SH" ]; then
              echo "::error::스냅샷 스크립트를 찾을 수 없습니다. run_id 디렉터리·/tmp·scp 경로 보존 여부를 확인하세요."
              ls -la "/tmp/mg-health-snapshot/${{ github.run_id }}/" 2>/dev/null || true
              ls -la /tmp/ 2>/dev/null || true
              ls -la /tmp/scripts/ops/ 2>/dev/null || true
              exit 1
            fi
            chmod +x "$SNAPSHOT_SH" 2>/dev/null || true
            bash "$SNAPSHOT_SH"

      # 헬스 응답 분기 — 200 OK 가 아니거나 actuator body 의 status:DOWN 이면 다음 step 에서 Discord 발사.
      # 정상 응답 시 본 step 도 success → Discord step 은 if 조건으로 skip 됨 (5분 cron 노이즈 방지).
      - name: 운영 헬스 응답 확인 (DOWN 분기)
        id: health_check
        continue-on-error: true
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 30s
          script: |
            set -u
            HEALTH_URL="${MG_HEALTH_URL:-http://127.0.0.1:8080/actuator/health}"
            HTTP_CODE=$(curl -sS -o /tmp/mg-health-body.txt -w '%{http_code}' \
              --connect-timeout 10 "$HEALTH_URL" 2>/dev/null || echo "000")
            echo "HEALTH_HTTP_CODE=${HTTP_CODE}"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::헬스 HTTP 비정상 ($HTTP_CODE)"
              exit 1
            fi
            BODY=$(cat /tmp/mg-health-body.txt 2>/dev/null || echo "")
            if echo "$BODY" | grep -qiE '"status"[[:space:]]*:[[:space:]]*"DOWN"'; then
              echo "::warning::헬스 body 가 DOWN — $BODY"
              exit 2
            fi
            echo "헬스 OK"

      # secrets 직접 if 비교는 GitHub Actions 에서 평가되지 않으므로 env 로 받고 step 안에서 -z 검사.
      - name: Discord 알람 발사 (헬스 DOWN/비정상만)
        if: ${{ steps.health_check.outcome == 'failure' }}
        env:
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          if [ -z "${DISCORD_OPS_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_OPS_WEBHOOK_URL secret 미설정 — Discord 발송 skip (워크플로는 정상 종료)"
            exit 0
          fi
          CONTENT=$(printf '🚨 [Ops] 운영 헬스 응답 비정상 — run #%s\n• run: %s\n• workflow: %s\n• branch: %s' \
            "${GITHUB_RUN_ID}" "${RUN_URL}" "${GITHUB_WORKFLOW}" "${GITHUB_REF_NAME}")
          PAYLOAD=$(jq -nc --arg content "$CONTENT" '{content: $content}')
          HTTP_CODE=$(curl -fsS -o /tmp/discord-curl.out -w '%{http_code}' \
            -X POST "$DISCORD_OPS_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "Discord 발송 OK (HTTP $HTTP_CODE)"
          else
            echo "Discord 발송 실패 (HTTP $HTTP_CODE)"
            cat /tmp/discord-curl.out 2>/dev/null || true
            # 알람 실패가 본 워크플로의 다른 step 결과를 가리지 않도록 exit 0
            exit 0
          fi

  diagnose_consultation_session:
    name: 상담일지 세션 불일치 진단 (읽기 전용)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.diagnose_consultation_session == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: SSH diagnose production (logs + read-only DB)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 280s
          script: |
            set +e
            SINCE='${{ github.event.inputs.since }}'
            UNTIL='${{ github.event.inputs.until }}'
            CLIENT_NAME='${{ github.event.inputs.client_name }}'
            echo "=========================================="
            echo "Diagnose prod consultation session mismatch"
            echo "since=$SINCE until=$UNTIL client=$CLIENT_NAME"
            echo "READ-ONLY — no UPDATE/DELETE/INSERT"
            echo "=========================================="

            echo ""
            echo "1) Active units / slots"
            echo "=========================================="
            systemctl is-active mindgarden-core-blue.service mindgarden-core-green.service 2>/dev/null
            for u in mindgarden-core-blue.service mindgarden-core-green.service; do
              echo "--- $u ---"
              systemctl show "$u" -p ActiveState -p SubState -p MainPID --no-pager 2>/dev/null
            done

            echo ""
            echo "2) Log file inventory"
            echo "=========================================="
            ls -lah /var/log/mindgarden/ 2>/dev/null | head -40 || echo "(no /var/log/mindgarden)"

            redact() {
              sed -E \
                -e 's/(password|passwd|secret|token|api[_-]?key|authorization|bearer|jwt)[=:][^ ,)}\]"]*/\1=***/gi' \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/**email**/g' \
                -e 's/Bearer [A-Za-z0-9._-]+/Bearer ***/g' \
                -e 's/[0-9]{6}-[0-9]{7}/**rrn**/g'
            }

            SEARCH_RE='세션|sessionNumber|sessionSequence|회기수|상담일지|ConsultationRecord|consultationId|mappingId|ValidationException|일치하지 않|불일치|'"$CLIENT_NAME"

            echo ""
            echo "3) journalctl blue+green (filtered)"
            echo "=========================================="
            for u in mindgarden-core-blue.service mindgarden-core-green.service; do
              echo "=== journalctl -u $u ==="
              sudo journalctl -u "$u" --since "$SINCE" --until "$UNTIL" --no-pager 2>/dev/null \
                | grep -E "$SEARCH_RE" \
                | redact \
                | tail -n 400 \
                || echo "(no matches for $u)"
              echo ""
            done

            echo ""
            echo "4) application.log filtered"
            echo "=========================================="
            for f in \
              /var/log/mindgarden/application.log \
              /var/log/mindgarden/application.log.1 \
              /var/log/mindgarden/coresolution.log \
              /var/log/mindgarden/error.log
            do
              if sudo test -f "$f"; then
                echo "=== file: $f ==="
                sudo grep -E "$SEARCH_RE" "$f" 2>/dev/null \
                  | grep -E '2026-09-1[01]|2025-09-1[01]|09-1[01]' \
                  | redact \
                  | tail -n 300 \
                  || echo "(no dated matches)"
                echo "--- last 80 matching lines (any date) ---"
                sudo grep -E "$SEARCH_RE" "$f" 2>/dev/null | redact | tail -n 80 || true
              fi
            done
            if sudo test -d /var/log/mindgarden; then
              for f in $(sudo ls /var/log/mindgarden/*2026-09-1* /var/log/mindgarden/*2025-09-1* 2>/dev/null); do
                echo "--- $f ---"
                sudo grep -E "$SEARCH_RE" "$f" 2>/dev/null | redact | tail -n 200 || true
              done
            fi

            echo ""
            echo "5) ERROR/WARN consultation-related"
            echo "=========================================="
            for u in mindgarden-core-blue.service mindgarden-core-green.service; do
              echo "=== $u ERROR/WARN ==="
              sudo journalctl -u "$u" --since "$SINCE" --until "$UNTIL" -p err..warning --no-pager 2>/dev/null \
                | grep -iE 'consult|session|일지|회기|Validation|Illegal|Exception' \
                | redact \
                | tail -n 200 \
                || echo "(none)"
            done

            echo ""
            echo "6) Read-only DB probe"
            echo "=========================================="
            ACTIVE_UNIT=""
            for u in mindgarden-core-blue.service mindgarden-core-green.service; do
              st=$(systemctl is-active "$u" 2>/dev/null || echo inactive)
              if [ "$st" = "active" ]; then
                ACTIVE_UNIT="$u"
                break
              fi
            done
            if [ -z "$ACTIVE_UNIT" ]; then
              ACTIVE_UNIT="mindgarden-core-blue.service"
            fi
            echo "ACTIVE_UNIT=$ACTIVE_UNIT"

            ENV_FILE=$(systemctl show "$ACTIVE_UNIT" -p EnvironmentFiles --value 2>/dev/null | awk '{print $1}' | tr -d "'")
            for candidate in \
              "$ENV_FILE" \
              /etc/mindgarden/prod.env \
              /etc/mindgarden/prod-from-dev.env \
              /etc/mindgarden/application-prod.env \
              /var/www/mindgarden/shared/prod.env
            do
              if [ -n "$candidate" ] && sudo test -f "$candidate"; then
                set -a
                eval "$(sudo grep -E '^DB_(HOST|PORT|NAME|USERNAME|PASSWORD)=' "$candidate" 2>/dev/null | sed 's/\r$//')"
                set +a
                echo "Loaded DB_* from: $candidate (values not printed)"
                break
              fi
            done

            if [ -z "${DB_HOST:-}" ] || [ -z "${DB_USERNAME:-}" ] || [ -z "${DB_NAME:-}" ]; then
              while IFS= read -r part; do
                case "$part" in
                  DB_HOST=*|DB_PORT=*|DB_NAME=*|DB_USERNAME=*|DB_PASSWORD=*)
                    export "$part"
                    ;;
                esac
              done < <(systemctl show "$ACTIVE_UNIT" -p Environment --value 2>/dev/null | tr ' ' '\n')
            fi

            echo "DB_HOST=${DB_HOST:-(empty)} DB_NAME=${DB_NAME:-(empty)} DB_USER=${DB_USERNAME:-(empty)} DB_PORT=${DB_PORT:-3306}"

            if command -v mysql >/dev/null 2>&1 && [ -n "${DB_HOST:-}" ] && [ -n "${DB_USERNAME:-}" ] && [ -n "${DB_NAME:-}" ]; then
              MYSQL=(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USERNAME" -p"${DB_PASSWORD}" "$DB_NAME" -N -B)
              echo "--- users matching name ---"
              "${MYSQL[@]}" -e "
                SELECT id, tenant_id, role,
                       CONCAT(LEFT(IFNULL(name,''),1),'**') AS name_masked,
                       is_deleted
                FROM users
                WHERE name LIKE CONCAT('%', '${CLIENT_NAME}', '%')
                LIMIT 20;
              " 2>/dev/null | redact || echo "(users query failed or empty)"

              echo "--- schedules 2026-09-10 / 2025-09-10 ---"
              "${MYSQL[@]}" -e "
                SELECT s.id, s.tenant_id, s.client_id, s.consultant_id,
                       s.date, s.start_time, s.end_time, s.status,
                       s.session_sequence, s.mapping_id, s.is_deleted
                FROM schedules s
                INNER JOIN users u ON u.id = s.client_id
                WHERE u.name LIKE CONCAT('%', '${CLIENT_NAME}', '%')
                  AND s.date IN ('2026-09-10','2025-09-10')
                ORDER BY s.date, s.start_time;
              " 2>/dev/null | redact || echo "(schedules query failed or empty)"

              echo "--- consultation_records ---"
              "${MYSQL[@]}" -e "
                SELECT cr.id, cr.tenant_id, cr.consultation_id, cr.client_id, cr.consultant_id,
                       cr.session_number, cr.session_date, cr.is_deleted, cr.created_at, cr.updated_at
                FROM consultation_records cr
                INNER JOIN users u ON u.id = cr.client_id
                WHERE u.name LIKE CONCAT('%', '${CLIENT_NAME}', '%')
                  AND (
                    cr.session_date IN ('2026-09-10','2025-09-10')
                    OR cr.consultation_id IN (
                      SELECT s.id FROM schedules s
                      INNER JOIN users u2 ON u2.id = s.client_id
                      WHERE u2.name LIKE CONCAT('%', '${CLIENT_NAME}', '%')
                        AND s.date IN ('2026-09-10','2025-09-10')
                    )
                  )
                ORDER BY cr.session_date, cr.session_number, cr.id;
              " 2>/dev/null | redact || echo "(consultation_records query failed or empty)"

              echo "--- mappings ---"
              "${MYSQL[@]}" -e "
                SELECT m.id, m.tenant_id, m.client_id, m.consultant_id, m.status,
                       m.total_sessions, m.used_sessions, m.remaining_sessions,
                       m.is_deleted
                FROM consultant_client_mappings m
                INNER JOIN users u ON u.id = m.client_id
                WHERE u.name LIKE CONCAT('%', '${CLIENT_NAME}', '%')
                ORDER BY m.id DESC
                LIMIT 20;
              " 2>/dev/null | redact || echo "(mappings query failed)"
            else
              echo "SKIP DB: mysql client missing or DB_* not resolved"
            fi

            unset DB_PASSWORD DB_USERNAME DB_HOST DB_NAME DB_PORT
            echo "DONE (read-only)"
