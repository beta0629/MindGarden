# 추가 패키지 병합 회기 보정 + 상담료 INCOME 매출 취소(#1493).
#
# 트리거는 workflow_dispatch 하나뿐이다. push·pull_request·schedule 로는 어떤 잡도 돌지 않는다.
# workflow_dispatch 는 이 파일이 기본 브랜치(main)에 있어야 실행 버튼이 생긴다.
#
# 운영 DB 에 쓸 수 있는 잡(prod-repair, prod-income-apply)은 모두
#   - job if: github.event_name == 'workflow_dispatch'
#   - environment: production-data-fix (required reviewers 승인 후 시작)
#   - 첫 단계에서 이벤트·CONFIRM·KST 11:00–20:00 거부·환경 승인자 존재를 DB 접속 전에 확인
# 을 거친다. runner 도 apply 에서 GITHUB_EVENT_NAME 과 CONFIRM 을 다시 확인한다.
#
# 대상 id·금액·테넌트·사유는 커밋된 파일만 쓴다. 입력으로 id 를 받지 않는다.
#   회기: additional-package-merged-session-repair-allowlist-prod.txt, triggers/additional_package_merged_session_repair.env
#   INCOME: income-sales-cancel-allowlist-prod.txt, income-sales-cancel-denylist.txt, triggers/income_sales_cancel_prod.env

name: 추가 패키지 병합 회기 보정 · INCOME 매출 취소 (dispatch 전용)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'session = 회기 보정, income = 상담료 INCOME 매출 취소'
        type: choice
        options: [session, income]
        default: income
      income_mode:
        description: 'probe = 운영 읽기 전용, backup = 운영 백업 + 전값 스냅샷, apply = 승인 후 백업→적용→재조회, dev-dry-run = DEV ROLLBACK'
        type: choice
        options: [probe, backup, apply, dev-dry-run]
        default: probe
      confirm:
        description: '운영 apply 에만. 정확히 CONFIRM'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: additional-package-merged-session-repair
  cancel-in-progress: false

jobs:
  prod-repair:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'session'
    runs-on: ubuntu-latest
    environment: production-data-fix
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: 이벤트·KST 가드 (DB 접속 전)
        id: kst_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::prod repair runs only from workflow_dispatch"
            exit 1
          fi
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul hour=${HOUR}"
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::error::KST ${HOUR}:00 is within 11:00-20:00. No database connection."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment approval guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ops/assert_environment_required_reviewers.sh production-data-fix

      - name: Load prod trigger and allowlist
        id: gate
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          F=scripts/ops/triggers/additional_package_merged_session_repair.env
          A=scripts/ops/additional-package-merged-session-repair-allowlist-prod.txt
          test -f "$F"
          test -f "$A"
          get_kv() {
            local key="$1"
            local line
            line="$(grep -E "^${key}=" "$F" | tail -n 1 || true)"
            printf '%s' "${line#*=}" | sed -e "s/^['\"]//" -e "s/['\"]$//"
          }
          MODE="$(get_kv MODE)"
          CONFIRM="$(get_kv CONFIRM)"
          MODE="${MODE:-dry-run}"
          if [ "$MODE" != "dry-run" ] && [ "$MODE" != "apply" ]; then
            echo "::error::MODE must be dry-run or apply"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && { [ "$CONFIRM" != "CONFIRM" ] || [ "$INPUT_CONFIRM" != "CONFIRM" ]; }; then
            echo "::error::apply requires CONFIRM=CONFIRM in the trigger file and the confirm input"
            exit 1
          fi
          DATA="$(grep -E '^[0-9]+,[0-9]+[[:space:]]*$' "$A" || true)"
          if [ -z "$DATA" ]; then
            echo "허용 목록이 비어 있어 보정은 수행하지 않습니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "apply" ]; then
            echo "confirm=CONFIRM" >> "$GITHUB_OUTPUT"
          else
            echo "confirm=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup MySQL client
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Repair transaction
        if: steps.gate.outputs.skip != 'true'
        env:
          DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          DB_HOST_FALLBACK: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          REPAIR_CONFIRM: ${{ steps.gate.outputs.confirm }}
          REPAIR_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST:-}" ]; then DB_HOST="${DB_HOST_FALLBACK:-}"; fi
          for name in DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production DB secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          export DB_HOST DB_USER DB_NAME DB_PASSWORD REPAIR_CONFIRM
          chmod +x scripts/ops/additional_package_merged_session_runner.sh
          scripts/ops/additional_package_merged_session_runner.sh repair \
            --allowlist scripts/ops/additional-package-merged-session-repair-allowlist-prod.txt \
            --mode "$REPAIR_MODE" \
            --backup-dir "${RUNNER_TEMP}/additional-package-session-backup"

      - name: Upload backup artifact
        if: steps.gate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: additional-package-session-backup-prod-${{ github.run_id }}
          path: ${{ runner.temp }}/additional-package-session-backup
          if-no-files-found: ignore

  dev-repair:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'session'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load DEV trigger
        id: gate
        run: |
          set -euo pipefail
          F=scripts/ops/triggers/additional_package_merged_session_repair_dev.env
          test -f "$F"
          get_kv() {
            local key="$1"
            local line
            line="$(grep -E "^${key}=" "$F" | tail -n 1 || true)"
            printf '%s' "${line#*=}" | sed -e "s/^['\"]//" -e "s/['\"]$//"
          }
          MODE="$(get_kv MODE)"
          CONFIRM="$(get_kv CONFIRM)"
          MODE="${MODE:-dry-run}"
          if [ "$MODE" != "dry-run" ] && [ "$MODE" != "apply" ]; then
            echo "::error::MODE must be dry-run or apply"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "CONFIRM" ]; then
            echo "::error::apply requires CONFIRM=CONFIRM in the DEV trigger file"
            exit 1
          fi
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          if [ "$MODE" = "apply" ] && [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST ${HOUR}:00 is in 11–19. DEV apply is skipped until 20:00 KST."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$CONFIRM" = "CONFIRM" ]; then
            echo "confirm=CONFIRM" >> "$GITHUB_OUTPUT"
          else
            echo "confirm=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup MySQL client
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Repair transaction on DEV
        if: steps.gate.outputs.skip != 'true'
        env:
          JUMP_HOST: ${{ secrets.DEV_SERVER_HOST }}
          JUMP_USER: ${{ secrets.DEV_SERVER_USER }}
          JUMP_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DB_USER: ${{ secrets.DEV_DB_USER }}
          DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          REPAIR_CONFIRM: ${{ steps.gate.outputs.confirm }}
          REPAIR_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          for name in JUMP_HOST JUMP_USER JUMP_KEY DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required DEV secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          # shellcheck disable=SC1091
          source scripts/ops/dev_db_tunnel_open.sh
          export REPAIR_CONFIRM
          chmod +x scripts/ops/additional_package_merged_session_runner.sh
          scripts/ops/additional_package_merged_session_runner.sh repair \
            --allowlist scripts/ops/additional-package-merged-session-repair-allowlist-dev.txt \
            --mode "$REPAIR_MODE" \
            --backup-dir "${RUNNER_TEMP}/additional-package-session-backup"

      - name: Upload backup artifact
        if: steps.gate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: additional-package-session-backup-dev-${{ github.run_id }}
          path: ${{ runner.temp }}/additional-package-session-backup
          if-no-files-found: ignore

  prod-income-read:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'income' && (inputs.income_mode == 'probe' || inputs.income_mode == 'backup')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: income-sales-cancel-prod
      cancel-in-progress: false
    steps:
      - name: KST 운영 시간 가드 (11:00–20:00 실패, 우회 없음)
        run: |
          set -euo pipefail
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul hour=${HOUR}"
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::error::KST ${HOUR}:00 is within 11:00-20:00. No database connection. Re-run after 20:00 KST."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Read-only recheck (income targets, precedent, journal)
        env:
          DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          DB_HOST_FALLBACK: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST:-}" ]; then DB_HOST="${DB_HOST_FALLBACK:-}"; fi
          for name in DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production DB secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          export DB_HOST DB_USER DB_NAME DB_PASSWORD
          unset REPAIR_CONFIRM INCOME_CANCEL_CONFIRM || true
          chmod +x scripts/ops/additional_package_merged_session_runner.sh
          scripts/ops/additional_package_merged_session_runner.sh income-probe \
            --allowlist scripts/ops/income-sales-cancel-allowlist-prod.txt \
            --precedent scripts/ops/income-sales-cancel-precedent.txt \
            --denylist scripts/ops/income-sales-cancel-denylist.txt \
            --tenant-env scripts/ops/triggers/income_sales_cancel_prod.env

      - name: Backup and before snapshot (no write)
        if: inputs.income_mode == 'backup'
        env:
          DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          DB_HOST_FALLBACK: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST:-}" ]; then DB_HOST="${DB_HOST_FALLBACK:-}"; fi
          for name in DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production DB secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          export DB_HOST DB_USER DB_NAME DB_PASSWORD
          unset REPAIR_CONFIRM INCOME_CANCEL_CONFIRM || true
          scripts/ops/additional_package_merged_session_runner.sh income-cancel --mode backup \
            --allowlist scripts/ops/income-sales-cancel-allowlist-prod.txt \
            --denylist scripts/ops/income-sales-cancel-denylist.txt \
            --tenant-env scripts/ops/triggers/income_sales_cancel_prod.env \
            --backup-dir "${RUNNER_TEMP}/income-sales-cancel-backup"

      - name: Upload income backup artifact
        if: inputs.income_mode == 'backup'
        uses: actions/upload-artifact@v4
        with:
          name: income-sales-cancel-backup-prod-${{ github.run_id }}
          path: ${{ runner.temp }}/income-sales-cancel-backup
          if-no-files-found: error

  prod-income-apply-refused:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'income' && inputs.income_mode == 'apply' && inputs.confirm != 'CONFIRM'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse apply without CONFIRM (no database connection)
        run: |
          echo "::error::income apply requires the confirm input to be exactly CONFIRM"
          exit 1

  prod-income-apply:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'income' && inputs.income_mode == 'apply' && inputs.confirm == 'CONFIRM'
    runs-on: ubuntu-latest
    environment: production-data-fix
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    concurrency:
      group: income-sales-cancel-prod
      cancel-in-progress: false
    steps:
      - name: 이벤트·CONFIRM·KST 가드 (DB 접속 전, 우회 없음)
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::income apply runs only from workflow_dispatch"
            exit 1
          fi
          if [ "$INPUT_CONFIRM" != "CONFIRM" ]; then
            echo "::error::income apply requires CONFIRM"
            exit 1
          fi
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul hour=${HOUR}"
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::error::KST ${HOUR}:00 is within 11:00-20:00. No database connection. Re-run after 20:00 KST."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment approval guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ops/assert_environment_required_reviewers.sh production-data-fix

      - name: Setup MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Backup and before snapshot (no write)
        env:
          DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          DB_HOST_FALLBACK: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST:-}" ]; then DB_HOST="${DB_HOST_FALLBACK:-}"; fi
          for name in DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production DB secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          export DB_HOST DB_USER DB_NAME DB_PASSWORD
          chmod +x scripts/ops/additional_package_merged_session_runner.sh
          scripts/ops/additional_package_merged_session_runner.sh income-cancel --mode backup \
            --allowlist scripts/ops/income-sales-cancel-allowlist-prod.txt \
            --denylist scripts/ops/income-sales-cancel-denylist.txt \
            --tenant-env scripts/ops/triggers/income_sales_cancel_prod.env \
            --backup-dir "${RUNNER_TEMP}/income-sales-cancel-backup"

      - name: Upload income backup artifact (must succeed before apply)
        uses: actions/upload-artifact@v4
        with:
          name: income-sales-cancel-backup-prod-${{ github.run_id }}
          path: ${{ runner.temp }}/income-sales-cancel-backup
          if-no-files-found: error

      - name: Apply (one transaction, COMMIT only if every assert passes)
        env:
          DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          DB_HOST_FALLBACK: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          INCOME_CANCEL_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST:-}" ]; then DB_HOST="${DB_HOST_FALLBACK:-}"; fi
          for name in DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production DB secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          export DB_HOST DB_USER DB_NAME DB_PASSWORD INCOME_CANCEL_CONFIRM
          scripts/ops/additional_package_merged_session_runner.sh income-cancel --mode apply \
            --allowlist scripts/ops/income-sales-cancel-allowlist-prod.txt \
            --denylist scripts/ops/income-sales-cancel-denylist.txt \
            --tenant-env scripts/ops/triggers/income_sales_cancel_prod.env \
            --backup-dir "${RUNNER_TEMP}/income-sales-cancel-backup"

      - name: Readback in a new read-only session
        env:
          DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          DB_HOST_FALLBACK: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST:-}" ]; then DB_HOST="${DB_HOST_FALLBACK:-}"; fi
          for name in DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production DB secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          export DB_HOST DB_USER DB_NAME DB_PASSWORD
          unset INCOME_CANCEL_CONFIRM || true
          scripts/ops/additional_package_merged_session_runner.sh income-cancel-verify --expect after \
            --allowlist scripts/ops/income-sales-cancel-allowlist-prod.txt \
            --denylist scripts/ops/income-sales-cancel-denylist.txt \
            --tenant-env scripts/ops/triggers/income_sales_cancel_prod.env \
            --backup-dir "${RUNNER_TEMP}/income-sales-cancel-backup"

  dev-income-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'income' && inputs.income_mode == 'dev-dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: DEV backup, ROLLBACK dry-run, new-session readback
        env:
          JUMP_HOST: ${{ secrets.DEV_SERVER_HOST }}
          JUMP_USER: ${{ secrets.DEV_SERVER_USER }}
          JUMP_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DB_USER: ${{ secrets.DEV_DB_USER }}
          DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for name in JUMP_HOST JUMP_USER JUMP_KEY DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required DEV secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          # shellcheck disable=SC1091
          source scripts/ops/dev_db_tunnel_open.sh
          unset INCOME_CANCEL_CONFIRM || true
          R=scripts/ops/additional_package_merged_session_runner.sh
          chmod +x "$R"
          ARGS=(--allowlist scripts/ops/income-sales-cancel-allowlist-prod.txt
                --denylist scripts/ops/income-sales-cancel-denylist.txt
                --tenant-env scripts/ops/triggers/income_sales_cancel_prod.env
                --backup-dir "${RUNNER_TEMP}/income-sales-cancel-backup-dev")
          "$R" income-cancel --mode backup "${ARGS[@]}"
          "$R" income-cancel --mode dry-run "${ARGS[@]}"
          "$R" income-cancel-verify --expect before "${ARGS[@]}"
