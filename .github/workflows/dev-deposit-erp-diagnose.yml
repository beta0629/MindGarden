# 입금 확인 422 후 INCOME 잔존 원인 진단 — 개발 전용·읽기 전용
#
# 목적: POST /mappings/{id}/confirm-deposit 이 422 MAPPING_ERP_SYNC_FAILED 를 돌려줬는데도
#       financial_transactions INCOME 행이 남은 원인을 가리기 위해, 지정한 시간 구간의 개발 서버
#       journald/앱 로그를 grep 하고 개발 DB 를 SELECT 만 한다.
#
# 안전 장치 (consultation-log-duplicate-count.yml 과 같은 방식):
#   - workflow_dispatch 전용. push/pull_request 트리거 없음.
#   - 개발 서버(DEV_* secret)만 대상. 운영 서버·운영 DB 를 가리키는 입력 없음.
#   - 서버에서 journalctl/grep/systemctl show/ps 읽기만 한다. 재기동·파일 쓰기·힐 없음.
#   - DB 는 SELECT 만, mysql 세션을 --init-command 로 READ ONLY 고정. SQL 은 이 파일에 고정,
#     입력은 정규식으로 검증된 숫자·시각만 들어간다.
#   - 호스트·계정·DB 이름·비밀번호는 secret. 비밀번호는 stdin 스크립트로만 넘긴다(ps 노출 방지).
#   - 설정 grep 은 연결 처리 관련 키(handling_mode/release_mode/provider_disables_autocommit/auto-commit)만
#     출력하고, 그 외 환경변수 값은 출력하지 않는다.
name: 입금 확인 ERP 진단 (읽기 전용·개발)

on:
  workflow_dispatch:
    inputs:
      since:
        description: '로그 시작 시각 (KST, YYYY-MM-DD HH:MM)'
        required: true
        default: '2026-10-06 12:40'
      until:
        description: '로그 끝 시각 (KST, YYYY-MM-DD HH:MM)'
        required: true
        default: '2026-10-06 12:50'
      mapping_ids:
        description: '매칭 ID (쉼표 구분 숫자)'
        required: true
        default: '315,314'
      context_lines:
        description: '실패 로그 뒤 스택 줄 수 (-A)'
        required: true
        default: '80'

permissions:
  contents: read

concurrency:
  group: dev-deposit-erp-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 입력 검증
        env:
          IN_SINCE: ${{ inputs.since }}
          IN_UNTIL: ${{ inputs.until }}
          IN_IDS: ${{ inputs.mapping_ids }}
          IN_CTX: ${{ inputs.context_lines }}
        run: |
          set -euo pipefail
          TS_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}(:[0-9]{2})?$'
          [[ "$IN_SINCE" =~ $TS_RE ]] || { echo "::error::since 형식 오류"; exit 1; }
          [[ "$IN_UNTIL" =~ $TS_RE ]] || { echo "::error::until 형식 오류"; exit 1; }
          [[ "$IN_IDS" =~ ^[0-9]+(,[0-9]+){0,9}$ ]] || { echo "::error::mapping_ids 형식 오류"; exit 1; }
          [[ "$IN_CTX" =~ ^[0-9]{1,3}$ ]] || { echo "::error::context_lines 형식 오류"; exit 1; }

      - name: 개발 서버 로그 grep + 개발 DB SELECT
        env:
          SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DB_USER: ${{ secrets.DEV_DB_USER }}
          DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          IN_SINCE: ${{ inputs.since }}
          IN_UNTIL: ${{ inputs.until }}
          IN_IDS: ${{ inputs.mapping_ids }}
          IN_CTX: ${{ inputs.context_lines }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=접속 정보 누락::DEV_${name} secret 을 확인하세요."
              exit 1
            fi
          done
          case "$DB_NAME" in
            mind_garden|mind_garden_legacy_*)
              echo "::error title=대상 DB 차단::개발 core_solution 스키마만 조회합니다."
              exit 1
              ;;
          esac

          SQL_FILE=$(mktemp)
          KEY_FILE=$(mktemp)
          REMOTE_FILE=$(mktemp)
          trap 'rm -f "$SQL_FILE" "$KEY_FILE" "$REMOTE_FILE"' EXIT

          # 고정 SQL. __IDS__ 는 위에서 숫자·쉼표만 허용된 입력으로 치환된다.
          cat > "$SQL_FILE" <<'SQL'
          SELECT '== mappings ==' AS section;
          SELECT id, status, payment_status, total_sessions, used_sessions, remaining_sessions, payment_date, created_at, updated_at, version
            FROM consultant_client_mappings WHERE id IN (__IDS__);
          SELECT '== financial_transactions (related to mappings) ==' AS section;
          SELECT id, tenant_id, transaction_type, status, amount, related_entity_id, related_entity_type,
                 transaction_date, created_at, updated_at, is_deleted, deleted_at, version
            FROM financial_transactions
           WHERE related_entity_id IN (__IDS__) OR id IN (__IDS__)
           ORDER BY id;
          SELECT '== TRIGGERS ==' AS section;
          SELECT TRIGGER_NAME, EVENT_MANIPULATION, EVENT_OBJECT_TABLE, ACTION_TIMING, CREATED
            FROM information_schema.TRIGGERS
           WHERE TRIGGER_SCHEMA = DATABASE()
             AND EVENT_OBJECT_TABLE IN ('financial_transactions', 'consultant_client_mappings');
          SELECT '== TRIGGERS (all tables, count) ==' AS section;
          SELECT COUNT(*) AS trigger_count FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA = DATABASE();
          SELECT '== EVENTS ==' AS section;
          SELECT EVENT_NAME, STATUS, EVENT_TYPE, INTERVAL_VALUE, INTERVAL_FIELD, LAST_EXECUTED
            FROM information_schema.EVENTS WHERE EVENT_SCHEMA = DATABASE();
          SELECT '== server autocommit / isolation ==' AS section;
          SELECT @@GLOBAL.autocommit AS global_autocommit, @@GLOBAL.transaction_isolation AS global_isolation,
                 @@GLOBAL.event_scheduler AS event_scheduler;
          SQL
          sed -i "s/__IDS__/${IN_IDS}/g" "$SQL_FILE"

          if grep -qiE '(^|[^a-z_@])(insert|update|delete|drop|alter|truncate|create|replace|grant|call|set)[[:space:]]' "$SQL_FILE"; then
            echo "::error title=SELECT 전용 위반::고정 SQL 에 쓰기 구문이 있어 중단합니다."
            exit 1
          fi

          # 원격 스크립트: 로그 읽기 + 설정 키 grep + DB SELECT. 쓰기·재기동 없음.
          {
            printf 'set -uo pipefail\n'
            printf 'SINCE=%q\nUNTIL=%q\nIDS=%q\nCTX=%q\n' "$IN_SINCE" "$IN_UNTIL" "$IN_IDS" "$IN_CTX"
            cat <<'REMOTE'
          LOG=$(sudo journalctl -u mindgarden-dev.service --no-pager -o short-iso-precise --since "$SINCE" --until "$UNTIL" 2>/dev/null)
          echo "=== journal window $SINCE ~ $UNTIL : $(printf '%s\n' "$LOG" | wc -l) lines ==="
          echo "--- earliest journal entry retained ---"
          sudo journalctl -u mindgarden-dev.service --no-pager -o short-iso-precise 2>/dev/null | head -1 || true
          echo "--- service start/stop in window ---"
          printf '%s\n' "$LOG" | grep -E 'Started|Stopping|Stopped|Started Application' | head -20 || true

          IDRE=$(printf '%s' "$IDS" | tr ',' '|')
          echo "=== (1) 입금 확인 ERP 거래 생성 실패 + 스택 (-A $CTX) ==="
          printf '%s\n' "$LOG" | grep -n -A "$CTX" -E '입금 확인 ERP 거래 생성 실패' || echo '(없음)'
          echo "=== (1b) 생성 INCOME 재조회 실패 ==="
          printf '%s\n' "$LOG" | grep -n -E '생성 INCOME 재조회 실패' || echo '(없음)'
          echo "=== (2) MAPPING_ERP_SYNC_FAILED ==="
          printf '%s\n' "$LOG" | grep -n -A 5 -E 'MAPPING_ERP_SYNC_FAILED' || echo '(없음)'
          echo "=== (5) 별도 트랜잭션/상담료 수입/ensureConsultationDepositIncome ==="
          printf '%s\n' "$LOG" | grep -n -A 10 -E '별도 트랜잭션 실행 실패|상담료 수입 거래 트랜잭션 실행 실패|ensureConsultationDepositIncome' || echo '(없음)'
          echo "=== (7) 매칭 ID / confirm-deposit / confirmPayment 언급 ==="
          printf '%s\n' "$LOG" | grep -n -E "(mappingId|MappingID|mapping_id|매칭ID|매칭 ID)[=: ]*($IDRE)([^0-9]|$)|/mappings/($IDRE)/|confirm-deposit|confirmDeposit|confirm-payment|confirmPayment" | head -300 || echo '(없음)'
          echo "=== (3)(4) SQL·트랜잭션·커넥션 키워드 (줄번호 순서) ==="
          printf '%s\n' "$LOG" | grep -n -i -E 'insert|into|financial_transactions|update|consultant_client_mappings|[^a-z]call[^a-z]|commit|rollback|afterStatement|afterTransaction|connection release|Transaction|422|ERROR' \
            | grep -v -E 'TenantContextFilter|XssFilter|CommonCodeServiceImpl' | head -1500 || echo '(없음)'
          echo "=== app log files ==="
          sudo ls -la /var/log/mindgarden/ 2>/dev/null || true
          for f in /var/log/mindgarden/dev*.log; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            sudo grep -n -A "$CTX" -E "입금 확인 ERP 거래 생성 실패|MAPPING_ERP_SYNC_FAILED|생성 INCOME 재조회 실패|afterStatement|별도 트랜잭션 실행 실패|상담료 수입 거래 트랜잭션 실행 실패|ensureConsultationDepositIncome|MappingID=($IDRE)|mappingId=($IDRE)|confirm-deposit" "$f" | head -800 || true
          done
          echo "=== 연결 처리 설정 키 (값은 해당 키만) ==="
          sudo grep -h -i -E '^[[:space:]]*(export[[:space:]]+)?[A-Z_]*(HANDLING_MODE|RELEASE_MODE|PROVIDER_DISABLES_AUTOCOMMIT|AUTO_COMMIT|AUTOCOMMIT)[A-Z_]*=' /etc/mindgarden/dev.env 2>/dev/null || echo '(dev.env 에 해당 키 없음)'
          PID=$(systemctl show -p MainPID --value mindgarden-dev.service 2>/dev/null)
          if [ -n "$PID" ] && [ "$PID" != "0" ]; then
            sudo cat "/proc/$PID/cmdline" 2>/dev/null | tr '\0' '\n' | grep -i -E 'handling_mode|release_mode|provider_disables_autocommit|auto-commit|autocommit|^-X|profiles' || echo '(cmdline 에 해당 키 없음)'
          fi
          JAR=/var/www/mindgarden-dev/app.jar
          if command -v unzip >/dev/null 2>&1 && [ -f "$JAR" ]; then
            for y in application.yml application-dev.yml; do
              echo "--- jar:$y ---"
              unzip -p "$JAR" "BOOT-INF/classes/$y" 2>/dev/null | grep -n -i -E 'handling_mode|release_mode|provider_disables_autocommit|auto-commit|autocommit|show-sql' || echo '(해당 키 없음)'
            done
          else
            echo '(unzip 없음 또는 jar 없음)'
          fi
          echo "=== DB SELECT (READ ONLY 세션) ==="
          REMOTE
            printf 'export MYSQL_PWD=%q\n' "$DB_PASSWORD"
            printf 'mysql --force --init-command=%q -h %q -u %q %q --batch --raw <<'"'"'__DIAG_SQL__'"'"'\n' \
              "SET SESSION TRANSACTION READ ONLY" "$DB_HOST" "$DB_USER" "$DB_NAME"
            cat "$SQL_FILE"
            printf '__DIAG_SQL__\n'
          } > "$REMOTE_FILE"

          printf '%s\n' "$SERVER_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i "$KEY_FILE" -o BatchMode=yes "${SERVER_USER}@${SERVER_HOST}" 'bash -s' < "$REMOTE_FILE"
          echo "=== 끝 ==="
