# 운영 읽기 전용 1회. 이 파일만 바꾸는 release/prod pull_request 에서만 돈다.
# SELECT 만. 보정 잡 없음. 우회 입력 없음. 머지하지 않는다. 실행 후 닫는다.
# 2026-10-11 23:04 KST 재학 승인 이전과 KST 11–19 에는 DB 에 접속하지 않는다.
# 페이아웃 기록(special_support_monthly_payouts)·급여 계산·재무 전표는 조회하지 않는다.

name: 운영 읽기 전용 회기 순번 후속 (2026-10-11)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [release/prod]
    paths:
      - '.github/workflows/prod-session-seq-followup-readonly-pr-run.yml'

permissions:
  contents: read

concurrency:
  group: prod-session-seq-followup-readonly-pr-run-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prod-list:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: KST gate before any database connection
        id: kst_guard
        run: |
          set -euo pipefail
          NOW="$(TZ=Asia/Seoul date +%Y%m%d%H%M)"
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul now=${NOW} hour=${HOUR}"
          if [ "$NOW" -lt 202610112304 ]; then
            echo "::notice::Before 2026-10-11 23:04 KST. Skipping without a database connection."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST ${HOUR}:00 is in 11–19. Skipping without a database connection."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.kst_guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup MySQL client
        if: steps.kst_guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Read-only follow-up
        if: steps.kst_guard.outputs.skip != 'true'
        env:
          DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          DB_HOST_FALLBACK: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST:-}" ]; then DB_HOST="${DB_HOST_FALLBACK:-}"; fi
          for name in DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production DB secret is empty (${name})"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          SQL="scripts/ops/sql/prod_session_seq_followup_readonly.sql"
          if grep -qiE 'special_support_monthly_payouts|salary_calculations|salary_tax_calculations|financial_transactions|accounting_entries' "$SQL"; then
            echo "::error::payout or ledger table is referenced"
            exit 1
          fi
          if grep -qiE '(^|[^a-z_])(insert|update|delete|drop|alter|truncate|create|replace|grant|call|load|outfile|dumpfile)[[:space:]]' "$SQL"; then
            echo "::error::SQL file is not SELECT-only"
            exit 1
          fi
          export MYSQL_PWD="$DB_PASSWORD"
          echo "KST now: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          echo "payout records 23 and 24: not queried"
          echo "=== SELECT 1 ==="
          mysql --protocol=TCP -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
            --default-character-set=utf8mb4 --batch --raw \
            --init-command="SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci; SET SESSION TRANSACTION READ ONLY" \
            -N -e "SELECT 1;" >/dev/null
          echo "CONNECT: OK"
          {
            echo "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci;"
            echo "SET SESSION TRANSACTION READ ONLY;"
            echo "SET SESSION group_concat_max_len = 8192;"
            echo "START TRANSACTION READ ONLY;"
            cat "$SQL"
            echo "ROLLBACK;"
          } | mysql --protocol=TCP -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
            --default-character-set=utf8mb4 --batch --raw \
            --init-command="SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci; SET SESSION TRANSACTION READ ONLY"
          echo "=== end ==="
