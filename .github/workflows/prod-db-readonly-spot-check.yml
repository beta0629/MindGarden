# Read-only prod DB spot check — schedule/record counts.
# Push trigger (workflow_dispatch 403 대안).
# Secrets: PRODUCTION_DB_HOST(또는 PRODUCTION_HOST), PRODUCTION_DB_USER, PRODUCTION_DB_NAME, PRODUCTION_DB_PASSWORD.
# 자격증명은 GitHub Secret 만 사용 — 워크플로·스크립트에 비밀번호/호스트 기본값 하드코딩 금지.
#
# SSOT 2026-09-22: Asia/Seoul 11:00–20:00 예방성 prod DB spot check 금지.
#   KST 11–19 inclusive → exit 0 skip (push/dispatch). force_incident=true 만 명시 장애 시 우회.
name: Prod DB read-only spot check

on:
  push:
    branches: [ 'release/prod' ]
    paths:
      - 'scripts/ops/triggers/prod_db_spot_check_run.env'
  workflow_dispatch:
    inputs:
      force_incident:
        description: 'KST 11–19 주간 스킵 가드 우회 (명시적 장애 대응만)'
        type: boolean
        default: false

jobs:
  spot-check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # SSOT 2026-09-22: KST 11–19 inclusive → exit 0 skip unless force_incident=true
      - name: KST 주간 예방점검 가드 (11–19 skip)
        id: kst_guard
        env:
          FORCE_INCIDENT: ${{ inputs.force_incident || false }}
        run: |
          set -euo pipefail
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul hour=${HOUR} force_incident=${FORCE_INCIDENT}"
          if [ "${FORCE_INCIDENT}" = "true" ]; then
            echo "force_incident=true — daytime preventive skip bypassed (explicit outage)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST ${HOUR}:00 is in 11–19 (preventive ops forbidden until 20:00 KST). Skipping (exit 0)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Outside KST 11–19 forbidden window — continuing"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.kst_guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup MySQL client
        if: steps.kst_guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB host
        if: steps.kst_guard.outputs.skip != 'true'
        id: db
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-}"
          if [ -z "$HOST" ]; then HOST="${PRODUCTION_HOST:-}"; fi
          USER="${PRODUCTION_DB_USER:-}"
          NAME="${PRODUCTION_DB_NAME:-}"
          MISSING=""
          [ -n "$HOST" ] || MISSING="$MISSING PRODUCTION_DB_HOST|PRODUCTION_HOST"
          [ -n "$USER" ] || MISSING="$MISSING PRODUCTION_DB_USER"
          [ -n "$NAME" ] || MISSING="$MISSING PRODUCTION_DB_NAME"
          if [ -n "$MISSING" ]; then
            echo "::error::Required secrets missing:$MISSING"
            exit 1
          fi
          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"
          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "DB target resolved (host/user masked) db=$NAME"

      - name: Read-only counts
        if: steps.kst_guard.outputs.skip != 'true'
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_USER: ${{ steps.db.outputs.user }}
          DB_NAME: ${{ steps.db.outputs.name }}
          MYSQL_PWD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MYSQL_PWD:-}" ]; then
            echo "::error::secrets.PRODUCTION_DB_PASSWORD is not set"
            exit 1
          fi
          echo "=== SELECT 1 ==="
          if mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B -e "SELECT 1;" >/dev/null 2>&1; then
            echo "CONNECT: OK"
          else
            echo "::error::CONNECT: FAIL"
            exit 1
          fi

          runq() {
            mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B -e "$1"
          }

          echo "=== schedules 390/391 (client_id=47, date=2026-09-10) ==="
          runq "SELECT CONCAT('schedule_', id, '_exists=', COUNT(*)) FROM schedules WHERE id IN (390,391) AND client_id=47 AND date='2026-09-10' GROUP BY id ORDER BY id;"

          echo "=== consultation_records schedule 391 by is_deleted ==="
          runq "SELECT CONCAT('391_is_deleted_', IFNULL(is_deleted, 'NULL'), '_count=', COUNT(*)) FROM consultation_records WHERE consultation_id=391 AND client_id=47 AND session_date='2026-09-10' GROUP BY is_deleted ORDER BY is_deleted;"

          echo "=== consultation_records schedule 390 by is_deleted ==="
          runq "SELECT CONCAT('390_is_deleted_', IFNULL(is_deleted, 'NULL'), '_count=', COUNT(*)) FROM consultation_records WHERE consultation_id=390 AND client_id=47 AND session_date='2026-09-10' GROUP BY is_deleted ORDER BY is_deleted;"

          echo "=== record id=370 link (no TEXT) ==="
          runq "SELECT CONCAT('record_370: consultation_id=', IFNULL(consultation_id,'NULL'), ', client_id=', IFNULL(client_id,'NULL'), ', session_date=', IFNULL(session_date,'NULL'), ', is_deleted=', IFNULL(is_deleted,'NULL')) FROM consultation_records WHERE id=370 LIMIT 1;"

  # T-34: SCT 사전점검 (값 0자). 기존 spot-check 동작은 변경하지 않음.
  # 신규 워크플로는 default branch(main)에 있어야 dispatch 되므로,
  # 이미 main에 있는 이 워크플로에 읽기전용 job을 추가해 --ref 로 실행한다.

  secret-presence:
    name: GitHub secret presence (name/len only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Secret presence and length (values never printed)
        env:
          PERSONAL_DATA_ENCRYPTION_ACTIVE_KEY_ID: ${{ secrets.PERSONAL_DATA_ENCRYPTION_ACTIVE_KEY_ID }}
          PERSONAL_DATA_ENCRYPTION_KEYS: ${{ secrets.PERSONAL_DATA_ENCRYPTION_KEYS }}
          PERSONAL_DATA_ENCRYPTION_IVS: ${{ secrets.PERSONAL_DATA_ENCRYPTION_IVS }}
          PERSONAL_DATA_ENCRYPTION_KEY: ${{ secrets.PERSONAL_DATA_ENCRYPTION_KEY }}
          PERSONAL_DATA_ENCRYPTION_IV: ${{ secrets.PERSONAL_DATA_ENCRYPTION_IV }}
          PERSONAL_DATA_HMAC_SECRET: ${{ secrets.PERSONAL_DATA_HMAC_SECRET }}
          MINDGARDEN_DORMANT_PII_ENC_KEY: ${{ secrets.MINDGARDEN_DORMANT_PII_ENC_KEY }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail
          _meta() {
            local name="$1" val="$2"
            if [ -z "${val}" ]; then
              echo "github_repo_secret name=${name} state=EMPTY len=0"
            else
              echo "github_repo_secret name=${name} state=SET len=${#val}"
            fi
          }
          echo "=== GitHub repository secrets (environment production resolves repo secrets; values omitted) ==="
          _meta PERSONAL_DATA_ENCRYPTION_ACTIVE_KEY_ID "${PERSONAL_DATA_ENCRYPTION_ACTIVE_KEY_ID:-}"
          _meta PERSONAL_DATA_ENCRYPTION_KEYS "${PERSONAL_DATA_ENCRYPTION_KEYS:-}"
          _meta PERSONAL_DATA_ENCRYPTION_IVS "${PERSONAL_DATA_ENCRYPTION_IVS:-}"
          _meta PERSONAL_DATA_ENCRYPTION_KEY "${PERSONAL_DATA_ENCRYPTION_KEY:-}"
          _meta PERSONAL_DATA_ENCRYPTION_IV "${PERSONAL_DATA_ENCRYPTION_IV:-}"
          _meta PERSONAL_DATA_HMAC_SECRET "${PERSONAL_DATA_HMAC_SECRET:-}"
          _meta MINDGARDEN_DORMANT_PII_ENC_KEY "${MINDGARDEN_DORMANT_PII_ENC_KEY:-}"
          _meta REDIS_HOST "${REDIS_HOST:-}"
          _meta REDIS_PORT "${REDIS_PORT:-}"
          _meta REDIS_PASSWORD "${REDIS_PASSWORD:-}"
          echo "=== 끝 — 값 미출력 ==="

  sct-pii-counts:
    name: 운영 SCT column counts (read-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: KST 주간 예방점검 가드 (11–19 skip)
        id: kst_guard
        env:
          FORCE_INCIDENT: ${{ inputs.force_incident || false }}
        run: |
          set -euo pipefail
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul hour=${HOUR} force_incident=${FORCE_INCIDENT}"
          if [ "${FORCE_INCIDENT}" = "true" ]; then
            echo "force_incident=true — daytime skip bypassed"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST ${HOUR}:00 is in 11–19 preventive window. Skipping (exit 0)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Outside KST 11–19 window — continuing"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.kst_guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup MySQL client
        if: steps.kst_guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB target (values masked)
        if: steps.kst_guard.outputs.skip != 'true'
        id: db
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-}"
          if [ -z "$HOST" ]; then HOST="${PRODUCTION_HOST:-}"; fi
          USER="${PRODUCTION_DB_USER:-}"
          NAME="${PRODUCTION_DB_NAME:-}"
          MISSING=""
          [ -n "$HOST" ] || MISSING="$MISSING PRODUCTION_DB_HOST|PRODUCTION_HOST"
          [ -n "$USER" ] || MISSING="$MISSING PRODUCTION_DB_USER"
          [ -n "$NAME" ] || MISSING="$MISSING PRODUCTION_DB_NAME"
          if [ -n "$MISSING" ]; then
            echo "::error title=DB 접속 정보 누락::Required secrets missing:$MISSING (values omitted)"
            exit 1
          fi
          case "$NAME" in
            mind_garden|mind_garden_legacy_*)
              echo "::error title=대상 DB 차단::DB_NAME 이 차단 패턴(mind_garden|mind_garden_legacy_*) 입니다."
              exit 1
              ;;
          esac
          echo "db_name_guard=OK"
          echo "path_guard=OK runner=github-hosted ssh=no"
          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"
          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "DB target resolved (host/user/name masked)"

      - name: READ-ONLY SCT counts (no values)
        if: steps.kst_guard.outputs.skip != 'true'
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_USER: ${{ steps.db.outputs.user }}
          DB_NAME: ${{ steps.db.outputs.name }}
          MYSQL_PWD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MYSQL_PWD:-}" ]; then
            echo "::error::secrets.PRODUCTION_DB_PASSWORD is not set"
            exit 1
          fi
          echo "=== CONNECT ==="
          if mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
              -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B -e "SELECT 1;" >/dev/null 2>&1; then
            echo "CONNECT: OK"
          else
            echo "::error::CONNECT: FAIL (details omitted)"
            exit 1
          fi

          WORK_DIR="$(mktemp -d /tmp/check-prod-sct-pii.XXXXXX)"
          SQL_FILE="${WORK_DIR}/counts.sql"
          cleanup() { rm -rf "${WORK_DIR:-}"; unset MYSQL_PWD; }
          trap cleanup EXIT

          _have_table() {
            local tbl="$1" n
            n="$(mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
              -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B \
              -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND TABLE_NAME = '${tbl}';" 2>/dev/null || echo 0)"
            n="$(printf '%s' "$n" | tr -cd '0-9')"
            [ "${n:-0}" -gt 0 ]
          }
          for tbl in sct_invitations sct_consents sct_form_templates; do
            if _have_table "$tbl"; then
              echo "table=${tbl} exists=YES"
            else
              echo "table=${tbl} exists=NO"
            fi
          done

          _count_col() {
            local table="$1" col="$2"
            cat > "$SQL_FILE" <<SQL
          START TRANSACTION READ ONLY;
          SELECT CONCAT(
            'scope=all table=${table} col=${col}',
            ' total=', COUNT(*),
            ' null_or_empty=', SUM(CASE WHEN ${col} IS NULL OR ${col} = '' THEN 1 ELSE 0 END),
            ' v2=', SUM(CASE WHEN ${col} REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::' THEN 1 ELSE 0 END),
            ' v1=', SUM(CASE WHEN ${col} REGEXP '^[A-Za-z0-9_.-]{1,32}::' AND NOT (${col} REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::') THEN 1 ELSE 0 END),
            ' other_plain_est=', SUM(CASE WHEN ${col} IS NOT NULL AND ${col} <> '' AND NOT (${col} REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::') AND NOT (${col} REGEXP '^[A-Za-z0-9_.-]{1,32}::' AND NOT (${col} REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::')) THEN 1 ELSE 0 END)
          ) AS line
          FROM ${table};
          COMMIT;
          SQL
            if grep -qiE '(^|[^a-z_])(insert|update|delete|drop|alter|truncate|create|replace|grant|call|set)[[:space:]]' "$SQL_FILE"; then
              echo "::error title=SELECT 전용 위반::고정 SQL 에 쓰기/SET 구문이 있어 중단합니다."
              exit 1
            fi
            set +e
            MYSQL_OUT="$(mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
              -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
              --batch --raw --skip-column-names < "$SQL_FILE" 2>/dev/null)"
            MYSQL_RC=$?
            set -e
            if [ "$MYSQL_RC" -ne 0 ]; then
              echo "::error title=mysql 실패::COUNT 실패 table=${table} col=${col} (원문 미덤프)."
              exit 1
            fi
            printf '%s\n' "$MYSQL_OUT" | awk 'NF'
          }

          if _have_table sct_form_templates; then
            cat > "$SQL_FILE" <<'SQL'
          START TRANSACTION READ ONLY;
          SELECT CONCAT(
            'scope=all table=sct_form_templates',
            ' total=', COUNT(*),
            ' active_not_deleted=', SUM(CASE WHEN is_active = 1 AND is_deleted = 0 THEN 1 ELSE 0 END),
            ' deleted=', SUM(CASE WHEN is_deleted = 1 THEN 1 ELSE 0 END)
          ) AS line
          FROM sct_form_templates;
          SELECT CONCAT(
            'scope=all table=sct_form_templates form_type=', IFNULL(form_type,'NULL'),
            ' version=', IFNULL(version,'NULL'),
            ' active=', IFNULL(is_active,'NULL'),
            ' deleted=', IFNULL(is_deleted,'NULL'),
            ' n=', COUNT(*)
          ) AS line
          FROM sct_form_templates
          GROUP BY form_type, version, is_active, is_deleted
          ORDER BY form_type, version, is_active, is_deleted;
          COMMIT;
          SQL
            if grep -qiE '(^|[^a-z_])(insert|update|delete|drop|alter|truncate|create|replace|grant|call|set)[[:space:]]' "$SQL_FILE"; then
              echo "::error title=SELECT 전용 위반::고정 SQL 에 쓰기/SET 구문이 있어 중단합니다."
              exit 1
            fi
            set +e
            MYSQL_OUT="$(mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
              -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
              --batch --raw --skip-column-names < "$SQL_FILE" 2>/dev/null)"
            MYSQL_RC=$?
            set -e
            if [ "$MYSQL_RC" -ne 0 ]; then
              echo "::error title=mysql 실패::sct_form_templates COUNT 실패 (원문 미덤프)."
              exit 1
            fi
            printf '%s\n' "$MYSQL_OUT" | awk 'NF'
          fi

          if _have_table sct_invitations; then
            _count_col sct_invitations recipient_name
          fi
          if _have_table sct_consents; then
            _count_col sct_consents guardian_relation
            _count_col sct_consents guardian_name_enc
            _count_col sct_consents signer_name_enc
            _count_col sct_consents child_name_confirm_enc
          fi

          echo "=== 끝 — 건수만 출력, PII·암호문 미출력 ==="
          exit 0

  # T-34 배포 전 읽기전용: Flyway 이력 + #1978 마이그레이션 적용 여부 + 최근 30분 결제 진행 중 주문 건수
  # GitHub-hosted + PRODUCTION_DB_* (SSH 없음). 값·PII·주문 식별자 미출력. SELECT/COUNT만.
  predeploy-readonly:
    name: 배포 전 Flyway·진행중 주문 (read-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: KST 주간 예방점검 가드 (11–19 skip)
        id: kst_guard
        env:
          FORCE_INCIDENT: ${{ inputs.force_incident || false }}
        run: |
          set -euo pipefail
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul hour=${HOUR} force_incident=${FORCE_INCIDENT}"
          if [ "${FORCE_INCIDENT}" = "true" ]; then
            echo "force_incident=true — daytime skip bypassed"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST ${HOUR}:00 is in 11–19 preventive window. Skipping (exit 0)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Outside KST 11–19 window — continuing"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup MySQL client
        if: steps.kst_guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB target (values masked)
        if: steps.kst_guard.outputs.skip != 'true'
        id: db
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-}"
          if [ -z "$HOST" ]; then HOST="${PRODUCTION_HOST:-}"; fi
          USER="${PRODUCTION_DB_USER:-}"
          NAME="${PRODUCTION_DB_NAME:-}"
          MISSING=""
          [ -n "$HOST" ] || MISSING="$MISSING PRODUCTION_DB_HOST|PRODUCTION_HOST"
          [ -n "$USER" ] || MISSING="$MISSING PRODUCTION_DB_USER"
          [ -n "$NAME" ] || MISSING="$MISSING PRODUCTION_DB_NAME"
          if [ -n "$MISSING" ]; then
            echo "::error title=DB 접속 정보 누락::Required secrets missing:$MISSING (values omitted)"
            exit 1
          fi
          case "$NAME" in
            mind_garden|mind_garden_legacy_*)
              echo "::error title=대상 DB 차단::DB_NAME 이 차단 패턴입니다."
              exit 1
              ;;
          esac
          echo "db_name_guard=OK"
          echo "path_guard=OK runner=github-hosted ssh=no"
          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"
          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "DB target resolved (host/user/name masked)"

      - name: READ-ONLY Flyway + in-progress payment counts (no values)
        if: steps.kst_guard.outputs.skip != 'true'
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_USER: ${{ steps.db.outputs.user }}
          DB_NAME: ${{ steps.db.outputs.name }}
          MYSQL_PWD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MYSQL_PWD:-}" ]; then
            echo "::error::secrets.PRODUCTION_DB_PASSWORD is not set"
            exit 1
          fi
          echo "=== CONNECT ==="
          if mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
              -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B -e "SELECT 1;" >/dev/null 2>&1; then
            echo "CONNECT: OK"
          else
            echo "::error::CONNECT: FAIL (details omitted)"
            exit 1
          fi
          WORK_DIR="$(mktemp -d /tmp/predeploy-ro.XXXXXX)"
          SQL_FILE="${WORK_DIR}/q.sql"
          cleanup() { rm -rf "${WORK_DIR:-}"; unset MYSQL_PWD; }
          trap cleanup EXIT
          cat > "$SQL_FILE" <<'SQL'
          START TRANSACTION READ ONLY;
          SELECT CONCAT('check_ts_kst=', DATE_FORMAT(CONVERT_TZ(UTC_TIMESTAMP(),'UTC','Asia/Seoul'), '%Y-%m-%d %H:%i:%s'), ' window_min=30') AS line;
          SELECT CONCAT('flyway_table=', IF(COUNT(*)>0,'YES','NO')) AS line
          FROM information_schema.tables
          WHERE table_schema = DATABASE() AND TABLE_NAME = 'flyway_schema_history';
          SELECT CONCAT('flyway_total=', COUNT(*), ' flyway_failed_count=', SUM(CASE WHEN success = 0 THEN 1 ELSE 0 END)) AS line
          FROM flyway_schema_history;
          SELECT CONCAT('flyway_latest version=', IFNULL(version,'NULL'), ' success=', IFNULL(success,'NULL'), ' installed_on=', IFNULL(DATE_FORMAT(installed_on,'%Y-%m-%d %H:%i:%s'),'NULL')) AS line
          FROM flyway_schema_history
          ORDER BY installed_rank DESC
          LIMIT 1;
          SELECT CONCAT('flyway_recent version=', IFNULL(version,'NULL'), ' success=', IFNULL(success,'NULL'), ' installed_on=', IFNULL(DATE_FORMAT(installed_on,'%Y-%m-%d %H:%i:%s'),'NULL')) AS line
          FROM flyway_schema_history
          ORDER BY installed_rank DESC
          LIMIT 15;
          SELECT CONCAT('pr_migration version=', v.version, ' applied=', IF(h.version IS NULL,'NO','YES'), ' success=', IFNULL(h.success,'NA')) AS line
          FROM (
            SELECT '20261127_002' AS version UNION ALL
            SELECT '20261127_003' UNION ALL
            SELECT '20261127_004' UNION ALL
            SELECT '20261127_005' UNION ALL
            SELECT '20261127_006'
          ) v
          LEFT JOIN flyway_schema_history h ON h.version = v.version
          ORDER BY v.version;
          SELECT CONCAT('shop_inprogress_30m status=', status, ' n=', COUNT(*)) AS line
          FROM shop_client_orders
          WHERE status IN ('CREATED','PENDING_PAYMENT')
            AND (created_at >= DATE_SUB(NOW(), INTERVAL 30 MINUTE)
              OR updated_at >= DATE_SUB(NOW(), INTERVAL 30 MINUTE))
          GROUP BY status;
          SELECT CONCAT('shop_inprogress_30m total=', COUNT(*)) AS line
          FROM shop_client_orders
          WHERE status IN ('CREATED','PENDING_PAYMENT')
            AND (created_at >= DATE_SUB(NOW(), INTERVAL 30 MINUTE)
              OR updated_at >= DATE_SUB(NOW(), INTERVAL 30 MINUTE));
          SELECT CONCAT('shop_stale_pending_gt_30m n=', COUNT(*)) AS line
          FROM shop_client_orders
          WHERE status IN ('CREATED','PENDING_PAYMENT')
            AND created_at < DATE_SUB(NOW(), INTERVAL 30 MINUTE)
            AND updated_at < DATE_SUB(NOW(), INTERVAL 30 MINUTE);
          SELECT CONCAT('payments_inprogress_30m status=', status, ' n=', COUNT(*)) AS line
          FROM payments
          WHERE status IN ('PENDING','PROCESSING')
            AND (created_at >= DATE_SUB(NOW(), INTERVAL 30 MINUTE)
              OR updated_at >= DATE_SUB(NOW(), INTERVAL 30 MINUTE))
          GROUP BY status;
          SELECT CONCAT('payments_inprogress_30m total=', COUNT(*)) AS line
          FROM payments
          WHERE status IN ('PENDING','PROCESSING')
            AND (created_at >= DATE_SUB(NOW(), INTERVAL 30 MINUTE)
              OR updated_at >= DATE_SUB(NOW(), INTERVAL 30 MINUTE));
          SELECT CONCAT('payments_stale_pending_gt_30m n=', COUNT(*)) AS line
          FROM payments
          WHERE status IN ('PENDING','PROCESSING')
            AND created_at < DATE_SUB(NOW(), INTERVAL 30 MINUTE)
            AND updated_at < DATE_SUB(NOW(), INTERVAL 30 MINUTE);
          COMMIT;
          SQL
          if grep -qiE '(^|[^a-z_])(insert|update|delete|drop|alter|truncate|create|replace|grant|call|set)[[:space:]]' "$SQL_FILE"; then
            echo "::error title=SELECT 전용 위반::고정 SQL 에 쓰기/SET 구문이 있어 중단합니다."
            exit 1
          fi
          set +e
          MYSQL_OUT="$(mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
            -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
            --batch --raw --skip-column-names < "$SQL_FILE" 2>/dev/null)"
          MYSQL_RC=$?
          set -e
          if [ "$MYSQL_RC" -ne 0 ]; then
            echo "::error title=mysql 실패::Flyway/주문 COUNT 실패 (원문 미덤프)."
            exit 1
          fi
          printf '%s\n' "$MYSQL_OUT" | awk 'NF'
          echo "=== 끝 — 버전·success·건수만, 주문 식별자·PII 미출력 ==="
          exit 0
