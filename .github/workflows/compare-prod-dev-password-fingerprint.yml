# Purpose: D-1 sync 후 KEEP 필드(password/email/phone) fingerprint 비교 — guessing 방지
name: Compare prod vs .dev password fingerprints (D-1)

on:
  workflow_dispatch:

jobs:
  compare-fingerprints:
    name: Compare PROD vs DEV password fingerprints
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: SSH compare password fingerprints (SELECT-only)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: 22
          timeout: 180s
          script: |
            set +e
            echo "=========================================="
            echo "Compare prod vs .dev password fingerprints (D-1)"
            echo "=========================================="
            echo ""
            echo "WARNING: SELECT-only, no password UPDATE"
            echo ""

            SYNC_ENV="/etc/mindgarden/prod-to-dev-sync.env"
            DEV_ENV="/etc/mindgarden/dev.env"
            PROD_REACHABLE=0
            DEV_REACHABLE=0

            source_env_file() {
              # $1 = path; load KEY=VALUE without echoing secrets
              _path="$1"
              if [ -r "$_path" ]; then
                set -a
                # shellcheck disable=SC1090
                . "$_path"
                set +a
                return 0
              fi
              if sudo test -f "$_path"; then
                _tmp="$(mktemp)"
                sudo cat "$_path" > "$_tmp"
                set -a
                # shellcheck disable=SC1090
                . "$_tmp"
                set +a
                rm -f "$_tmp"
                return 0
              fi
              return 1
            }

            echo "1) Load env (presence only; no passwords/hosts logged)"
            echo "=========================================="
            if source_env_file "$SYNC_ENV"; then
              echo "env_source=$SYNC_ENV present=yes"
              PROD_MYSQL_PORT="${PROD_MYSQL_PORT:-3306}"
              DEV_MYSQL_PORT="${DEV_MYSQL_PORT:-3306}"
              echo "PROD_DB_NAME=${PROD_DB_NAME:-<unset>} PROD_MYSQL_HOST_set=$([ -n "${PROD_MYSQL_HOST:-}" ] && echo yes || echo no) PROD_MYSQL_USER_set=$([ -n "${PROD_MYSQL_USER:-}" ] && echo yes || echo no) PROD_MYSQL_PASSWORD_set=$([ -n "${PROD_MYSQL_PASSWORD:-}" ] && echo yes || echo no)"
              echo "DEV_DB_NAME=${DEV_DB_NAME:-<unset>} DEV_MYSQL_HOST_set=$([ -n "${DEV_MYSQL_HOST:-}" ] && echo yes || echo no) DEV_MYSQL_USER_set=$([ -n "${DEV_MYSQL_USER:-}" ] && echo yes || echo no) DEV_MYSQL_PASSWORD_set=$([ -n "${DEV_MYSQL_PASSWORD:-}" ] && echo yes || echo no)"
              if [ -n "${PROD_MYSQL_HOST:-}" ] && [ -n "${PROD_DB_NAME:-}" ] && [ -n "${PROD_MYSQL_USER:-}" ]; then
                PROD_REACHABLE=1
              else
                echo "PROD unreachable: PROD_MYSQL_* incomplete in sync.env — PROD queries will be skipped"
              fi
              if [ -n "${DEV_MYSQL_HOST:-}" ] && [ -n "${DEV_DB_NAME:-}" ] && [ -n "${DEV_MYSQL_USER:-}" ]; then
                DEV_REACHABLE=1
              else
                echo "DEV_MYSQL_* incomplete in sync.env — will try DEV fallback from dev.env"
              fi
            else
              echo "env_source=$SYNC_ENV present=no — falling back to DEV-only via $DEV_ENV"
              echo "PROD unreachable: sync.env missing — PROD queries will be skipped"
              PROD_REACHABLE=0
              if source_env_file "$DEV_ENV"; then
                echo "env_source=$DEV_ENV present=yes"
                DEV_MYSQL_HOST="${DEV_MYSQL_HOST:-${DB_HOST:-}}"
                DEV_MYSQL_PORT="${DEV_MYSQL_PORT:-${DB_PORT:-3306}}"
                DEV_MYSQL_USER="${DEV_MYSQL_USER:-${DB_USERNAME:-}}"
                DEV_MYSQL_PASSWORD="${DEV_MYSQL_PASSWORD:-${DB_PASSWORD:-}}"
                DEV_DB_NAME="${DEV_DB_NAME:-${DB_NAME:-}}"
                echo "DEV_DB_NAME=${DEV_DB_NAME:-<unset>} DEV_MYSQL_HOST_set=$([ -n "${DEV_MYSQL_HOST:-}" ] && echo yes || echo no) DEV_MYSQL_USER_set=$([ -n "${DEV_MYSQL_USER:-}" ] && echo yes || echo no) DEV_MYSQL_PASSWORD_set=$([ -n "${DEV_MYSQL_PASSWORD:-}" ] && echo yes || echo no)"
                if [ -n "${DEV_MYSQL_HOST:-}" ] && [ -n "${DEV_DB_NAME:-}" ] && [ -n "${DEV_MYSQL_USER:-}" ]; then
                  DEV_REACHABLE=1
                else
                  echo "DEV unreachable: DB_*/DEV_MYSQL_* incomplete"
                fi
              else
                echo "MISSING: $DEV_ENV — DEV unreachable"
              fi
            fi

            # If sync.env loaded but DEV incomplete, map from dev.env
            if [ "$DEV_REACHABLE" != "1" ] && [ -n "${SYNC_ENV:-}" ]; then
              if source_env_file "$DEV_ENV"; then
                DEV_MYSQL_HOST="${DEV_MYSQL_HOST:-${DB_HOST:-}}"
                DEV_MYSQL_PORT="${DEV_MYSQL_PORT:-${DB_PORT:-3306}}"
                DEV_MYSQL_USER="${DEV_MYSQL_USER:-${DB_USERNAME:-}}"
                DEV_MYSQL_PASSWORD="${DEV_MYSQL_PASSWORD:-${DB_PASSWORD:-}}"
                DEV_DB_NAME="${DEV_DB_NAME:-${DB_NAME:-}}"
                if [ -n "${DEV_MYSQL_HOST:-}" ] && [ -n "${DEV_DB_NAME:-}" ] && [ -n "${DEV_MYSQL_USER:-}" ]; then
                  DEV_REACHABLE=1
                  echo "DEV mapped from $DEV_ENV (fallback) DEV_DB_NAME=${DEV_DB_NAME}"
                fi
              fi
            fi
            echo "PROD_REACHABLE=$PROD_REACHABLE DEV_REACHABLE=$DEV_REACHABLE"
            echo ""

            if ! command -v mysql >/dev/null 2>&1; then
              echo "ERROR: mysql client not found — aborting queries"
              exit 0
            fi

            # Columns: id tenant_id email_masked phone_last4 password_len bcrypt_prefix fingerprint updated_at
            # (Avoid unindented heredoc — breaks YAML block scalar under appleboy script: |)
            build_select_sql() {
              # $1 = where clause (literals only from this script)
              printf '%s' "SELECT id, tenant_id, CONCAT(LEFT(IFNULL(email, ''), 1), '***@', LEFT(SUBSTRING_INDEX(IFNULL(email, ''), '@', -1), 1), '***.', SUBSTRING_INDEX(IFNULL(email, ''), '.', -1)) AS email_masked, IF(phone IS NULL OR TRIM(phone) = '', NULL, RIGHT(TRIM(phone), 4)) AS phone_last4, CHAR_LENGTH(password) AS password_len, LEFT(password, 7) AS bcrypt_prefix, SHA2(password, 256) AS fingerprint, updated_at FROM users WHERE $1"
            }

            PRINCIPAL_A_LABEL="email=agisunny@daum.net"
            PRINCIPAL_A_WHERE="TRIM(email) = 'agisunny@daum.net'"
            PRINCIPAL_B_LABEL="phone=01042858570"
            PRINCIPAL_B_WHERE="(TRIM(phone) = '01042858570' OR TRIM(REPLACE(IFNULL(phone, ''), '-', '')) = '01042858570')"

            query_db() {
              # $1=label PROD|DEV  $2=where  → prints table to stdout; TSV silent to fd 3 via caller file
              _label="$1"
              _where="$2"
              _sql="$(build_select_sql "$_where")"
              if [ "$_label" = "PROD" ]; then
                mysql -h "$PROD_MYSQL_HOST" -P "${PROD_MYSQL_PORT:-3306}" -u "$PROD_MYSQL_USER" \
                  ${PROD_MYSQL_PASSWORD:+-p"$PROD_MYSQL_PASSWORD"} \
                  "$PROD_DB_NAME" --batch --table -e "$_sql"
              else
                mysql -h "$DEV_MYSQL_HOST" -P "${DEV_MYSQL_PORT:-3306}" -u "$DEV_MYSQL_USER" \
                  ${DEV_MYSQL_PASSWORD:+-p"$DEV_MYSQL_PASSWORD"} \
                  "$DEV_DB_NAME" --batch --table -e "$_sql"
              fi
            }

            query_db_tsv() {
              # same as query_db but --batch --silent (TSV, no header) for compare parse
              _label="$1"
              _where="$2"
              _sql="$(build_select_sql "$_where")"
              if [ "$_label" = "PROD" ]; then
                mysql -h "$PROD_MYSQL_HOST" -P "${PROD_MYSQL_PORT:-3306}" -u "$PROD_MYSQL_USER" \
                  ${PROD_MYSQL_PASSWORD:+-p"$PROD_MYSQL_PASSWORD"} \
                  "$PROD_DB_NAME" --batch --silent -e "$_sql"
              else
                mysql -h "$DEV_MYSQL_HOST" -P "${DEV_MYSQL_PORT:-3306}" -u "$DEV_MYSQL_USER" \
                  ${DEV_MYSQL_PASSWORD:+-p"$DEV_MYSQL_PASSWORD"} \
                  "$DEV_DB_NAME" --batch --silent -e "$_sql"
              fi
            }

            # Parse first row TSV: cols 7=fingerprint 8=updated_at (1-based)
            extract_fp() {
              # stdin: TSV rows; stdout: fingerprint of first row or EMPTY
              awk -F'\t' 'NF>=7 { print $7; exit }'
            }
            extract_updated() {
              awk -F'\t' 'NF>=8 { print $8; exit }'
            }

            compare_principal() {
              _plabel="$1"
              _where="$2"
              echo "------------------------------------------"
              echo "Principal: $_plabel"
              echo "------------------------------------------"

              PROD_TSV=""
              DEV_TSV=""
              PROD_FP=""
              DEV_FP=""
              PROD_UPD=""
              DEV_UPD=""

              if [ "$PROD_REACHABLE" = "1" ]; then
                echo "--- PROD SELECT (masked; no full password hash) ---"
                query_db "PROD" "$_where" 2> /tmp/cmp-prod-err.txt
                _prc=$?
                if [ $_prc -ne 0 ]; then
                  echo "PROD mysql_error (stderr, secrets stripped):"
                  sed -E 's/-p[^ ]+/-p***/g; s/Password=[^ ]*/Password=***/gi' /tmp/cmp-prod-err.txt 2>/dev/null || true
                fi
                PROD_TSV="$(query_db_tsv "PROD" "$_where" 2>/dev/null)"
                PROD_FP="$(printf '%s\n' "$PROD_TSV" | extract_fp)"
                PROD_UPD="$(printf '%s\n' "$PROD_TSV" | extract_updated)"
                if [ -z "$PROD_FP" ]; then
                  echo "PROD rows: 0"
                else
                  echo "PROD rows: present fingerprint=${PROD_FP} updated_at=${PROD_UPD}"
                fi
              else
                echo "--- PROD SKIPPED (unreachable) ---"
              fi

              if [ "$DEV_REACHABLE" = "1" ]; then
                echo "--- DEV SELECT (masked; no full password hash) ---"
                query_db "DEV" "$_where" 2> /tmp/cmp-dev-err.txt
                _drc=$?
                if [ $_drc -ne 0 ]; then
                  echo "DEV mysql_error (stderr, secrets stripped):"
                  sed -E 's/-p[^ ]+/-p***/g; s/Password=[^ ]*/Password=***/gi' /tmp/cmp-dev-err.txt 2>/dev/null || true
                fi
                DEV_TSV="$(query_db_tsv "DEV" "$_where" 2>/dev/null)"
                DEV_FP="$(printf '%s\n' "$DEV_TSV" | extract_fp)"
                DEV_UPD="$(printf '%s\n' "$DEV_TSV" | extract_updated)"
                if [ -z "$DEV_FP" ]; then
                  echo "DEV rows: 0"
                else
                  echo "DEV rows: present fingerprint=${DEV_FP} updated_at=${DEV_UPD}"
                fi
              else
                echo "--- DEV SKIPPED (unreachable) ---"
              fi

              # MATCH / MISMATCH / MISSING_*
              _fp_status=""
              if [ -z "$PROD_FP" ] && [ -z "$DEV_FP" ]; then
                _fp_status="MISSING_BOTH"
              elif [ -z "$PROD_FP" ]; then
                _fp_status="MISSING_PROD"
              elif [ -z "$DEV_FP" ]; then
                _fp_status="MISSING_DEV"
              elif [ "$PROD_FP" = "$DEV_FP" ]; then
                _fp_status="MATCH"
              else
                _fp_status="MISMATCH"
              fi

              _upd_status=""
              if [ -z "$PROD_UPD" ] && [ -z "$DEV_UPD" ]; then
                _upd_status="MISSING_BOTH"
              elif [ -z "$PROD_UPD" ]; then
                _upd_status="MISSING_PROD"
              elif [ -z "$DEV_UPD" ]; then
                _upd_status="MISSING_DEV"
              elif [ "$PROD_UPD" = "$DEV_UPD" ]; then
                _upd_status="MATCH"
              else
                _upd_status="MISMATCH"
              fi

              echo "RESULT fingerprint: $_fp_status"
              echo "RESULT updated_at:  $_upd_status"
              echo ""
            }

            echo "2) Principal fingerprint compare (PROD vs DEV)"
            echo "=========================================="
            compare_principal "$PRINCIPAL_A_LABEL" "$PRINCIPAL_A_WHERE"
            compare_principal "$PRINCIPAL_B_LABEL" "$PRINCIPAL_B_WHERE"

            echo "3) Newest prod-to-dev sync log (mtime) — last 30 lines (secrets redacted)"
            echo "=========================================="
            NEWEST_SYNC_LOG="$(sudo ls -t /var/log/mindgarden/prod-to-dev-sync_*.log 2>/dev/null | head -n 1)"
            if [ -n "$NEWEST_SYNC_LOG" ]; then
              echo "newest_log=$NEWEST_SYNC_LOG"
              echo "mtime=$(sudo stat -c '%y' "$NEWEST_SYNC_LOG" 2>/dev/null || sudo stat -f '%Sm' "$NEWEST_SYNC_LOG" 2>/dev/null || echo unknown)"
              echo "--- tail -30 (password/host-ish values redacted) ---"
              sudo tail -n 30 "$NEWEST_SYNC_LOG" 2>/dev/null \
                | sed -E 's/(PASSWORD|PASSWD|SECRET|TOKEN|KEY)=[^[:space:]]*/\1=<redacted>/gi' \
                | sed -E 's/-p[^[:space:]]+/-p***/g' \
                | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/a***@***/g' \
                || echo "(tail failed)"
              echo "--- sync success hint (completed/finished lines) ---"
              sudo grep -E '완료|completed|finished|===.*동기화|success|SUCCESS' "$NEWEST_SYNC_LOG" 2>/dev/null \
                | sed -E 's/(PASSWORD|PASSWD|SECRET|TOKEN|KEY)=[^[:space:]]*/\1=<redacted>/gi' \
                | tail -n 10 \
                || echo "(no success-hint lines found)"
            else
              echo "prod-to-dev-sync_*.log not found under /var/log/mindgarden/"
            fi
            echo ""

            echo "4) Cleanup secrets from shell"
            echo "=========================================="
            unset PROD_MYSQL_PASSWORD DEV_MYSQL_PASSWORD DB_PASSWORD 2>/dev/null || true
            unset PROD_MYSQL_HOST DEV_MYSQL_HOST DB_HOST 2>/dev/null || true
            unset PROD_MYSQL_USER DEV_MYSQL_USER DB_USERNAME 2>/dev/null || true
            rm -f /tmp/cmp-prod-err.txt /tmp/cmp-dev-err.txt 2>/dev/null || true
            echo "passwords unset"
            echo ""
            echo "=========================================="
            echo "Compare complete (SELECT-only; no password UPDATE)"
            echo "=========================================="
