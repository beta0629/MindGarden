# =============================================================================
# Check 운영 SCT PII counts (READ-ONLY) — SCT 운영 반영 사전점검
# -----------------------------------------------------------------------------
# 목적:
#   - GitHub repo secret 존재·이름·길이만 (값 0자)
#   - 운영 DB SCT 테이블/동의 템플릿 존재 여부 + 암호 형식 COUNT (값 0자)
#
# 방법: GitHub-hosted runner + PRODUCTION_DB_* 직접 MySQL (SSH 없음).
# 트리거: workflow_dispatch 전용 (push/PR/schedule 없음).
# 환경: production (브랜치 제한 없음 → release/dev 에서도 dispatch 가능).
#       environment: prod 는 release/prod 전용이므로 사용하지 않음.
#
# 금지:
#   - SSH / 운영 파일 쓰기 / heal / 재시작 / 배포
#   - INSERT/UPDATE/DELETE/백필, 임의 SQL 입력
#   - PII·암호문·접두 부분문자열·호스트·계정·비밀번호 출력
#   - set -x / 시크릿 echo
#
# SSOT: KST 11–19 예방성 운영 DB 점검 금지 (prod-db-readonly-spot-check 와 동일).
# =============================================================================

name: 🔎 Check 운영 SCT PII counts (read-only)

on:
  workflow_dispatch:
    inputs:
      force_incident:
        description: 'KST 11–19 주간 스킵 가드 우회 (명시적 장애 대응만)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-prod-sct-pii-counts
  cancel-in-progress: false

jobs:
  secret-presence:
    name: GitHub secret presence (name/len only)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Secret presence and length (values never printed)
        env:
          PERSONAL_DATA_ENCRYPTION_ACTIVE_KEY_ID: ${{ secrets.PERSONAL_DATA_ENCRYPTION_ACTIVE_KEY_ID }}
          PERSONAL_DATA_ENCRYPTION_KEYS: ${{ secrets.PERSONAL_DATA_ENCRYPTION_KEYS }}
          PERSONAL_DATA_ENCRYPTION_IVS: ${{ secrets.PERSONAL_DATA_ENCRYPTION_IVS }}
          PERSONAL_DATA_ENCRYPTION_KEY: ${{ secrets.PERSONAL_DATA_ENCRYPTION_KEY }}
          PERSONAL_DATA_ENCRYPTION_IV: ${{ secrets.PERSONAL_DATA_ENCRYPTION_IV }}
          PERSONAL_DATA_HMAC_SECRET: ${{ secrets.PERSONAL_DATA_HMAC_SECRET }}
          MINDGARDEN_DORMANT_PII_ENC_KEY: ${{ secrets.MINDGARDEN_DORMANT_PII_ENC_KEY }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail
          _meta() {
            local name="$1" val="$2"
            if [ -z "${val}" ]; then
              echo "github_repo_secret name=${name} state=EMPTY len=0"
            else
              echo "github_repo_secret name=${name} state=SET len=${#val}"
            fi
          }
          echo "=== GitHub repository secrets (environment production resolves repo secrets; values omitted) ==="
          _meta PERSONAL_DATA_ENCRYPTION_ACTIVE_KEY_ID "${PERSONAL_DATA_ENCRYPTION_ACTIVE_KEY_ID:-}"
          _meta PERSONAL_DATA_ENCRYPTION_KEYS "${PERSONAL_DATA_ENCRYPTION_KEYS:-}"
          _meta PERSONAL_DATA_ENCRYPTION_IVS "${PERSONAL_DATA_ENCRYPTION_IVS:-}"
          _meta PERSONAL_DATA_ENCRYPTION_KEY "${PERSONAL_DATA_ENCRYPTION_KEY:-}"
          _meta PERSONAL_DATA_ENCRYPTION_IV "${PERSONAL_DATA_ENCRYPTION_IV:-}"
          _meta PERSONAL_DATA_HMAC_SECRET "${PERSONAL_DATA_HMAC_SECRET:-}"
          _meta MINDGARDEN_DORMANT_PII_ENC_KEY "${MINDGARDEN_DORMANT_PII_ENC_KEY:-}"
          _meta REDIS_HOST "${REDIS_HOST:-}"
          _meta REDIS_PORT "${REDIS_PORT:-}"
          _meta REDIS_PASSWORD "${REDIS_PASSWORD:-}"
          echo "=== 끝 — 값 미출력 ==="

  db-counts:
    name: 운영 SCT column counts (read-only)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: KST 주간 예방점검 가드 (11–19 skip)
        id: kst_guard
        env:
          FORCE_INCIDENT: ${{ inputs.force_incident || false }}
        run: |
          set -euo pipefail
          HOUR="$(TZ=Asia/Seoul date +%H)"
          HOUR=$((10#$HOUR))
          echo "Asia/Seoul hour=${HOUR} force_incident=${FORCE_INCIDENT}"
          if [ "${FORCE_INCIDENT}" = "true" ]; then
            echo "force_incident=true — daytime skip bypassed"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST ${HOUR}:00 is in 11–19 preventive window. Skipping (exit 0)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Outside KST 11–19 window — continuing"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.kst_guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup MySQL client
        if: steps.kst_guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Resolve DB target (values masked)
        if: steps.kst_guard.outputs.skip != 'true'
        id: db
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
        run: |
          set -euo pipefail
          HOST="${PRODUCTION_DB_HOST:-}"
          if [ -z "$HOST" ]; then HOST="${PRODUCTION_HOST:-}"; fi
          USER="${PRODUCTION_DB_USER:-}"
          NAME="${PRODUCTION_DB_NAME:-}"
          MISSING=""
          [ -n "$HOST" ] || MISSING="$MISSING PRODUCTION_DB_HOST|PRODUCTION_HOST"
          [ -n "$USER" ] || MISSING="$MISSING PRODUCTION_DB_USER"
          [ -n "$NAME" ] || MISSING="$MISSING PRODUCTION_DB_NAME"
          if [ -n "$MISSING" ]; then
            echo "::error title=DB 접속 정보 누락::Required secrets missing:$MISSING (values omitted)"
            exit 1
          fi
          case "$NAME" in
            mind_garden|mind_garden_legacy_*)
              echo "::error title=대상 DB 차단::DB_NAME 이 차단 패턴(mind_garden|mind_garden_legacy_*) 입니다."
              exit 1
              ;;
          esac
          echo "db_name_guard=OK"
          echo "path_guard=OK runner=github-hosted ssh=no"
          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"
          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "DB target resolved (host/user/name masked)"

      - name: READ-ONLY SCT counts (no values)
        if: steps.kst_guard.outputs.skip != 'true'
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_USER: ${{ steps.db.outputs.user }}
          DB_NAME: ${{ steps.db.outputs.name }}
          MYSQL_PWD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MYSQL_PWD:-}" ]; then
            echo "::error::secrets.PRODUCTION_DB_PASSWORD is not set"
            exit 1
          fi
          echo "=== CONNECT ==="
          if mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
              -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B -e "SELECT 1;" >/dev/null 2>&1; then
            echo "CONNECT: OK"
          else
            echo "::error::CONNECT: FAIL (details omitted)"
            exit 1
          fi

          WORK_DIR="$(mktemp -d /tmp/check-prod-sct-pii.XXXXXX)"
          SQL_FILE="${WORK_DIR}/counts.sql"
          cleanup() { rm -rf "${WORK_DIR:-}"; unset MYSQL_PWD; }
          trap cleanup EXIT

          _have_table() {
            local tbl="$1" n
            n="$(mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
              -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -N -B \
              -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND TABLE_NAME = '${tbl}';" 2>/dev/null || echo 0)"
            n="$(printf '%s' "$n" | tr -cd '0-9')"
            [ "${n:-0}" -gt 0 ]
          }
          for tbl in sct_invitations sct_consents sct_form_templates; do
            if _have_table "$tbl"; then
              echo "table=${tbl} exists=YES"
            else
              echo "table=${tbl} exists=NO"
            fi
          done

          _count_col() {
            local table="$1" col="$2"
            cat > "$SQL_FILE" <<SQL
          START TRANSACTION READ ONLY;
          SELECT CONCAT(
            'scope=all table=${table} col=${col}',
            ' total=', COUNT(*),
            ' null_or_empty=', SUM(CASE WHEN ${col} IS NULL OR ${col} = '' THEN 1 ELSE 0 END),
            ' v2=', SUM(CASE WHEN ${col} REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::' THEN 1 ELSE 0 END),
            ' v1=', SUM(CASE WHEN ${col} REGEXP '^[A-Za-z0-9_.-]{1,32}::' AND NOT (${col} REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::') THEN 1 ELSE 0 END),
            ' other_plain_est=', SUM(CASE WHEN ${col} IS NOT NULL AND ${col} <> '' AND NOT (${col} REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::') AND NOT (${col} REGEXP '^[A-Za-z0-9_.-]{1,32}::' AND NOT (${col} REGEXP '^[A-Za-z0-9_.-]{1,32}:v2::')) THEN 1 ELSE 0 END)
          ) AS line
          FROM ${table};
          COMMIT;
          SQL
            if grep -qiE '(^|[^a-z_])(insert|update|delete|drop|alter|truncate|create|replace|grant|call|set)[[:space:]]' "$SQL_FILE"; then
              echo "::error title=SELECT 전용 위반::고정 SQL 에 쓰기/SET 구문이 있어 중단합니다."
              exit 1
            fi
            set +e
            MYSQL_OUT="$(mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
              -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
              --batch --raw --skip-column-names < "$SQL_FILE" 2>/dev/null)"
            MYSQL_RC=$?
            set -e
            if [ "$MYSQL_RC" -ne 0 ]; then
              echo "::error title=mysql 실패::COUNT 실패 table=${table} col=${col} (원문 미덤프)."
              exit 1
            fi
            printf '%s\n' "$MYSQL_OUT" | awk 'NF'
          }

          if _have_table sct_form_templates; then
            cat > "$SQL_FILE" <<'SQL'
          START TRANSACTION READ ONLY;
          SELECT CONCAT(
            'scope=all table=sct_form_templates',
            ' total=', COUNT(*),
            ' active_not_deleted=', SUM(CASE WHEN is_active = 1 AND is_deleted = 0 THEN 1 ELSE 0 END),
            ' deleted=', SUM(CASE WHEN is_deleted = 1 THEN 1 ELSE 0 END)
          ) AS line
          FROM sct_form_templates;
          SELECT CONCAT(
            'scope=all table=sct_form_templates form_type=', IFNULL(form_type,'NULL'),
            ' version=', IFNULL(version,'NULL'),
            ' active=', IFNULL(is_active,'NULL'),
            ' deleted=', IFNULL(is_deleted,'NULL'),
            ' n=', COUNT(*)
          ) AS line
          FROM sct_form_templates
          GROUP BY form_type, version, is_active, is_deleted
          ORDER BY form_type, version, is_active, is_deleted;
          COMMIT;
          SQL
            if grep -qiE '(^|[^a-z_])(insert|update|delete|drop|alter|truncate|create|replace|grant|call|set)[[:space:]]' "$SQL_FILE"; then
              echo "::error title=SELECT 전용 위반::고정 SQL 에 쓰기/SET 구문이 있어 중단합니다."
              exit 1
            fi
            set +e
            MYSQL_OUT="$(mysql --init-command="SET SESSION TRANSACTION READ ONLY" \
              -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
              --batch --raw --skip-column-names < "$SQL_FILE" 2>/dev/null)"
            MYSQL_RC=$?
            set -e
            if [ "$MYSQL_RC" -ne 0 ]; then
              echo "::error title=mysql 실패::sct_form_templates COUNT 실패 (원문 미덤프)."
              exit 1
            fi
            printf '%s\n' "$MYSQL_OUT" | awk 'NF'
          fi

          if _have_table sct_invitations; then
            _count_col sct_invitations recipient_name
          fi
          if _have_table sct_consents; then
            _count_col sct_consents guardian_relation
            _count_col sct_consents guardian_name_enc
            _count_col sct_consents signer_name_enc
            _count_col sct_consents child_name_confirm_enc
          fi

          echo "=== 끝 — 건수만 출력, PII·암호문 미출력 ==="
          exit 0
