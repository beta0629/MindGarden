name: 🛡️ Guardrail secrets (main PR)

# main 으로 들어오는 PR 의 새 커밋만 gitleaks 로 검사한다(release/dev·release/prod 의 guardrails.yml guardrail-secrets 와 같은 방식).
# 비밀값은 출력하지 않는다(--redact=100). 기존 히스토리 발견분은 저장소 루트 .gitleaksignore(fingerprint 만)로 제외된다.

on:
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrail-secrets-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  guardrail-secrets:
    name: Guardrail secrets (gitleaks PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (history without blobs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install gitleaks (pinned + sha256)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan PR commits only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "pull_request 이벤트가 아니어서 건너뜀"
            exit 0
          fi
          bash scripts/ci/guardrail-gitleaks-diff.sh "$BASE_SHA" "$HEAD_SHA"
