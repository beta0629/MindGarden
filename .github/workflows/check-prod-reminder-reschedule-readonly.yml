# P1 INCIDENT RCA (2026-11-11 재학 제보) — 일정 날짜 변경 후 D-1 리마인드 재발송 여부 (순수 읽기 전용)
# 트리거: workflow_dispatch 전용. push/PR/schedule 트리거 없음. 배포 워크플로 호출 없음.
# DB: scripts/ops/readonly/prod_reminder_reschedule_rca.sql 를 READ ONLY 세션으로 실행 (SELECT 만, 쓰기 키워드 가드).
# 로그: appleboy/ssh-action + PRODUCTION_* 시크릿, grep/tail 만. 재시작·설정 변경·파일 쓰기·heal 금지.
# 출력: 전화번호는 뒤 4자리만(마스킹), 이름·본문·토큰 미출력.
# SSOT 2026-09-22: KST 11–19 예방성 prod DB 점검 금지 → force_incident=true(명시 장애) 일 때만 주간 실행.
name: 🔎 Check prod reminder reschedule (read-only)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '조회일 (KST, yyyy-MM-dd)'
        required: true
        default: '2026-11-11'
      since:
        description: '영향 집계 시작일 (yyyy-MM-dd)'
        required: true
        default: '2026-10-01'
      force_incident:
        description: 'KST 11–19 주간 스킵 가드 우회 (명시적 장애 대응만)'
        type: boolean
        default: false
      sms_mode_only:
        description: 'SMS 테스트모드 플래그만 실측 (env/설정 grep + 로컬 status GET + 로그 흔적, 비밀값 미출력)'
        type: boolean
        default: false

concurrency:
  group: check-prod-reminder-reschedule-readonly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  db-readonly:
    name: prod DB read-only SELECT
    if: ${{ !inputs.sms_mode_only }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Validate inputs + KST guard
        id: guard
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          SINCE: ${{ inputs.since }}
          FORCE_INCIDENT: ${{ inputs.force_incident }}
        run: |
          set -euo pipefail
          for v in "$TARGET_DATE" "$SINCE"; do
            [[ "$v" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid date input"; exit 1; }
          done
          HOUR=$((10#$(TZ=Asia/Seoul date +%H)))
          echo "Asia/Seoul hour=${HOUR} force_incident=${FORCE_INCIDENT}"
          if [ "$FORCE_INCIDENT" != "true" ] && [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "::notice::KST 11–19 preventive window — skip (exit 0)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Guard SQL is read-only
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          F=scripts/ops/readonly/prod_reminder_reschedule_rca.sql
          if grep -v '^[[:space:]]*--' "$F" | grep -wiE 'INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE|GRANT|REVOKE|RENAME|LOAD|CALL|HANDLER|LOCK|SET'; then
            echo "::error::write/DDL keyword found in read-only SQL"; exit 1
          fi
          echo "read-only keyword guard: PASS"

      - name: Setup MySQL client
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Run read-only SELECT
        if: steps.guard.outputs.skip != 'true'
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          MYSQL_PWD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          TARGET_DATE: ${{ inputs.target_date }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          DB_HOST="${PRODUCTION_DB_HOST:-${PRODUCTION_HOST:-}}"
          [ -n "$DB_HOST" ] && [ -n "${DB_USER:-}" ] && [ -n "${DB_NAME:-}" ] && [ -n "${MYSQL_PWD:-}" ] || { echo "::error::DB secrets missing"; exit 1; }
          echo "::add-mask::$DB_HOST"; echo "::add-mask::$DB_USER"
          sed -e "s/__TARGET_DATE__/${TARGET_DATE}/g" -e "s/__SINCE__/${SINCE}/g" \
            scripts/ops/readonly/prod_reminder_reschedule_rca.sql > /tmp/rca.sql
          mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" \
            --init-command="SET SESSION TRANSACTION READ ONLY" \
            --default-character-set=utf8mb4 --force -t < /tmp/rca.sql 2>&1 \
            | sed -E 's/(01[016789])[- ]?[0-9]{3,4}[- ]?([0-9]{4})/\1-****-\2/g'

  logs-readonly:
    name: prod app log grep (read-only)
    if: ${{ !inputs.sms_mode_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate input
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid date"; exit 1; }
      - name: Grep reminder/reschedule logs (production)
        uses: appleboy/ssh-action@master
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 4m
          script_stop: false
          envs: TARGET_DATE
          script: |
            set +e
            mask() { sed -E 's/(01[016789])[- ]?[0-9]{3,4}[- ]?([0-9]{4})/\1-****-\2/g' | cut -c1-420; }
            sec() { echo; echo "=================== $1"; }
            PAT='ReservationReminder|멱등성 검사 skip|당일 1통 skip|슬롯 재시도 한도|SCHEDULE_SLOT_PAST|SMS_GATE|스케줄 수정 요청|스케줄 날짜 변경|스케줄 시작 시간 변경|일정 변경 디바운스|ScheduleChangeNotification|PENDING 취소|reminder pending'
            sec "log files"; sudo -n ls -la --time-style=full-iso /var/log/mindgarden/ 2>/dev/null | grep -E 'core-' | head -20
            for c in blue green; do
              for f in /var/log/mindgarden/core-$c.log /var/log/mindgarden/core-$c-error.log; do
                sec "$f ($TARGET_DATE, pattern)"
                sudo -n grep -aE "$PAT" "$f" 2>/dev/null | grep -a "$TARGET_DATE" | mask | tail -n 200
              done
            done
            for u in mindgarden-core-blue.service mindgarden-core-green.service; do
              sec "journalctl $u ($TARGET_DATE, pattern)"
              sudo -n journalctl -u "$u" --since "$TARGET_DATE 00:00" --until "$TARGET_DATE 23:59:59" --no-pager 2>/dev/null | grep -aE "$PAT" | mask | tail -n 200
            done

  # SMS 테스트모드 실측 — 코드 SSOT: SmsProperties(prefix sms.auth).testMode ← application.yml
  # `sms.auth.test-mode: ${SMS_TEST_MODE:true}` (미설정 시 true). 테넌트별 테스트모드 키는 코드에 없음.
  # 출력은 SMS_TEST_MODE / SMS_AUTH_ENABLED / SMS_PROVIDER / SPRING_PROFILES_ACTIVE / test-mode 라인만 (비밀 키 미출력).
  sms-mode-readonly:
    name: prod SMS test-mode flag (read-only)
    if: ${{ inputs.sms_mode_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read SMS flags on production host (no writes)
        uses: appleboy/ssh-action@master
        env:
          SINCE: ${{ inputs.since }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 4m
          script_stop: false
          envs: SINCE
          script: |
            set +e
            KEYS='^[[:space:]]*(export[[:space:]]+)?(SMS_TEST_MODE|SMS_AUTH_ENABLED|SMS_PROVIDER|SPRING_PROFILES_ACTIVE)='
            sec() { echo; echo "=================== $1"; }
            for u in mindgarden-core-blue.service mindgarden-core-green.service; do
              sec "$u systemd (state / env files / workdir)"
              sudo -n systemctl show "$u" -p ActiveState -p SubState -p MainPID -p EnvironmentFiles -p WorkingDirectory --no-pager 2>/dev/null
              sec "$u unit Environment= (SMS 키만)"
              sudo -n systemctl show "$u" -p Environment --no-pager 2>/dev/null | tr ' ' '\n' | grep -E '(SMS_TEST_MODE|SMS_AUTH_ENABLED|SMS_PROVIDER|SPRING_PROFILES_ACTIVE)=' || echo "(none)"
              for f in $(sudo -n systemctl show "$u" -p EnvironmentFiles --value 2>/dev/null | grep -oE '/[^ ]+' ); do
                sec "$u EnvironmentFile $f (SMS 키만)"
                sudo -n test -f "$f" && { sudo -n grep -nE "$KEYS" "$f" || echo "(SMS_TEST_MODE 미정의 → 기본값 true 적용 대상)"; } || echo "(file missing)"
              done
              PID=$(sudo -n systemctl show "$u" -p MainPID --value 2>/dev/null)
              sec "$u 실행 프로세스 env (PID=$PID, SMS 키만)"
              if [ -n "$PID" ] && [ "$PID" != "0" ]; then
                sudo -n cat /proc/$PID/environ 2>/dev/null | tr '\0' '\n' | grep -E '^(SMS_TEST_MODE|SMS_AUTH_ENABLED|SMS_PROVIDER|SPRING_PROFILES_ACTIVE)=' || echo "(SMS 키 없음)"
                sec "$u cmdline 의 test-mode / profile 인자"
                sudo -n cat /proc/$PID/cmdline 2>/dev/null | tr '\0' '\n' | grep -iE 'test-mode|SMS_TEST|spring.profiles|spring.config' || echo "(없음)"
              fi
            done
            sec "외부 설정 파일의 sms test-mode 라인 (/etc/mindgarden, /opt/mindgarden)"
            sudo -n grep -rnE 'test-mode|SMS_TEST_MODE' /etc/mindgarden /opt/mindgarden --include='*.yml' --include='*.yaml' --include='*.properties' --include='*.env' 2>/dev/null | grep -iE 'sms|SMS_TEST' | cut -c1-200 || echo "(없음)"
            for port in 8080 8081; do
              sec "localhost:$port GET /api/v1/auth/sms/status (읽기 전용)"
              curl -s -m 8 "http://127.0.0.1:$port/api/v1/auth/sms/status" | head -c 300; echo
            done
            sec "앱 로그 테스트모드 흔적 (since $SINCE, 건수·최근 3줄 본문 제외)"
            for c in blue green; do
              for f in /var/log/mindgarden/core-$c.log /var/log/mindgarden/core-$c-error.log; do
                n=$(sudo -n grep -acE 'SMS 테스트 모드|testMode=true' "$f" 2>/dev/null); echo "$f count=${n:-0}"
              done
              u=mindgarden-core-$c.service
              n=$(sudo -n journalctl -u "$u" --since "$SINCE 00:00" --no-pager 2>/dev/null | grep -acE 'SMS 테스트 모드|testMode=true'); echo "journal $u since $SINCE count=${n:-0}"
              sudo -n journalctl -u "$u" --since "$SINCE 00:00" --no-pager 2>/dev/null | grep -aE 'SMS 테스트 모드' | grep -v '발송 메시지' | cut -c1-160 | tail -n 3
            done

  sms-mode-db-readonly:
    name: prod DB SMS test-mode keys (read-only SELECT)
    if: ${{ inputs.sms_mode_only }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Setup MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
      - name: SELECT only (READ ONLY session)
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          MYSQL_PWD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid since"; exit 1; }
          DB_HOST="${PRODUCTION_DB_HOST:-${PRODUCTION_HOST:-}}"
          echo "::add-mask::$DB_HOST"; echo "::add-mask::$DB_USER"
          cat > /tmp/sms.sql <<SQL
          SELECT '1) test_mode 성격 컬럼 (스키마)' AS section;
          SELECT table_name, column_name FROM information_schema.columns
           WHERE table_schema = DATABASE() AND (column_name LIKE '%test_mode%' OR column_name LIKE '%testmode%')
           ORDER BY table_name;
          SELECT '2) 설정 테이블의 SMS 테스트모드 키' AS section;
          SELECT table_name FROM information_schema.tables WHERE table_schema = DATABASE()
           AND table_name IN ('system_config','system_configs','tenant_sms_settings','sms_templates');
          SELECT '3) 최근 배치 발송 로그 SMS 결과 분포 (since)' AS section;
          SELECT DATE(sent_at) d, channel_used, success, IFNULL(error_code,'-') error_code, COUNT(*) n
            FROM notification_batch_send_log
           WHERE sent_at >= '${SINCE}' AND channel_used = 'SMS'
           GROUP BY DATE(sent_at), channel_used, success, IFNULL(error_code,'-')
           ORDER BY d DESC LIMIT 60;
          SQL
          if grep -wiE 'INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE|GRANT|REVOKE|RENAME|LOAD|CALL|HANDLER|LOCK' /tmp/sms.sql; then echo "::error::write keyword"; exit 1; fi
          mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" --init-command="SET SESSION TRANSACTION READ ONLY" \
            --default-character-set=utf8mb4 --force -t < /tmp/sms.sql 2>&1
          for t in system_config system_configs; do
            mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" --init-command="SET SESSION TRANSACTION READ ONLY" -t \
              -e "SELECT '$t' src, config_key, config_value FROM $t WHERE LOWER(config_key) LIKE '%sms%' AND (LOWER(config_key) LIKE '%test%' OR LOWER(config_key) LIKE '%mode%')" 2>/dev/null || true
          done
          mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" --init-command="SET SESSION TRANSACTION READ ONLY" -t \
            -e "SELECT column_name FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='tenant_sms_settings'" 2>/dev/null || true
