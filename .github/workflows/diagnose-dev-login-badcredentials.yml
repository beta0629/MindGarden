name: Diagnose .dev login BadCredentials (tenant)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose mindgarden-dev login / tenant
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: SSH diagnose on .dev
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: 22
          timeout: 180s
          script: |
            set +e
            echo "=========================================="
            echo "Diagnose .dev login BadCredentials (tenant)"
            echo "=========================================="
            echo ""
            echo "WARNING: SELECT/journal/access only. NO password UPDATE."
            echo ""

            echo "1) systemctl show (Environment/ExecStart, secrets redacted)"
            echo "=========================================="
            sudo systemctl show mindgarden-dev -p ExecStart --no-pager 2>/dev/null | while IFS= read -r line; do
              echo "$line" | sed -E 's/(PASSWORD|SECRET|TOKEN|KEY|PASSWD)=[^ ]*/\1=***/gi'
            done
            echo "--- Environment keys (values masked) ---"
            sudo systemctl show mindgarden-dev -p Environment --no-pager 2>/dev/null | tr ' ' '\n' | while IFS= read -r part; do
              [ -z "$part" ] && continue
              case "$part" in
                Environment=*)
                  echo "Environment=*** (entries follow, values masked)"
                  ;;
                *=*)
                  key="${part%%=*}"
                  echo "${key}=***"
                  ;;
                *)
                  echo "$part"
                  ;;
              esac
            done
            echo ""

            echo "2) /etc/mindgarden/dev.env — profile/tenant KEY NAMES only (no values)"
            echo "=========================================="
            if sudo test -f /etc/mindgarden/dev.env; then
              sudo grep -E '^(SPRING_PROFILES|LOCAL_DEFAULT_TENANT|.*TENANT.*|.*PROFILE.*|[A-Z0-9_]*TENANT[A-Z0-9_]*|[A-Z0-9_]*PROFILE[A-Z0-9_]*)=' /etc/mindgarden/dev.env 2>/dev/null \
                | sed -E 's/=.*$/=<redacted>/' \
                || echo "(no matching keys)"
              echo "--- key name inventory (grep -o key before =) ---"
              sudo grep -E 'SPRING_PROFILES|LOCAL_DEFAULT_TENANT|TENANT|PROFILE' /etc/mindgarden/dev.env 2>/dev/null \
                | sed -E 's/=.*//' \
                | sort -u \
                || echo "(no matching key names)"
            else
              echo "MISSING: /etc/mindgarden/dev.env"
            fi
            echo ""

            echo "3) journalctl patterns (today 14:00 Asia/Seoul) — tenant/login"
            echo "=========================================="
            SINCE="$(TZ=Asia/Seoul date '+%Y-%m-%d 14:00:00')"
            echo "since=$SINCE (Asia/Seoul wall clock passed to journalctl)"
            sudo journalctl -u mindgarden-dev --since "$SINCE" --no-pager 2>/dev/null \
              | grep -E '로컬 프로파일|Tenant ID|로그인 시도|passwordLength|passwordHash|loadUserByUsername|자격 증명|subdomain' \
              | tail -n 200 \
              || echo "(no matching journal lines)"
            echo ""

            echo "4) curl login probe (dummy credentials, Host: mindgarden.dev...)"
            echo "=========================================="
            PROBE_MARKER="diagnose-badcredentials-probe-$(date +%s)"
            echo "probe_marker=$PROBE_MARKER"
            curl -sS -m 15 -o /tmp/diagnose-login-probe.body -w "http_code=%{http_code}\n" \
              -X POST "http://localhost:8080/api/v1/auth/login" \
              -H "Host: mindgarden.dev.core-solution.co.kr" \
              -H "Content-Type: application/json" \
              -H "X-Diagnose-Marker: ${PROBE_MARKER}" \
              -d '{"email":"diagnose-dummy@example.invalid","password":"DummyProbeNotARealPassword1!"}' \
              || echo "curl_failed"
            echo "--- response body (truncated, no secrets expected) ---"
            head -c 500 /tmp/diagnose-login-probe.body 2>/dev/null; echo ""
            rm -f /tmp/diagnose-login-probe.body
            echo "--- journal after probe (last 80 matching lines) ---"
            sleep 1
            sudo journalctl -u mindgarden-dev --since "2 min ago" --no-pager 2>/dev/null \
              | grep -E "로컬 프로파일|Tenant ID|로그인 시도|passwordLength|passwordHash|loadUserByUsername|자격 증명|subdomain|${PROBE_MARKER}|BadCredentials|UsernameNotFound" \
              | tail -n 80 \
              || echo "(no post-probe journal lines)"
            echo ""

            echo "5) SQL SELECT-only password shape checks (no UPDATE, no email plaintext)"
            echo "=========================================="
            if sudo test -f /etc/mindgarden/dev.env; then
              # shellcheck disable=SC1091
              set -a
              # Source without printing; unset display of xtrace
              . /etc/mindgarden/dev.env
              set +a
              if command -v mysql >/dev/null 2>&1 && [ -n "${DB_HOST:-}" ] && [ -n "${DB_NAME:-}" ] && [ -n "${DB_USERNAME:-}" ]; then
                echo "DB_HOST=<redacted-present> DB_NAME=${DB_NAME} DB_USERNAME=<redacted-present>"
                mysql -h "$DB_HOST" -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_NAME" --batch --silent \
                  -e "SELECT id, LEFT(password, 7) AS password_prefix, CHAR_LENGTH(password) AS password_length, is_active, lifecycle_state FROM users WHERE is_deleted = 0 ORDER BY id ASC LIMIT 5;" \
                  -e "SELECT COUNT(*) AS non_bcrypt_like_count FROM users WHERE is_deleted = 0 AND (password IS NULL OR password NOT LIKE '\$2%');" \
                  2>/dev/null || echo "mysql_query_failed"
                unset DB_PASSWORD DB_USERNAME 2>/dev/null || true
              else
                echo "mysql client missing or DB_* incomplete (keys only checked; values not printed)"
              fi
            else
              echo "skip SQL: no /etc/mindgarden/dev.env"
            fi
            echo ""

            echo "6) journalctl — TestData / password-reset patterns (today + last 7 days)"
            echo "=========================================="
            TODAY_START="$(TZ=Asia/Seoul date '+%Y-%m-%d 00:00:00')"
            SEVEN_DAYS_AGO="$(TZ=Asia/Seoul date -d '7 days ago' '+%Y-%m-%d 00:00:00' 2>/dev/null || TZ=Asia/Seoul date -v-7d '+%Y-%m-%d 00:00:00' 2>/dev/null || echo '')"
            echo "today_start=$TODAY_START seven_days_ago=$SEVEN_DAYS_AGO"
            JOURNAL_TESTDATA_RE='테스트 사용자 비밀번호 재설정|verify-password|create-test-data|reset-password|TempPassword|임시 비밀번호|비밀번호 변경|setPassword|테스트용 데이터 생성|비밀번호 검증'
            echo "--- today ---"
            sudo journalctl -u mindgarden-dev --since "$TODAY_START" --no-pager 2>/dev/null \
              | grep -E "$JOURNAL_TESTDATA_RE" \
              | sed -E 's/(newPassword|password|passwd)=[^ &"]*/\1=<redacted>/gi' \
              | tail -n 150 \
              || echo "(no matching journal lines today)"
            echo "--- last 7 days (tail) ---"
            if [ -n "$SEVEN_DAYS_AGO" ]; then
              sudo journalctl -u mindgarden-dev --since "$SEVEN_DAYS_AGO" --no-pager 2>/dev/null \
                | grep -E "$JOURNAL_TESTDATA_RE" \
                | sed -E 's/(newPassword|password|passwd)=[^ &"]*/\1=<redacted>/gi' \
                | tail -n 200 \
                || echo "(no matching journal lines in 7 days)"
            else
              echo "skip 7-day window: could not compute SEVEN_DAYS_AGO"
            fi
            echo ""

            echo "7) isDev / IS_DEV related KEY NAMES only (values redacted)"
            echo "=========================================="
            echo "--- systemctl Environment (isDev/IS_DEV/DEV-ish keys) ---"
            sudo systemctl show mindgarden-dev -p Environment --no-pager 2>/dev/null | tr ' ' '\n' | while IFS= read -r part; do
              case "$part" in
                *=*)
                  key="${part%%=*}"
                  case "$key" in
                    *[Ii][Ss]_[Dd][Ee][Vv]*|*[Ii][Ss][Dd][Ee][Vv]*|*isDev*|*IS_DEV*|*isDevelopment*|*IS_DEVELOPMENT*)
                      echo "${key}=<redacted>"
                      ;;
                  esac
                  ;;
              esac
            done
            echo "--- /etc/mindgarden/dev.env key names matching isDev/IS_DEV/DEV ---"
            if sudo test -f /etc/mindgarden/dev.env; then
              sudo grep -E '^(isDev|IS_DEV|isDevelopment|IS_DEVELOPMENT|SPRING_PROFILES_ACTIVE)=' /etc/mindgarden/dev.env 2>/dev/null \
                | sed -E 's/=.*$/=<redacted>/' \
                || echo "(no isDev/IS_DEV/SPRING_PROFILES_ACTIVE keys)"
              echo "--- broader DEV-related key inventory (names only) ---"
              sudo grep -E 'isDev|IS_DEV|isDevelopment|DEVELOPMENT|SPRING_PROFILES' /etc/mindgarden/dev.env 2>/dev/null \
                | sed -E 's/=.*//' \
                | sort -u \
                || echo "(no matching key names)"
            else
              echo "MISSING: /etc/mindgarden/dev.env"
            fi
            echo "--- app yml on disk (key names only; prefer /var/www /etc, not jar guts) ---"
            for ymlcand in \
              /var/www/mindgarden-dev/config/application-dev.yml \
              /var/www/mindgarden-dev/application-dev.yml \
              /etc/mindgarden/application-dev.yml \
              /var/www/mindgarden-dev/config/application.yml; do
              if sudo test -f "$ymlcand"; then
                echo "file=$ymlcand"
                sudo grep -E '^\s*(isDev|isDevelopment|spring\.profiles)' "$ymlcand" 2>/dev/null \
                  | sed -E 's/:.*$/: <redacted>/' \
                  || echo "(no isDev keys in file)"
              fi
            done
            echo ""

            echo "8) SQL SELECT-only — recent password-shape samples (masked email, no hash dump)"
            echo "=========================================="
            if sudo test -f /etc/mindgarden/dev.env; then
              # shellcheck disable=SC1091
              set -a
              . /etc/mindgarden/dev.env
              set +a
              if command -v mysql >/dev/null 2>&1 && [ -n "${DB_HOST:-}" ] && [ -n "${DB_NAME:-}" ] && [ -n "${DB_USERNAME:-}" ]; then
                mysql -h "$DB_HOST" -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_NAME" --batch --table \
                  -e "SELECT id, role, LEFT(password, 7) AS password_prefix, CHAR_LENGTH(password) AS password_length, is_active, lifecycle_state, updated_at, is_password_changed, CONCAT(LEFT(IFNULL(email,''), 2), '***') AS email_masked, SHA2(IFNULL(email,''), 256) AS email_sha2 FROM users WHERE is_deleted = 0 ORDER BY updated_at DESC LIMIT 10;" \
                  -e "SELECT COUNT(*) AS non_bcrypt_like_count FROM users WHERE is_deleted = 0 AND (password IS NULL OR password NOT LIKE '\$2%');" \
                  -e "SELECT COUNT(*) AS updated_since_deploy_window FROM users WHERE is_deleted = 0 AND updated_at >= '2026-09-04 14:00:00';" \
                  -e "SELECT id, role, LEFT(password, 7) AS password_prefix, CHAR_LENGTH(password) AS password_length, is_active, lifecycle_state, updated_at, is_password_changed, CONCAT(LEFT(IFNULL(email,''), 2), '***') AS email_masked FROM users WHERE is_deleted = 0 AND updated_at >= '2026-09-04 14:00:00' ORDER BY updated_at DESC LIMIT 10;" \
                  2>/dev/null || echo "mysql_query_failed (section 8)"
                unset DB_PASSWORD DB_USERNAME 2>/dev/null || true
              else
                echo "mysql client missing or DB_* incomplete"
              fi
            else
              echo "skip SQL section 8: no /etc/mindgarden/dev.env"
            fi
            echo ""

            echo "9) nginx/access — /reset-password|/api/v1/test|/api/test (today + 7 days, newPassword masked)"
            echo "=========================================="
            ACCESS_RE='(/reset-password|/api/v1/test|/api/test)'
            MASK_PW="s/(newPassword|password|passwd)=[^ &\"]*/\\1=<redacted>/gi"
            TODAY_YMD="$(TZ=Asia/Seoul date '+%d/%b/%Y')"
            echo "nginx_today_token=$TODAY_YMD (common log date)"
            for logfile in \
              /var/log/nginx/mindgarden.dev.core-solution.co.kr.access.log \
              /var/log/nginx/api.dev.core-solution.co.kr.access.log \
              /var/log/nginx/dev.core-solution.co.kr.access.log \
              /var/log/nginx/tenant.dev.core-solution.co.kr.access.log \
              /var/log/nginx/access.log; do
              if sudo test -f "$logfile"; then
                echo "--- $logfile (today match, path-focused) ---"
                sudo grep -E "$ACCESS_RE" "$logfile" 2>/dev/null \
                  | grep -F "$TODAY_YMD" \
                  | sed -E "$MASK_PW" \
                  | awk '{
                      for (i=1;i<=NF;i++) if ($i ~ /^\"?(GET|POST|PUT|DELETE|PATCH)$/) { print $(i), $(i+1); next }
                    }' \
                  | sort | uniq -c | sort -rn | head -n 40 \
                  || echo "(no today matches)"
                echo "--- $logfile (recent lines any day, last 30) ---"
                sudo grep -E "$ACCESS_RE" "$logfile" 2>/dev/null \
                  | sed -E "$MASK_PW" \
                  | tail -n 30 \
                  || echo "(no matches)"
              else
                echo "missing: $logfile"
              fi
            done
            echo "--- rotated logs (*access.log*) last 7 days grep (tail caps) ---"
            if [ -n "$SEVEN_DAYS_AGO" ]; then
              sudo find /var/log/nginx -maxdepth 1 -type f \( -name '*access.log*' -o -name '*access.log.*.gz' \) 2>/dev/null \
                | while IFS= read -r f; do
                    case "$f" in
                      *.gz)
                        echo "file=$f"
                        sudo zgrep -E "$ACCESS_RE" "$f" 2>/dev/null \
                          | sed -E "$MASK_PW" \
                          | tail -n 20 \
                          || true
                        ;;
                      *)
                        echo "file=$f"
                        sudo grep -E "$ACCESS_RE" "$f" 2>/dev/null \
                          | sed -E "$MASK_PW" \
                          | tail -n 20 \
                          || true
                        ;;
                    esac
                  done
            fi
            echo ""

            echo "=========================================="
            echo "Diagnose complete (no password UPDATE performed)"
            echo "Hypotheses: A=tenant missing (code-confirmed fix); B=TestData reset-password (needs SSH evidence above)"
            echo "=========================================="
